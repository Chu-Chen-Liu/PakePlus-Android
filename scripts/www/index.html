不得掺用氯盐，以防止钢筋锈蚀或结构破坏。","options":[{"key":"A","text":"排出大量蒸汽的车间"},{"key":"B","text":"露天结构"},{"key":"C","text":"预应力混凝土结构"},{"key":"D","text":"薄壁结构"}],"answer":["A","B","C","D"],"explain":"依据：《建筑工程冬期施工规程》JGJ/T 104-2011 第6.1.7","chapter":"线路基础","level":"基础题"},{"type":"check","title":"冬期施工中，下列关于混凝土养护期间温度测量的说法正确的是（ ）。","options":[{"key":"A","text":"采用蓄热法时，每隔4h～6h测量一次"},{"key":"B","text":"采用负温养护法时，每隔2h测量一次"},{"key":"C","text":"采用加热法时，恒温阶段每隔1h测量一次"},{"key":"D","text":"混凝土达到受冻临界强度后可停止测温"}],"answer":["A","B","D"],"explain":"依据：《建筑工程冬期施工规程》JGJ/T 104-2011 第6.9.3","chapter":"线路基础","level":"基础题"},{"type":"check","title":"钢筋焊接接头或焊接制品的质量检验与验收应包括（ ）和（ ）。","options":[{"key":"A","text":"外观质量检查"},{"key":"B","text":"焊接人员技术检查"},{"key":"C","text":"力学性能检验"},{"key":"D","text":"焊接设备检查"}],"answer":["A","C"],"explain":"依据：《钢筋焊接及验收规程》JGJ 18 - 2012第 5.1.1","chapter":"线路基础","level":"进阶题"},{"type":"check","title":"钢筋电弧焊应包括（ ）和熔槽帮条焊接头形式。","options":[{"key":"A","text":"帮条焊"},{"key":"B","text":"搭接焊"},{"key":"C","text":"坡口焊"},{"key":"D","text":"窄间隙焊"}],"answer":["A","B","C","D"],"explain":"依据：《钢筋焊接及验收规程》JGJ 18 - 2012第 4.5.3","chapter":"线路基础","level":"进阶题"},{"type":"check","title":"下列关于钢筋焊接材料的说法，正确的有（ ）。","options":[{"key":"A","text":"焊接用氧气的纯度应大于或等于 99.5%"},{"key":"B","text":"预埋件钢筋焊接接头中的钢板可采用低碳钢或低合金钢"},{"key":"C","text":"二氧化碳气体应符合现行化工行业标准《焊接用二氧化碳》中优等品的规定"},{"key":"D","text":"电渣压力焊只能采用熔炼型 HJ431 焊剂"}],"answer":["A","B","C"],"explain":"依据：《钢筋焊接及验收规程》JGJ 18 - 2012第3.0.4","chapter":"线路基础","level":"进阶题"},{"type":"check","title":"下列选项中符合桩基耐久性规定内容的有（ ）。","options":[{"key":"A","text":"根据设计使用年限进行桩基结构耐久性设计"},{"key":"B","text":"规定二类和三类环境中桩基结构混凝土的基本要求"},{"key":"C","text":"确定桩身裂缝控制等级及最大裂缝宽度限值"},{"key":"D","text":"对四类、五类环境桩基结构，要求使用特定的钢筋"}],"answer":["A","B","C","D"],"explain":"依据：《建筑桩基技术规范》JGJ 94-2008第 3.5","chapter":"线路基础","level":"进阶题"},{"type":"check","title":"下列哪些情况下，桩基应进行沉降计算（ ）。","options":[{"key":"A","text":"设计等级为甲级的非嵌岩桩建筑桩基"},{"key":"B","text":"设计等级为乙级的体型复杂的建筑桩基"},{"key":"C","text":"软土地基多层建筑减沉复合疏桩基础"},{"key":"D","text":"设计等级为丙级的建筑桩基"}],"answer":["A","B","C","D"],"explain":"依据：《建筑桩基技术规范》JGJ 94-2008第3.1.4","chapter":"线路基础","level":"进阶题"},{"type":"check","title":"桩身完整性类别为Ⅲ类桩的特征包括（ ）。","options":[{"key":"A","text":"桩身有明显缺陷，对承载力有影响"},{"key":"B","text":"桩身完整，无缺陷"},{"key":"C","text":"桩身存在严重缺陷"},{"key":"D","text":"缺陷可能导致桩身结构承载力降低"}],"answer":["A","D"],"explain":"依据：《建筑基桩检测技术规范》JGJ 106-2014 表3.5.1","chapter":"线路基础","level":"基础题"},{"type":"check","title":"钻芯法适用于检测混凝土（ ）。","options":[{"key":"A","text":"灌注桩的桩长"},{"key":"B","text":"桩身混凝土强度"},{"key":"C","text":"桩底沉渣厚度"},{"key":"D","text":"桩身完整性"}],"answer":["A","B","C","D"],"explain":"依据：《建筑基桩检测技术规范》JGJ 106-2014第7.1.1","chapter":"线路基础","level":"进阶题"},{"type":"check","title":"预拌砂浆进场时应进行外观检验，并应符合下列规定：（ ）。","options":[{"key":"A","text":"湿拌砂浆应外观均匀，无离析、泌水现象。"},{"key":"B","text":"散装干混砂浆应外观均匀，无结块、受潮现象"},{"key":"C","text":"袋装干混砂浆应包装完整，无受潮现象"},{"key":"D","text":"无需检验"}],"answer":["A","B","C"],"explain":"依据：《预拌砂浆应用技术规程》JGJ/T 223-2010第4.1.2","chapter":"线路基础","level":"基础题"},{"type":"check","title":"芯样试件尺寸偏差及外观质量出现下列哪些情况时，相应的芯样试件不宜进行试验（ ）。","options":[{"key":"A","text":"抗压芯样试件的实际高径比(H/d)小于要求高径比的 0.95或大于1.05。"},{"key":"B","text":"抗压芯样试件端面与轴线的不垂直度超过1°"},{"key":"C","text":"沿芯样试件高度的任 一 直径与平均直径相差超过 1.5mm"},{"key":"D","text":"芯样有较大缺陷"}],"answer":["A","B","C","D"],"explain":"依据：《钻芯法检测混凝土强度技术规程》JGJ/T 384-2016第5.0.6","chapter":"线路基础","level":"进阶题"},{"type":"check","title":"当沉桩施工遇到下列哪些情况时，宜采用植入法或中掘法沉桩（ ）。","options":[{"key":"A","text":"穿越软土层时"},{"key":"B","text":"影响桩身质量、邻近建(构)筑物、地下管线的正常使 用和安全时"},{"key":"C","text":"当遇到密实的砂土、碎(卵)石土等硬土夹层，桩端难 于沉到设计标高时"},{"key":"D","text":"当遇到坚硬岩、较硬岩层或遇有漂石、孤石时"}],"answer":["B","C","D"],"explain":"依据：《预应力混凝土管桩技术标准》JGJ/T 406-2017第3.0.6","chapter":"线路基础","level":"进阶题"},{"type":"check","title":"测距作业应符合下列规定：（ ）。","options":[{"key":"A","text":"测线不宜穿过发热体上空，离地面或障碍物宜在1.3m 以上，不应受到强电磁场的干扰，倾角不宜过大"},{"key":"B","text":"测距应在成像清晰和气象条件良好时进行，阳光下作业 时应遮阳，测距不宜逆光观测，严禁将仪器照准部直对太阳或强 光源"},{"key":"C","text":"在气温较低时作业，测距仪应有一定的预热时间，使仪 器各电子部件达到正常稳定的工作状态时方可开始测距，读数 时，信号指示器指针应在最佳回光信号范围内"},{"key":"D","text":"反射镜应对准照准部，当反射镜背景方向有反光物体时， 应在反射镜后面遮挡"}],"answer":["A","B","C","D"],"explain":"依据：《建筑施工测量标准》JGJ/T 408-2017第5.6.4","chapter":"线路基础","level":"基础题"},{"type":"check","title":"关于砂浆、混凝土使用中，有下列情况之一时，应进行型式检验（ ）。","options":[{"key":"A","text":"新产品或老产品转厂生产的试制定型鉴定"},{"key":"B","text":"正式生产后,如材料、工艺有较大改变,可能影响产品性能时"},{"key":"C","text":"正常生产时,一年至少进行一次检验"},{"key":"D","text":"产品长期停产后,恢复生产时"}],"answer":["A","B","C","D"],"explain":"依据：《砂浆、混凝土防水剂》JC 474-2008第6.1.3","chapter":"线路基础","level":"进阶题"},{"type":"check","title":"钢筋机械连接用螺纹套筒的外观应符合以下要求（ ）。","options":[{"key":"A","text":"套筒外表面可为加工表面或无缝钢管、圆钢的自然表面"},{"key":"B","text":"应无肉眼可见裂纹或其他缺陷"},{"key":"C","text":"套筒表面允许有锈斑或浮锈，不应有锈皮"},{"key":"D","text":"套筒外圆及内孔应有倒角"}],"answer":["A","B","C","D"],"explain":"依据：《钢筋机械连接用套筒》JG/T 163-2013第5.2.1","chapter":"线路基础","level":"基础题"},{"type":"check","title":"建筑防护栏杆的设置应符合下列规定（ ）。","options":[{"key":"A","text":"高层公共建筑的临空防护栏杆宜设实体栏板或半实体栏板"},{"key":"B","text":"阳台防护栏杆宜有栏板，7层及7层以上的住宅和严寒、寒冷地区住宅阳台的防护栏杆宜采用实体栏板"},{"key":"C","text":"楼梯防护栏杆可不设有扶手"},{"key":"D","text":"窗的防护栏杆宜贴窗布置，且不应影响可开启窗扇的正常使用"}],"answer":["A","B","D"],"explain":"依据：《建筑防护栏杆技术标准》JGJ/T 470-2019第4.2.2","chapter":"线路基础","level":"进阶题"},{"type":"check","title":"钢筋二氧化碳气体保护电弧焊时，应根据焊机性能、焊接接头形状、焊接位置等条件选用焊接工艺参数，下列选项中属于焊接工艺参数的是（ ）。","options":[{"key":"A","text":"焊接电流"},{"key":"B","text":"电弧电压(弧长)"},{"key":"C","text":"焊接速度"},{"key":"D","text":"焊丝产地"}],"answer":["A","B","C"],"explain":"依据：《钢筋焊接及验收规程》JGJ 18-2012第4.5.2","chapter":"线路基础","level":"基础题"},{"type":"check","title":"根据《普通混凝土用砂、石质量及检验方法标准》，砂中氯离子含量应符合下列规定（ ）。","options":[{"key":"A","text":"对于钢筋混凝土用砂，其氯离子含量不得大于0.06%"},{"key":"B","text":"对于预应力混凝土用砂，其氯离子含量不得大于0.02%"},{"key":"C","text":"若砂中氯离子含量超标，可通过水洗处理后继续使用"},{"key":"D","text":"氯离子含量超标不影响质量"}],"answer":["A","B"],"explain":"依据：《普通混凝土用砂、石质量及检验方法标准》JGJ 52-2006第3.1.10","chapter":"线路基础","level":"基础题"},{"type":"check","title":"混凝土企业设备洗刷水不宜用于（ ）；不得用于使用碱活性或潜在碱活性骨料的混凝土。","options":[{"key":"A","text":"预应力混凝土"},{"key":"B","text":"装饰混凝土"},{"key":"C","text":"加气混凝土"},{"key":"D","text":"暴露于腐蚀环境的混凝土"}],"answer":["A","B","C","D"],"explain":"依据：《混凝土用水标准》JGJ 63-2006第3.1.6","chapter":"线路基础","level":"进阶题"},{"type":"check","title":"当设计有要求或有下列哪些情况时，施工前应进行试验桩检测并确定单桩极限承载力（ ）。","options":[{"key":"A","text":"设计等级为甲级的桩基"},{"key":"B","text":"无相关试桩资料可参考的设计等级为乙级的桩基"},{"key":"C","text":"地基条件复杂、基桩施工质量可靠性低"},{"key":"D","text":"本地区采用的新桩型或采用新工艺成桩的桩基"}],"answer":["A","B","C","D"],"explain":"依据：《建筑基桩检测技术规范》JGJ 106-2014第3.1.2","chapter":"线路基础","level":"进阶题"},{"type":"check","title":"钢筋机械连接技术中，直螺纹接头的现场加工应符合下列规定：（ ）。","options":[{"key":"A","text":"钢筋端部应切平或镦平后加工螺纹"},{"key":"B","text":"镦粗头不得有与钢筋轴线相垂直的横向裂纹"},{"key":"C","text":"钢筋丝头长度应满足企业标准中产品设计要求，公差应为0~2.0p(p为螺距)"},{"key":"D","text":"钢筋丝头宜满足6f级精度要求，应用专用直螺纹量规 检验，通规能顺利旋入并达到要求的拧入长度，止规旋入不得超过3p。抽检数量10%,检验合格率不应小于85%"}],"answer":["A","B","C"],"explain":"依据：《钢筋机械连接技术规程》JGJ 107-2016第6.1.2","chapter":"线路基础","level":"基础题"},{"type":"check","title":"钢筋焊接接头试验方法中，剪切试验的专用夹具应能满足下列哪些技术要求（ ）。","options":[{"key":"A","text":"沿受拉钢筋轴线施加荷载"},{"key":"B","text":"沿受压钢筋轴线施加荷载"},{"key":"C","text":"使受拉钢筋自由端能沿轴线方向滑动"},{"key":"D","text":"对试样横向钢筋适当固定，横向钢筋支点间距应小，以 防止产生过大的弯曲变形和转动"}],"answer":["A","C","D"],"explain":"依据：《钢筋焊接接头试验方法标准》JGJ/T 27-2014第5.2.3","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"混凝土拌合物在运输和浇筑成型过程中可以加水。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"混凝土拌合物在运输和浇筑成型过程中严禁加水。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"接地装置材料可采用铝导体作为接地极或接地线｡","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"接地装置材料选择应符合下列规定：\n1.除临时接地装置外,接地装置采用钢材时均应热镀锌,水平敷设的应采用热镀锌的圆钢和扁钢,垂直敷设的应采用热镀锌的角钢､钢管或圆钢｡\n2.当采用扁铜带､铜绞线､铜棒､铜覆钢(圆线､绞线)､锌覆钢等材料作为接地装置时,其选择应符合设计要求｡\n3.不应采用铝导体作为接地极或接地线｡","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"灌注桩采用泥浆护壁成孔时，应采取导流沟和泥浆池等排浆及储浆措施。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《建筑工程绿色施工规范》GB/T 50905-2014 第6.3.2","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"施工现场宜对噪声进行实时监测；施工场界环境噪声排放昼间不应超过70dB(A),夜间不应超过55dB(A)。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《建筑工程绿色施工规范》GB/T 50905-2014 第3.3.2","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"不同品种、不同厂家、不同标号的水泥不应在同一个连续浇筑体中混合使用。同一基础中使用不同水泥时,应分别制作试块,并作记录。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110～750kV架空输电线路施工及验收规范》 GB 50233-2014 第6.1.4","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"试块应在现场浇筑过程中随机取样制作,并应采用同条件养护。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"试块应在现场浇筑过程中随机取样制作,并应采用标准养护。当有特殊需要时,应加做同条件养护试块。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"接地沟开挖的长度和深度应符合设计要求且可以有负偏差,影响接地体与上壤接触的杂物应清除。在山坡上宜沿等高线开挖接地沟。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"接地沟开挖的长度和深度应符合设计要求且不得有负偏差,影响接地体与上壤接触的杂物应清除。在山坡上宜沿等高线开挖接地沟。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"根开是指两电杆根部或塔脚之间的水平距离。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《电气装置安装工程66kV及以下架空电力线路施工及验收规范》 GB 50173-2014 第2.0.8","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"预拌混凝土质量验收应以出厂检验结果作为依据。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"预拌混凝土质量验收应以交货检验结果作为依据。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"复合硅酸盐水泥的强度等级分为32.5、32.5R、42.5、42.5R、52.5、52.5R六个等级。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"复合硅酸盐水泥的强度等级分为42.5、42.5R、52.5、52.5R四个等级。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"高强混凝土和有抗冻要求的混凝土不宜采用硅酸盐水泥或普通硅酸盐水泥。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"高强混凝土和有抗冻要求的混凝土宜采用硅酸盐水泥或普通硅酸盐水泥。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"对于采用硅酸盐水泥配制的混凝土，采用浇水和潮湿覆盖的养护时间不得少于14d。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"对于采用硅酸盐水泥、普通硅酸盐水泥或矿渣硅酸盐水泥配制的混凝土，采用浇水和潮湿覆盖的养护时间不得少于7d。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"模板拆除属于施工过程，不宜作为模板工程的验收内容加以要求。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《混凝土结构工程施工质量验收规范》 GB 50204-2015“4 模板分项工程”","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"脱模剂宜在支模前涂刷，不可现场涂刷。现场涂刷脱模剂容易沾污钢筋和混凝土接槎处，可能会对混凝土结构受力性能造成不利影响，故应避免。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"工程实践中，当有条件时脱模剂宜在支模前涂刷，当受施工条件限制或支模工艺不同时，也可现场涂刷。现场涂刷脱模剂容易沾污钢筋和混凝土接槎处，可能会对混凝土结构受力性能造成不利影响，故应避免。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"选择脱模剂时，应选择使用废机油作为脱模剂。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"选择脱模剂时，应避免使用可能会对混凝土结构受力性能造成不利影响（如对混凝土中钢筋具有腐蚀性）的脱模剂，或影响混凝土表面后期装修（如使用废机油等）的脱模剂。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"大体积混凝土施工遇雨雪天，严禁进行混凝土浇筑。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"雨雪天不宜露天浇筑混凝土，需施工时，应采取混凝土质量保证措施。浇筑过程中突遇大雨或大雪天气时，应及时在结构合理部位留置施工缝，并应中止混凝土浇筑。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"灌注桩基础施工时，水下混凝土的灌注可以中断。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"水下混凝土的灌注应连续进行，不得中断。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"灌注桩应按设计要求验桩,基础混凝土强度等级应以试块为依据。试块的制作应每桩取一组,承台及连梁试块的制作数量应每基取一组。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～750kV架空输电线路施工及验收规范》 GB 50233-2014 第6.3.10","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"当室外日平均气温连续5天高于5℃时可解除冬期施工。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～750kV架空输电线路施工及验收规范》 GB 50233-2014 第6.6.1","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"预拌混凝土每次取样应至少制作一组标准养护试件。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《预拌混凝土》 GB/T 14902-2012 第4.2.1","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"混凝土结构现场检测应分为工程质量检测和结构性能检测。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《混凝土结构现场检测技术标准》 GB/T 50784-2013 第3.1.1","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"现场检测工作应由检测机构不少于一名检测人员承担，所有进入现场的检测人员应经过培训。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"现场检测工作应由本机构不少于二名检测人员承担，所有进入现场的检测人员应经过培训。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"建筑工程施工质量验收应划分为单位工程、分部工程、分项工程和检验批。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《建筑工程施工质量验收统一标准》 GB 50300-2013 第4.0.1","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"经返修或加固处理仍不能满足安全或重要使用要求的分部工程及单位工程，可以组织验收。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"经返修或加固处理仍不能满足安全或重要使用要求的分部工程及单位工程，严禁验收。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"不同品种的水泥可以在同一个浇筑体中混合使用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"不同品种的水泥不得在同一个浇筑体中混合使用。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"未经处理的海水严禁用于钢筋混凝土和预应力混凝土。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《混凝土质量控制标准》 GB 50164-2011 第2.6.3","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"水泥出厂超过3个月(硫铝酸盐水泥超过45d), 应进行复检，合格者方可使用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《混凝土质量控制标准》 GB 50164-2011 第6.2.3","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"矿物掺合料存储期超过3个月时，应进行复检，合格者方可使用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"矿物掺合料存储时，应有明显标记，不同矿物掺合料以及水泥不得混杂堆放，应防潮防雨，并应符合有关环境保护的规定；矿物掺合料存储期超过3个月时，应进行复检，合格者方可使用。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"现浇混凝土采用养护剂养护时，应在拆模并经表面检查合格后立即涂刷，涂刷后可以浇水。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"采用养护剂养护时，应在拆模并经表面检查合格后立即涂刷，涂刷后不得浇水。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"大体积混凝土是指混凝土结构物实体最小尺寸不小于2m的大体量混凝土。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"大体积混凝土是指混凝土结构物实体最小尺寸不小于1m的大体量混凝土，或预计会因混凝土中胶凝材料水化引起的温度变化和收缩而导致有害裂缝产生的混凝土。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"重力式挡墙的基础埋置深度应从坡脚排水沟底算起。受水流冲刷时，埋深应从预计冲刷底面算起。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《建筑边坡工程技术规范》 GB 50330-2013 第11.3.5","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"浆砌块石、条石挡墙的施工所用砂浆宜采用机械拌合。块石、条石表面应清洗干净，砂浆填塞应饱满，严禁干砌。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《建筑边坡工程技术规范》 GB 50330-2013 第11.4.1","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"浇筑竖向尺寸较大的结构物时，应分层浇筑，每层浇筑厚度宜控制在300～350mm。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《混凝土质量控制标准》 GB 50164-2011 第6.6.9","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"水胶比指水泥混凝土或砂浆中拌和水（不包括骨料吸收的水）与胶凝材料的质量比。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～750kV架空输电线路施工及验收规范》 GB 50233-2014 第2.0.4","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"对砂、石等无质量检验资料的原材料，应抽样并经有检验资质的单位检验，合格后方可采用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～750kV架空输电线路施工及验收规范》 GB 50233-2014 第3.0.1","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"水泥保管时应防止受潮。不同品种、不同等级、不同厂家、 不同批号的水泥应分别堆放，标识应清晰，可以混用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"水泥保管时应防止受潮。不同品种、不同等级、不同厂家、不同批号的水泥应分别堆放，标识应清晰，不得混用。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"相对高差是指地脚螺栓基础抹面后的相对高差或插入式基础的操平印记的相对高差。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～750kV架空输电线路施工及验收规范》 GB 50233-2014 第6.1.9","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"基础混凝土强度应以试块强度为依据。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～750kV架空输电线路施工及验收规范》 GB 50233-2014 第6.1.10","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"混凝土用水中，当骨料具有碱活性时，主要控制项目应包括碱含量。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《混凝土质量控制标准》 GB 50164-2011 第2.6.2","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"水泥保管时应防止受潮;不同品种、不同等级、不同厂家、不同批号的水泥应分别堆放，标识应清晰，可以就近混用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"水泥保管时应防止受潮;不同品种、不同等级、不同厂家、不同批号的水泥应分别堆放，标识应清晰，不得混用。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"当混凝土有抗渗指标要求时,所用水泥的铝酸三钙含量宜大于8%。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"当混凝土有抗渗指标要求时,所用水泥的铝酸三钙含量不宜大于 8%。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"首次灌注混凝土时，导管一次埋入混凝土灌注面以下不应少于 0.6m。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"首次灌注混凝土时，导管一次埋入混凝土灌注面以下不应少于 0.8m。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"随着混凝土的灌注，应适当提升和拆卸导管，导管提升后其底端埋入混凝土深度宜为2m~6m，不得把导管底端提出混凝土灌注面。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路大跨越工程施工及验收规范》DL 5319-2014第6.3.8","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"混凝土应细致捣实，使新旧混凝土紧密结合。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010第6.1.7","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"在负温条件下养护时，可以浇水，外露表面必须用保温、 保湿的材料覆盖。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"在负温条件下养护时，严禁浇水，外露表面必须用保温、保湿的材料覆盖。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"混凝土的初期养护温度，应低于防冻剂的规定温度。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"混凝土的初期养护温度，不得低于防冻剂的规定温度。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"不同品种、不同等级、不同厂家及不同批次的水泥不应在同一个浇筑体中混合使用。同一基基础中使用不同水泥时，可以不分别制作试块并作记录。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"不同品种、不同等级、不同厂家及不同批次的水泥不应在同一个浇筑体中混合使用。同一基基础中使用不同水泥时，应分别制作试块并作记录，","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"当转角、终端塔设计要求采取预偏时，同一基地脚螺栓基础的四个立柱顶面应按预偏值抹成斜平面，不应共在一个整斜平面或平行平面内。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"当转角、终端塔设计要求采取预偏时，同一基地脚螺栓基础的四个立柱顶面应按预偏值抹成斜平面，并应共在一个整斜平面或平行平面内。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"位于山坡、河边或沟旁等易冲刷地带基础的防护，应按设计要求进行施工。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010第6.1.9","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"基础拆模经表面质量检查合格后不应立即回填，并对基础外露部分加遮盖物，按规定期限继续浇水养护，养护时应使遮盖物及基础周围的土始终保持湿润。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"基础拆模经表面质量检查合格后应立即回填，并对基础外露部分加遮盖物，按规定期限继续浇水养护，养护时应使遮盖物及基础周围的土始终保持湿润","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"采用养护剂养护时,应在拆模并经表面检查合格后立即涂刷，涂刷后不再浇水。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010第6.1.12","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"水下混凝土的灌注应连续进行，可以中断。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"水下混凝土的灌注应连续进行，不得中断。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"混凝土灌注到地面后应清除桩顶部浮浆层，单桩基础可安装桩头模板，找正和安装地脚螺栓，灌注桩头混凝土。桩头模板与灌注桩直径应相吻合，严禁出现凹凸现象。地面以上桩基础应达到表面光滑、工艺美观。群桩基础的承台应在桩质量验收合格后施工。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010第6.3.9","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"应优先采用现场搅拌站搅拌混凝土，或预拌混凝土。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"应优先采用预拌混凝土，或采用混凝土现场搅拌站搅拌混凝土。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"冬期施工不得在已冻结的基坑底面浇制混凝土，已开挖的基坑底面及掏挖基础的坑壁应有防冻措施。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010第6.5.7","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"测量用的仪器及量具在使用前必须进行检查。经纬仪最小角度读数不应大于3'。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"测量用的仪器及量具在使用前必须进行检查。经纬仪最小角度读数不应大于1'。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"铁塔基础的坑深应以设计施工基面为基准。当设计施工基面为零时,铁塔基础坑深应以设计中心桩处自然地面标高为基准。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010第5.0.2","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"接地沟开挖的长度和深度应符合设计要求并不得有负偏差，沟中影响接地体与土壤接触的杂物应清除。在山坡上挖接地沟时，宜沿等高线开挖。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010第5.0.5","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"钢筋进场应分类堆放和标识。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《电力建设施工技术规范 第1部分：土建结构工程》DL/T 5190.1-2022第4.3.2","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"钢筋接头宜设置在受力较大处。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"钢筋接头宜设置在受力较小处。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"绑扎钢筋的扎丝，其端头应面向钢筋保护层。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"绑扎钢筋的扎丝，其端头应背问钢筋保护层。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"当受力钢筋采用机械连接接头或焊接接头时，设置在同一连接区段内的接头宜相互错开，并符合设计要求及国家现行标准的规定。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《电力建设施工技术规范 第1部分：土建结构工程》DL/T 5190.1-2022第4.3.4","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"采用搅拌运输车运输混凝土，当混凝土坍落度损失较大不能满足施工要求时，可以加水。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"采用搅拌运输车运输混凝土，当混凝土坍落度损失较大不能满足施工要求时，严禁加水，可在运输罐内加入适量的与原配合比相同成分的减水剂，减水剂加入量应事先由试验确定，并应做好记录。加入减水剂后，搅拌运输车罐体应快速旋转搅拌均匀，达到要求后再浇筑。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"混凝土拌和物工作性包括流动性、黏聚性和保水性。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《电力建设施工技术规范 第1部分：土建结构工程》DL/T 5190.1-2022术语2.0.4","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"天然地基基底表面应平整，可以采用填土的方法找平基坑。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"天然地基基底表面应平整，严禁采用填土的方法找平基坑。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"从事钢筋焊接施工的焊工必须持有钢筋焊工考试合格证，并应按照合格证规定的范围上岗操作。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《 电力建设施工质量验收规程 第1部分：土建工程》DL/T 5210.1-2021附录 C 钢筋焊接及机械连接接头质量标准和检验方法表C.0.3","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"经有资质的检测单位检测鉴定达不到设计要求、但经原设计单位核算认可满足结构安全和使用功能的检验批，可予以验收。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《 电力建设施工质量验收规程 第1部分：土建工程》DL/T 5210.1-2021第3.0.8","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"岩石锚杆基础，主控项目中孔深为抽样检查。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"岩石锚杆基础，主控项目中孔深为全数检查。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"对混凝土强度或内部质量存疑时，可采取无损检测以及钻孔取芯、压水试验等方法进行检查复核。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《水工混凝土施工规范》DL/T 5144-2015第11.4.3","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"现场混凝土强度检验以抗压强度为主，必须以100mm立方体试件、标准养护条件下的抗压强度为标准。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"现场混凝土强度检验以抗压强度为主，并以150mm立方体试件、标准养护条件下的抗压强度为标准。当采用非标准尺寸试件时，应换算成标准尺寸试件的抗压强度进行评价。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"岩石、掏挖基础分坑和开挖质量检验标准及检查方法中，基坑底及坑口断面尺寸不得有负误差。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路大跨越工程施工质量检验及评定规程》DL/T 5732-2016 表4.2.4","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"水平接地装置质量检验评定标准及检查方法中，接地体埋深及埋设长度属于主控项目。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"水平接地装置质量检验评定标准及检查方法中，属于一般项目的有接地体埋深及埋设长度、接地降阻剂、接地体敷设、接地体防腐、回填土、接地引下线安装。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"防护设施质量检验评定标准及检查方法中，排水沟属于主控项目。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"防护设施质量检验评定标准及检查方法属于主控项目有基础护坡、挡墙、防洪堤。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"不同品种的水泥不得在同一个连续浇筑体中混合使用，同一基基础中使用不同水泥时，应分别制作试块并作记录。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路大跨越工程施工及验收规范》DL5319-2014第6.1.8","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"混凝土试块应在现场浇制过程中随机取样制作，并应采用同条件养护。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"混凝土试块应在现场浇制过程中随机取样制作，并应采用标准养护。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"灌注水下混凝土应连续施工，每根桩的灌注时间应按初盘混凝土的初凝时间控制。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路大跨越工程施工及验收规范》DL5319-2014第6.3.9","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"配制冬期施工的混凝土，应选用普通硅酸盐水泥。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"配制冬期施工的混凝土，宜选用硅酸盐水泥或普通硅酸盐水泥。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"当需检查混凝土受冻临界强度、混凝土拆模强度等，需增加混凝土试块的留置数量。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路大跨越工程施工及验收规范》DL5319-2014第6.5.14","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"岩石基础锚筋或地脚螺栓的埋入深度不得小于设计值，安装后宜设置临时固定措施。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"岩石基础锚筋或地脚螺栓的埋入深度不得小于设计值，安装后应有临时固定措施。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"接地电阻的测量可采用接地装置专用测量仪表。所测得的接地电阻值应不大于设计工频接地电阻值。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路大跨越工程施工及验收规范》DL/T5319-2014第9.0.7","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"基础施工测量的内容包括分坑与坑深测量、基础几何尺寸的测量。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《电力工程施工测量标准》DL/T 5578-2020第10.2.10","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"杆(塔)位档距的复测限差应不大于档距的2%。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"杆(塔)位档距的复测限差应不大于档距的1%。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"原材料及器材应保管期限超过规定,需重新进行检验并根据检验结果确定是否使用或降级使用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规范》DL/T5235-2010第3.0.6","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"接地沟开挖的长度和深度应符合设计要求并不得有正偏差，沟中影响接地体与土壤接触的杂物应清除。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"接地沟开挖的长度和深度应符合设计要求并不得有负偏差，沟中影响接地体与土壤接触的杂物应清除。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"水下混凝土的灌注应连续进行，不得中断。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规范》DL/T5235-2010第6.3.8","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"施工单位内部质量检验，应采用三级检验制度。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工质量检验及评定规程》DL/T5236-2010第4.0.3","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"分坑前应对施工桩位和施工基面进行校核，符合设计图纸和GB 50233《110~750kV 架空送电线路施工及验收规范》要求方可分坑。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《电力工程施工测量标准》DL/T 5578-2020第10.2.11","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"输电线路基础施工测量应根据设计图纸和施工方案的有关要求进行，宜采用极坐标法。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《电力工程施工测量标准》DL/T 5578-2020第10.2.9","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"现场浇筑基础应采取措施,防止泥土等杂物混入混凝土中。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路大跨越工程施工及验收规范》DL5319-2014第6.2.2","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"日平均温度低于0℃时，混凝土基础不得浇水养护。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"日平均温度低于5℃时，混凝土基础不得浇水养护。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"对砂、石等无质量检验资料的原材料，经抽样检测合格后方可采用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"原材料及器材应符合下列规定：对砂、石等无质量检验资料的原材料，应抽样并经有检验资质的单位检验，合格后方可采用。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"原材料及器材未按标准规定取样或试样不具代表性者,，应重新检验，并根据检验结果确定是否使用或降级使用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～1000kV 架空输电线路施工及验收规范》Q/GDW 10115—2022  第5.3条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"当采用新型原材料及器材时，经外观检测及试验合格，并证明其质量满足设计要求和相关标准后方可使用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"当采用新型原材料及器材时，应经试验合格并通过专业部门的技术鉴定，证明其质量满足设计要求和相关标准后方可使用。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"测量及检查用的仪器、仪表、量具等，在使用前应进行检查，应至少每半年校准一次。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"6.1 测量及检查用的仪器、仪表、量具等，在使用前应进行检查，应至少每年校准一次。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"测量时，当杆塔位中心桩或直线桩的桩间距离相对设计值的偏差大于 1%时，应查明原因予以纠正。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～1000kV 架空输电线路施工及验收规范》Q/GDW 10115—2022  第6.6条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"多年冻土大开挖基坑宜选择常温天气，采用机械连续快速开挖，避免冻土受扰动；坑深允许偏差为 0～+150mm。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"7.7多年冻土大开挖基坑宜选择寒冷天气，采用机械连续快速开挖，避免冻土受扰动；坑深允许偏差为 0～+100mm。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"软弱地基基坑开挖时应采取措施，避免对承力层产生扰动。泥水坑、水坑或流沙坑开挖应采取排水或降低水位的措施。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～1000kV 架空输电线路施工及验收规范》Q/GDW 10115—2022 第7.6条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"杆塔基础的坑深应以设计施工基面为基准。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～1000kV 架空输电线路施工及验收规范》Q/GDW 10115—2022 第7.9条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"杆塔现浇基础坑深与设计坑深偏差大于+150mm 时，其超深部分应铺石灌浆。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"7.11杆塔现浇基础坑深与设计坑深偏差大于+100mm 时，其超深部分应铺石灌浆。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"石坑应以石子与土按 3:1 的比例掺和后回填夯实。石坑回填应密实，回填过程中石块不得相互叠加，并应将石块间缝隙用碎石或砂土充实。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～1000kV 架空输电线路施工及验收规范》Q/GDW 10115—2022 第7.16条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"接地沟宜选取未掺有石块及其他杂物的素土回填并应夯实，回填后应筑有防沉层，其高度应为100～300mm，工程移交时回填土不得低于地面。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～1000kV 架空输电线路施工及验收规范》Q/GDW 10115—2022 第7.19条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"接地沟开挖的长度和深度应符合设计要求且不得有正偏差，影响接地体与土壤接触的杂物应清除。在山坡上宜沿等高线开挖。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"接地沟开挖的长度和深度应符合设计要求且不得有负偏差，影响接地体与土壤接触的杂物应清除。在山坡上宜沿等高线开挖。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"不同品种、不同厂家、不同标号的水泥可以在同一个连续浇筑体中混合使用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"8.1.6不同品种、不同厂家、不同标号的水泥不应在同一个连续浇筑体中混合使用。同一基基础中使用不同水泥时，应分别制作试块并作记录。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"当相邻层混凝土初凝后浇筑上层混凝土时，或同一浇注体应分两次浇筑时，二次混凝土浇筑应符合相关规定。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～1000kV 架空输电线路施工及验收规范》Q/GDW 10115—2022 第8.1.13条","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"插入式基础的主角钢（钢管）应进行找正并固定牢固，在浇筑中应抽查其位置的准确性。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"插入式基础的主角钢（钢管）应进行找正并固定牢固，在浇筑中应随时检查其位置的准确性。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"水下混凝土的灌注应连续进行，不得中断，每根桩的灌注时间应按初盘混凝土的初凝时间控制。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～1000kV 架空输电线路施工及验收规范》Q/GDW 10115—2022 第8.3.8条","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"掺用防冻剂混凝土养护时， 模板和保温层在混凝土达到要求并冷却到 5℃后方可拆除，当拆模后混凝土表面温度与环境温度之差大于 25℃时，应对混凝土采用保温材料覆盖养护。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"8.7.11 掺用防冻剂混凝土养护应符合下列规定C 模板和保温层在混凝土达到要求并冷却到 5℃后方可拆除，当拆模后混凝土表面温度与环境温度之差大于 15℃时，应对混凝土采用保温材料覆盖养护。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"高温施工混凝土配合比设计除应符合相关规定外，混凝土坍落度不宜小于 100mm。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"8.8.3高温施工混凝土配合比设计除应符合相关规定外，尚应符合下列规定：d)混凝土坍落度不宜小于 70mm。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"雨期施工期间，对水泥和掺合料应采取防水和防潮措施，并应对粗、细骨料含水率随时监测， 不得随意调整混凝土配合比。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"8.9.1 雨期施工期间，对水泥和掺合料应采取防水和防潮措施，并应对粗、细骨料含水率随时监测， 及时调整混凝土配合比。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"多年冻土地区采用钻孔桩基础时，宜采用螺旋钻机成孔或旋挖钻机成孔，不宜采用普通冲击钻成孔。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～1000kV 架空输电线路施工及验收规范》Q/GDW 10115—2022 第8.10.5条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"架空输电线路工程质量验收应按检验批、分项工程、分部工程、单位工程依次进行，分为优良与合格两个等级。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"4.2.1架空输电线路工程质量验收应按检验批、分项工程、分部工程、单位工程依次进行，分为合格与不合格两个等级。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"当工程质量不符合要求时，经有资质的检测单位检测鉴定达不到设计要求、但经原设计单位核算认可能够满足结构安全和使用功能的检验批，可予以验收。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～1000kV架空输电线路工程施工质量验收规程》Q∕GDW 10121-2022  第4.2.6条","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"灌注桩混凝土运输、浇筑及间歇的全部时间不应超过混凝土的初凝时间，每根桩的灌注时间应按初盘混凝土的初凝时间控制。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《110kV～1000kV架空输电线路工程施工质量验收规程》Q∕GDW 10121-2022  第6.3.7.3条","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"现浇混凝土施工检查项目及数量应符合下列要求，主控项目：应全数检查。饮用水源检查不应少于一次。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"6.3.3.1 检查项目及数量应符合下列要求：\na) 主控项目：应全数检查。非饮用水的其他水源，同一水源检查不应少于一次。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"掏挖基础是利用机械或人工在天然土中直接挖（钻）成所需要的基坑，将钢筋骨架和混凝土直接浇注于基坑内而成的基础。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路掏挖基础技术规定》Q/GDW 11330-2014第3.1条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"临时道路应首先充分利用工程现场周围原有道路条件，当原有道路不满足使用需求时，可对道路进行改造或重新修筑道路。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路机械化施工技术导则》Q/GDW 11598—2016第6.3.2条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"大开挖基础应优先选用挖掘机施工，当有地下水影响时，无需采取降水措施；回填土宜选取机械装备进行夯实。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"大开挖基础应优先选用挖掘机施工，当有地下水影响时，应采取降水措施；回填土宜选取机械装备进行夯实。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"灌注桩及挖孔桩基础成孔，应结合岩土类型、地基强度等情况，避免选用旋挖钻机施工。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"灌注桩及挖孔桩基础成孔，应结合岩土类型、地基强度等情况，优先选用旋挖钻机施工。灌注桩基础施工工艺应满足 Q/GDW 11335 的规定，混凝土应采用水下浇筑。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"各项建设工程在设计和施工之后，必须按基本建设程序进行岩土工程勘察。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"各项建设工程在设计和施工之前，必须按基本建设程序进行岩土工程勘察。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"当场地水文地质条件复杂，在基坑开挖过程中需要对地下水进行控制（降水或隔渗），且已有资料不能满足要求时，也无需进行专门的水文地质勘察。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"当场地水文地质条件复杂，在基坑开挖过程中需要对地下水进行控制（降水或隔渗），且已有资料不能满足要求时，应进行专门的水文地质勘察。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"浅基坑或基槽的开挖与回填，当基坑或基槽挖至设计深度或标高时，应进行验槽。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第6部分：输电线路工程设计》Q/GDW 10248.6-2016表5（续）第16条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"架空线路施工图勘察阶段应按地貌单元布置地温长期观测孔，并应进行地温观测，观测孔深度应大于地温年变化深度。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"架空线路施工图勘察阶段应按地貌单元布置地温长期观测孔，并应进行地温观测，观测孔深度不应小于地温年变化深度。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"拟建线路经过对线路塔位安全有影响的岩溶强烈发育区时，无需进行岩溶专项勘察。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"拟建线路经过对线路塔位安全有影响的岩溶强烈发育区时，应当进行岩溶专项勘察。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"钻探设备和附属设备的安装位置必须正确、牢固。各润滑部位应注满润滑油（脂）。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第6部分：输电线路工程设计》10248.6-2016表5（续）第47条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"按地基承载力确定基础底面积及埋深或按单桩承载力确定桩数时，传至基础或承台底面上的作用效应应按正常使用极限状态下作用的标准组合。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第6部分：输电线路工程设计》10248.6-2016表10（续）第8条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"架空线路杆塔的每一腿都应与接地体引下线连接，通过多点接地以保证可靠性。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第6部分：输电线路工程设计》10248.6-2016表13（续）第11条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"试块应在浇制现场浇制过程中取样制作，其养护条件应与基础基本相同。同条件养护的试件应在达到等效养护龄期时进行强度试验。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第7部分：输电线路工程施工》10248.6-2016表6 第1条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"微型桩基础设计时应综合考虑工程地质、地形条件、荷载条件、机械化施工、环境保护及水土保持、工期造价及施工安全等因素来确定杆塔基础桩型。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路微型桩基础设计规范》Q/GDW 10863—2024第4.1.2","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"现浇式微型桩基础适用于场地土、水对钢结构腐蚀等级为微、弱、中腐蚀的土壤环境，强腐蚀环境经论证后方可采用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路微型桩基础设计规范》Q/GDW 10863—2024第4.1.3","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"微型桩基础设计时，计算水平地震作用、风荷载作用下的桩基垂直位移时，采用水平地震作用、风荷载作用效应标准组合。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"微型桩基础设计时，计算水平地震作用、风荷载作用下的桩基水平位移时，采用水平地震作用、风荷载作用效应标准组合；计算其他情况下的地基变形和桩基位移时，采用作用效应准永久组合，相应的气象条件为年平均气温、无风、无冰，相应的限值为地基变形和基础位移允许值。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"微型桩基础主要结构类型，按基桩数量可分为双桩和群桩。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"微型桩基础主要结构类型，按基桩数量可分为单桩和群桩。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"关于微型桩基础的布置，微型桩宜采用低承台桩结构型式；桩基布置宜使受水平力和力矩合力作用较大方向有较大的抗弯刚度，宜采用非对称形式。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"关于微型桩基础的布置，微型桩宜采用低承台桩结构型式；桩基布置宜使受水平力和力矩合力作用较大方向有较大的抗弯刚度，宜采用对称形式。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"岩石锚杆基础常用型式可分为直锚式和承台式；岩石嵌固基础的常用外形可分为圆台形和掏挖形；复合式锚杆基础的常用型式可分为掏挖-岩石锚杆复合式、板柱-岩石锚杆复合式。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路岩石基础技术规范》Q/GDW 11333—2021第5.2.1条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"岩石锚杆基础浇筑前，应检查孔内有无残渣或杂物，孔洞内壁应处于湿润状态；细石混凝土应每 300～500mm 分层灌注、振捣密实，并确保从孔内顺利排水、排气；浇筑后，应核实锚固剂灌注量，灌注体积要与锚孔实际体积相符，否则查明原因并处理。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路岩石基础技术规范》Q/GDW 11333—2021第8.2.4条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"基础设计应考虑原始自然地貌及植被等恢复措施，有护坡时也不能结合护坡工程同时进行处理。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"基础设计应考虑原始自然地貌及植被等恢复措施，有护坡时可结合护坡工程同时进行处理。护坡设计应在保证坡面稳定和护坡体自身可靠的前提下，合理设计断面和布置方案，应采用小型、轻巧的护坡型式。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"湿陷性黄土地基中宜优先采用干作业成孔或施工的基础型式，同时做好基面排水。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路特殊地基基础设计规范》Q/GDW 11266—2024第11.2条","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"管桩基础岩土工程勘察宜采用钻探和触探以及其他原位测试相结合的方式进行，对软土、黏性土、粉土和砂土的测试手段，宜采用静力触探和标准贯入试验。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路混凝土预制管桩基础技术规定》Q/GDW 11729—2017第6.4条","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"管桩施工可能影响附近建(构)筑物时，应采取减少震动和挤土影响的措施，必要时，应对受影响的建(构)筑物进行加固处理并设置观测点；在毗邻边坡打桩时，无需考虑打桩对边坡的影响。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"管桩施工可能影响附近建(构)筑物时，应采取减少震动和挤土影响的措施，必要时，应对受影响的建(构)筑物进行加固处理并设置观测点；在毗邻边坡打桩时，应随时注意打桩对边坡的影响。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"管桩的混凝土强度必须达到设计混凝土强度等级和规定的龄期的一半后方可使用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"管桩的混凝土强度必须达到设计混凝土强度等级和规定的龄期后方可使用。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"掏挖基础的机械化施工适用于平地、山地、丘陵地区地下水位不影响基础土石方开挖，土质湿润、 胶结性差、密实度低于松散状态碎石土的土质环境。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"掏挖基础的机械化施工适用于平地、山地、丘陵地区地下水位不影响基础土石方开挖，土质干燥、 胶结性好、密实度高于松散状态碎石土的土质环境。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"在钻孔过程中应时刻注意旋挖钻机仪表，如仪表显示竖直度有变化，应及时进行调整，符合要求后方可继续钻进。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《输电线路掏挖基础机械化施工工艺导则》Q/GDW11332—2023第7.3条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"关于掏挖基础机械化施工的清孔工艺，孔底清理紧接终孔检查后进行。钻到预定孔深后，应在原深处进行空转清土（10r/min），然后停止 转动，提起钻杆。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《输电线路掏挖基础机械化施工工艺导则》Q/GDW11332—2023第9.1条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"螺旋锚基础的定义是由钢筋混凝土承台或钢结构连接装置与螺旋锚组成的输电线路杆塔基础。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路螺旋锚基础施工及质量验收规范》Q/GDW 10585—2022第3.1条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"灌注桩基础的施工，钻孔扩底桩施工，扩底部位应根据电流值或油压值，调节扩孔刀片削土量，防止出现超负荷现象；扩底直径和孔底的虚土厚度仅需符合最基本的施工要求。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"a) 应根据电流值或油压值，调节扩孔刀片削土量，防止出现超负荷现象；\nb) 扩底直径和孔底的虚土厚度应符合设计要求。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"表土保护工程要求中扰动深度小于 20cm 的临时占压区域表土可不剥离，宜采用铺垫保护。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《架空输电线路水土保持设施质量检验及评定规程》Q/GDW 11971—2019第5.2.3条","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"钻芯法就是用钻具钻取芯样，检测复合竖向地基增强体、混凝土灌注桩的桩长、桩身缺陷以及芯样试件强度，判定或鉴别底部成渣厚度及持力层岩土性状的检测方法。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《输变电工程地基基础检测规范》Q/GDW 11653-2017第3.17条","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"钢筋焊接施工之前，应清除钢筋、钢板焊接部位以及钢筋与电极接触处表面上的锈斑、油污、杂物等，以防止焊接接头产生夹渣、气孔等缺陷，确保焊接质量。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《钢筋焊接及验收规程》JGJ 18 - 2012第 4.1.4","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"砂浆抗冻性能试验中，试件的质量损失率超过10%即判定为不合格。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"质量损失率合格标准为≤5%。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"砂浆分层度试验中，若采用快速法测定，需将分层度筒固定在振动台上振动20秒。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《建筑砂浆基本性能试验方法标准》JGJ/T70-2009第6.0.3","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"综合蓄热法施工的混凝土中可掺入具有引气作用的早强剂或复合外加剂。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《建筑工程冬期施工规程》JGJ/T 104-2011 第6.3.3","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"焊工操作技能考试用的钢筋、焊条、焊剂、氧气、溶解乙炔、液化石油气、二氧化碳气体等，应符合本规程有关规定，不能随意选用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《钢筋焊接及验收规程》JGJ 18 - 2012第 6.0.6","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"钢筋气压焊按加热温度和工艺方法的不同，可分为固态气压焊和熔态气压焊两种。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《钢筋焊接及验收规程》JGJ 18 - 2012第 4.7.2","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"钢筋焊接骨架和焊接网在焊接生产中，当两根钢筋直径不同时，焊接骨架较小钢筋直径小于或等于10mm 时，大、小钢筋直径之比不宜大于2倍。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"钢筋焊接骨架和焊接网在焊接生产中，当两根钢筋直径不同时，焊接骨架较小钢筋直径小于或等于 10mm 时，大、小钢筋直径之比不宜大于3倍；当较小钢筋直径为12mm-16mm时，大、小钢筋直径之比不宜大于2倍，所以该判断题错误。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"灰土挤密桩桩孔质量检验应在成孔后及时进行，所有桩孔均需检验并作出记录，检验合格或经处理后方可进行夯填施工。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《建筑地基处理技术规范》（JGJ 79 - 2012）7.5.4","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"竣工验收时，灰土挤密桩、土挤密桩复合地基的承载力检验应采用复合地基静载荷试验。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《建筑地基处理技术规范》（JGJ 79 - 2012）7.5.5","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"换填垫层法处理地基时，垫层的厚度应根据垫层底面处土的自重压力与附加压力之和不大于软弱下卧层地基承载力特征值确定。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《建筑地基处理技术规范》（JGJ 79 - 2012）","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"混凝土预制桩的吊运，当混凝土设计强度达到 50% 即可起吊。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"混凝土实心桩吊运时，混凝土设计强度达到 70% 及以上方可起吊，达到 100% 方可运输，所以 “50% 即可起吊” 的说法错误。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"钻芯法检测时，每组混凝土芯样应制作3个抗压试件。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《建筑基桩检测技术规范》JGJ 106-2014第7.4.3","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"基桩桩身混凝土钻芯检测，应采用单动单管钻具钻取芯样，严禁使用单动双管钻具。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"基桩桩身混凝土钻芯检测，应采用单动双管钻具钻取芯样，严禁使用单动单管钻具。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"低应变法适用于检测所有类型的竖向增强体的完整性。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"低应变法适用于检测有粘结强度、规则截面的桩身强度大于 8MPa 竖向增强体的完整性，并非所有类型的竖向增强体，所以该说法错误。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"袋装干混砂浆应储存在干燥、通风、防潮、不受雨淋的场所，并应按品种、批号分别堆放，不得混堆混用，且应先存后用。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"袋装干混砂浆应储存在干燥、通风、防潮、不受雨淋的 场所，并应按品种、批号分别堆放，不得混堆混用，且应先存先用。配套组分中的有机类材料应储存在阴凉、干燥、通风、远离火和热源的场所，不应露天存放和曝晒，储存环境温度应为 5℃~35℃。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"钻芯法可用于确定检测批或单个构件的混凝土抗压强度推定值.也可用于钻芯修正方法修正间接强度检测方法得到的混凝土抗压强度换算值。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《钻芯法检测混凝土强度技术规程》JGJ/T 384-2016第6.1.1","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"当采用多节管桩时，应进行管桩配桩设计、接桩位置宜设在计算最大弯矩或剪力位置。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"当采用多节管桩时，应进行管桩配桩设计、接桩位置不宜设在计算最大弯矩或剪力位置。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"施工高程控制测量的等级依次分为二、三、四、五等，可根据场区的实际需要布设，特殊需要可另行设计。四等和五等高程控制网可采用测距三角高程测量。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《建筑施工测量标准》JGJ/T 408-2017第6.1.3","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"混凝土防冻剂应存放在专用仓库或固定场所妥善保管，以防人畜误食。有强氧化性的产品应避免和有机物混存。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《混凝土防冻剂》JC 475-2004第8.3","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"钢筋机械连接用套筒在制品检验项目应至少包括外径、内径、长度及螺纹尺寸。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《钢筋机械连接用套筒》JG/T 163-2013第5.5.2","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"纤维增强复合材料防护栏杆的连接件应采用不锈钢，钢板厚度不应小于7mm。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"纤维增强复合材料防护栏杆的连接件应采用不锈钢，钢板厚度不应小于3mm。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"在钢筋工程焊接开工之前，参与该项工程施焊的焊工必须进行现场条件下的焊接工艺试验，应经试验合格后，方准于焊接生产。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《钢筋焊接及验收规程》JGJ 18-2012第4.1.3","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"对于长期处于潮湿环境的重要结构混凝土，其所使用的碎石或卵石应进行碱活性检验。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《普通混凝土用砂、石质量及检验方法标准》JGJ 52-2006第3.2.8","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"对硬化混凝土的养护用水，重点控制PH值、氯 离子含量、硫酸根离子含量和放射性指标等。对混凝土养护用水的要求，可较拌合用水适当放宽，检测项目可适当减少。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《混凝土用水标准》JGJ 63-2006第3.2.2","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"当采用低应变法或声波透射法检测时，受检混凝土强度不应低于设计强度的70%，且不应低于10MPa。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"当采用低应变法或声波透射法检测时，受检混凝土强度不应低于设计强度的70%，且不应低于15MPa。","chapter":"线路基础","level":"基础题"},{"type":"judge","title":"现场检验当连续3个验收批均一次抽样合格时，表明其施工质量处于优良且稳定的状态。故检验批接头数量可扩大一 倍，即按不大于1000个接头为一批，以减少检验工作量。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"现场检验当连续10个验收批均一次抽样合格时，表明其 施工质量处于优良且稳定的状态。故检验批接头数量可扩大一倍，即按不大于1000个接头为一批，以减少检验工作量。","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"钢筋焊接接头弯曲试验可在压力机或万能试验机上进行，不得使用钢筋弯曲机对钢筋焊接接头进行弯曲试验。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《钢筋焊接接头试验方法标准》JGJ/T 27-2014第4.2.2","chapter":"线路基础","level":"进阶题"},{"type":"judge","title":"桩基静荷载试验前，应将试桩周围的冻土融化或挖除。试验期间，应对试桩周围地表土和锚桩横梁支座进行保温。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：《建筑工程冬期施工规程》JGJ/T 104-2011第3.4.7","chapter":"线路基础","level":"进阶题"},{"type":"text","title":"混凝土原材料进场时，供货方应按规定批次向购买方提供质量证明文件，质量证明文件应包括哪些资料?","options":[],"answer":[],"answerText":"质量证明文件应包括型式检验报告、出厂检验报告与合格证等，外加剂产品还应提供使用说明书。","explain":"混凝土原材料进场时，供方应按规定批次向需方提供质量证明文件。质量证明文件应包括型式检验报告、出厂检验报告与合格证等，外加剂产品还应提供使用说明书。","chapter":"线路基础","level":"基础题"},{"type":"text","title":"基础对角线的定义是指什么？","options":[],"answer":[],"answerText":"对角线：塔腿主角钢准线之间的水平距离","explain":"基础根开及对角线是指同组地脚螺栓中心之间或塔腿主角钢准线间的水平距离。","chapter":"线路基础","level":"基础题"},{"type":"text","title":"试块制作数量应符合什么规定？","options":[],"answer":[],"answerText":"1.耐张塔和悬垂转角塔基础每基应取一组；\n2.一般线路的悬垂直线塔基础，同一施工队每5基或不满5基应取一组，单基或连续浇筑混凝土量超过100m³时亦应取一组；\n3.按大跨越设计的直线塔基础及拉线基础，每腿应取一组，但当基础混凝土量不超过同工程中大转角或终端塔基础时，则每基应取一组；\n4.当原材料变化、配合比变更时应另外制作试块。","explain":"试块制作数量应符合下列规定：\n1.耐张塔和悬垂转角塔基础每基应取一组；\n2.一般线路的悬垂直线塔基础，同一施工队每5基或不满5基应取一组，单基或连续浇筑混凝土量超过100m³时亦应取一组；\n3.按大跨越设计的直线塔基础及拉线基础，每腿应取一组，但当基础混凝土量不超过同工程中大转角或终端塔基础时，则每基应取一组；\n4.当原材料变化、配合比变更时应另外制作试块。","chapter":"线路基础","level":"基础题"},{"type":"text","title":"钢筋骨架应符合设计要求,制作允许偏差应符合哪些规定？","options":[],"answer":[],"answerText":"1.主筋间距允许偏差应为士10mm\n2.箍筋间距允许偏差应为士20mm\n3 钢筋骨架直径允许偏差应为士10mm\n4.钢筋骨架长度允许偏差应为士50mm","explain":"钢筋骨架应符合设计要求,制作允许偏差应符合下列规定：\n1.主筋间距允许偏差应为士10mm；\n2.箍筋间距允许偏差应为士20mm；\n3 钢筋骨架直径允许偏差应为士10mm；\n4.钢筋骨架长度允许偏差应为士50mm。","chapter":"线路基础","level":"基础题"},{"type":"text","title":"架空输电线路杆塔接地极采用水平敷设的应符合哪些规定？","options":[],"answer":[],"answerText":"1。遇倾斜地形宜沿地形敷设，并应满足埋深要求。\n2.两接地极间的平行距离不应小于 5m。\n3.接地极敷设应平直。\n4.接地极与拉线的距离不应小于5m。","explain":"架空输电线路杆塔接地极采用水平敷设的应符合下列规定：1.遇倾斜地形宜沿地形敷设，并应满足埋深要求。\n2.两接地极间的平行距离不应小于 5m。\n3.接地极敷设应平直。\n4.接地极与拉线的距离不应小于5m。","chapter":"线路基础","level":"基础题"},{"type":"text","title":"输电线路施工测量常用的测量仪器主要有哪些？","options":[],"answer":[],"answerText":"输电线路施工测量常用的测量仪器主要有:经纬仪、全站仪、卫星定位设备、水准仪及钢尺等。","explain":"输电线路施工测量常用的测量仪器主要有:经纬仪、全站仪、卫星定位设备、水准仪及钢尺等。","chapter":"线路基础","level":"基础题"},{"type":"text","title":"防护设施采用挡土墙时，应符合哪些要求？","options":[],"answer":[],"answerText":"1.挡土墙基础的埋深应符合设计规定，且最小埋深不应小于500mm,岩石地基可适当减少。\n2.挡土墙中应设置排水孔。\n3.挡土墙应设置沉降缝，沉降缝的设置应结合地质情况布置。\n4.砌石挡土墙的石料应坚硬，不易风化。\n5.施工前应进行排水。基础完成后及时回填、分层夯实。\n6.挡土墙墙体砌筑与墙背填土应交叉进行，避免墙背悬空造成墙身断裂。砌体施工应上下错缝，内外搭接，砂浆饱满。","explain":"防护设施采用挡土墙时，应符合下列要求：\n1.挡土墙基础的埋深应符合设计规定，且最小埋深不应小于500mm,岩石地基可适当减少；\n2.挡土墙中应设置排水孔；\n3.挡土墙应设置沉降缝，沉降缝的设置应结合地质情况布置；4.砌石挡土墙的石料应坚硬，不易风化；\n5.施工前应进行排水。基础完成后及时回填、分层夯实；\n6.挡土墙墙体砌筑与墙背填土应交叉进行，避免墙背悬空造成墙身断裂。砌体施工应上下错缝，内外搭接，砂浆饱满。","chapter":"线路基础","level":"基础题"},{"type":"text","title":"排水沟的施工应符合哪些要求？","options":[],"answer":[],"answerText":"1.排水沟的长度、深度、宽度应符合设计规定。\n2.采用砌石排水沟或预制板排水沟时，应铺设平整。板下填土应夯实，防止沉陷。\n3.排水沟的开挖沿水沟方向应中间高两端低，以利排水。排水沟的两端应引向天然冲沟或山坡下方，不得冲向基坑或其他建筑物。","explain":"排水沟的施工应符合下列要求：\n1.排水沟的长度、深度、宽度应符合设计规定；\n2.采用砌石排水沟或预制板排水沟时，应铺设平整。板下填土应夯实，防止沉陷；\n3.排水沟的开挖沿水沟方向应中间高两端低，以利排水。排水沟的两端应引向天然冲沟或山坡下方，不得冲向基坑或其他建筑物。","chapter":"线路基础","level":"基础题"},{"type":"text","title":"护坡的施工应符合哪些要求？","options":[],"answer":[],"answerText":"1.草皮护坡应选用容易生根蔓延、耐旱的草种，在适宜种植的季节均匀种植。\n2.采用块石铺砌护坡时，应自下而上分行平行铺砌、错缝搭接。护坡层与坡底应贴合无空隙，坡顶面应与天然地面齐平。\n3.采用水泥砂浆或混凝土护坡时，厚度不宜小于30mm,护坡表面平滑，完成后应进行淋水养护。","explain":"护坡的施工应符合下列要求：\n1.草皮护坡应选用容易生根蔓延、耐旱的草种，在适宜种植的季节均匀种植；\n2.采用块石铺砌护坡时，应自下而上分行平行铺砌、错缝搭接。护坡层与坡底应贴合无空隙，坡顶面应与天然地面齐平；\n3.采用水泥砂浆或混凝土护坡时，厚度不宜小于30mm,护坡表面平滑，完成后应进行淋水养护。","chapter":"线路基础","level":"基础题"},{"type":"text","title":"线路工程施工复测检验批应如何划分？","options":[],"answer":[],"answerText":"以一施工标段为一检验批，如有改线或更换分包单位需重新填写。","explain":"6.2.1.2 检验批划分：以一施工标段为一检验批，如有改线或更换分包单位需重新填写。","chapter":"线路基础","level":"基础题"},{"type":"text","title":"普通基础分坑和开挖时，需检查哪些主控项目？","options":[],"answer":[],"answerText":"1)基底岩（土）性质；\n2)基础坑中心根开及对角线尺寸；\n3)基坑埋深；4)基坑底板。","explain":"6.2.2.3 1)基底岩（土）性质；2)基础坑中心根开及对角线尺寸；3)基坑埋深；4)基坑底板。","chapter":"线路基础","level":"基础题"},{"type":"text","title":"微型桩基础的定义是什么？","options":[],"answer":[],"answerText":"由小直径桩和连接于桩顶承台共同组成的基础，根据成桩方式桩身直径一般为150 mm～400 mm。","explain":"由小直径桩和连接于桩顶承台共同组成的基础，根据成桩方式桩身直径一般为150 mm～400 mm。","chapter":"线路基础","level":"基础题"},{"type":"text","title":"微型桩基础按照桩身的制作方法可分为那几种？","options":[],"answer":[],"answerText":"可分为现浇式和预制式微型桩.","explain":"可分为现浇式和预制式微型桩。","chapter":"线路基础","level":"进阶题"},{"type":"text","title":"请问岩石锚杆基础的定义是什么？","options":[],"answer":[],"answerText":"将锚筋置于钻凿成型的岩孔内，通过水泥砂浆或细石混凝土等胶结体在岩孔内的胶结，使锚筋与岩 体结成整体的基础型式。","explain":"将锚筋置于钻凿成型的岩孔内，通过水泥砂浆或细石混凝土等胶结体在岩孔内的胶结，使锚筋与岩 体结成整体的基础型式。","chapter":"线路基础","level":"基础题"},{"type":"text","title":"钢筋电弧焊包括哪几种接头形式？","options":[],"answer":[],"answerText":"帮条焊、搭接焊、坡口焊、窄间隙焊、熔槽帮条焊","explain":"钢筋电弧焊包括帮条焊、搭接焊、坡口焊、窄间隙焊、熔槽帮条焊5种接头形式。","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"杆塔的部件规格和数量应符合（ ）要求。","options":[{"key":"A","text":"运行"},{"key":"B","text":"设计"},{"key":"C","text":"验收"},{"key":"D","text":"业主"}],"answer":["B"],"explain":"依据：DL/T 5168—2023《110kV～750kV架空输电线路施工质量检验及评定规程》4.4.1","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"自立转角塔、终端塔的结构倾斜应符合（ ）要求。","options":[{"key":"A","text":"运行"},{"key":"B","text":"设计"},{"key":"C","text":"验收"},{"key":"D","text":"业主"}],"answer":["B"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"自立直线塔结构倾斜：一般塔不大于全高的（ ）。","options":[{"key":"A","text":"0.6%"},{"key":"B","text":"0.3%"},{"key":"C","text":"0.15%"},{"key":"D","text":"0.5%"}],"answer":["B"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"自立直线塔结构倾斜：高塔不大于全高的（ ）。","options":[{"key":"A","text":"0.6%"},{"key":"B","text":"0.3%"},{"key":"C","text":"0.15%"},{"key":"D","text":"0.5%"}],"answer":["C"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"自立式铁塔组立应经质量检验评定，其中螺栓紧固程度检查方法为（ ）。","options":[{"key":"A","text":"目测法"},{"key":"B","text":"弦线检查"},{"key":"C","text":"扭矩扳手检查"},{"key":"D","text":"钢尺测量"}],"answer":["C"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"拉线杆塔的结构倾斜度不大于（ ）。","options":[{"key":"A","text":"0.3%"},{"key":"B","text":"2%"},{"key":"C","text":"1%"},{"key":"D","text":"3%"}],"answer":["A"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"进阶题"},{"type":"radio","title":"钢管直线电杆的结构倾斜度架线后不得大于（ ）。","options":[{"key":"A","text":"1%"},{"key":"B","text":"2%"},{"key":"C","text":"0.5%"},{"key":"D","text":"5%"}],"answer":["C"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"进阶题"},{"type":"radio","title":"钢管电杆组立法兰连接紧密，最大缝隙不得（ ）。","options":[{"key":"A","text":"大于2mm"},{"key":"B","text":"小于2mm"},{"key":"C","text":"小于4mm"},{"key":"D","text":"大于4mm"}],"answer":["A"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"组立完成的钢管杆，其螺栓紧固率不应小于（ ）。","options":[{"key":"A","text":"95%"},{"key":"B","text":"90%"},{"key":"C","text":"100%"},{"key":"D","text":"97%"}],"answer":["A"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"架完线后的钢管杆，其螺栓紧固率不应小于（ ）。","options":[{"key":"A","text":"95%"},{"key":"B","text":"90%"},{"key":"C","text":"100%"},{"key":"D","text":"97%"}],"answer":["D"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"混凝土电杆纵向（ ）。","options":[{"key":"A","text":"裂缝不得大于1mm"},{"key":"B","text":"裂缝不得大于0.1mm"},{"key":"C","text":"裂缝不得大于0.5mm"},{"key":"D","text":"不得有裂缝"}],"answer":["D"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"进阶题"},{"type":"radio","title":"预应力混凝土电杆横向（ ）。","options":[{"key":"A","text":"裂缝不得大于1mm"},{"key":"B","text":"裂缝不得大于0.1mm"},{"key":"C","text":"裂缝不得大于0.5mm"},{"key":"D","text":"不得有裂缝"}],"answer":["D"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"进阶题"},{"type":"radio","title":"混凝土电杆横线路方向的位移不得（ ）。","options":[{"key":"A","text":"小于50mm"},{"key":"B","text":"大于50mm"},{"key":"C","text":"小于100mm"},{"key":"D","text":"大于100mm"}],"answer":["B"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"110kV混凝土电杆横担间的高差不得大于（ ）。","options":[{"key":"A","text":"5%"},{"key":"B","text":"0.5%"},{"key":"C","text":"0.35%"},{"key":"D","text":"3.5%"}],"answer":["B"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"进阶题"},{"type":"radio","title":"220kV～330kV混凝土电杆横担间的高差不得大于（ ）。","options":[{"key":"A","text":"5%"},{"key":"B","text":"0.5%"},{"key":"C","text":"0.35%"},{"key":"D","text":"3.5%"}],"answer":["C"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"进阶题"},{"type":"radio","title":"110kV混凝土电杆根开的偏差不得大于（ ）。","options":[{"key":"A","text":"30mm"},{"key":"B","text":"30cm"},{"key":"C","text":"0.5%"},{"key":"D","text":"5%"}],"answer":["A"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"进阶题"},{"type":"radio","title":"220kV～330kV混凝土电杆根开的偏差不得大于（ ）。","options":[{"key":"A","text":"30mm"},{"key":"B","text":"30cm"},{"key":"C","text":"0.5%"},{"key":"D","text":"5%"}],"answer":["C"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路组塔","level":"进阶题"},{"type":"radio","title":"混凝土电杆组立质量应经质量检验评定，其中混凝土杆纵向裂缝的检查方法为（ ）。","options":[{"key":"A","text":"目测法"},{"key":"B","text":"钢尺测量"},{"key":"C","text":"弦线检查"},{"key":"D","text":"专用放大镜检查"}],"answer":["D"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路架线","level":"基础题"},{"type":"radio","title":"流动式起重机吊装塔材时，应留有施工预度，吊重不宜超过相应幅度额定负荷的（ ）。","options":[{"key":"A","text":"50%"},{"key":"B","text":"70%"},{"key":"C","text":"80%"},{"key":"D","text":"90%"}],"answer":["D"],"explain":"依据：DL/T 5168—2023《110kV及以上架空输电线路施工质量检验规程》4.4.1","chapter":"线路架线","level":"进阶题"},{"type":"radio","title":"吊装时，吊件与塔身距离不应小于（ ）mm。","options":[{"key":"A","text":"100"},{"key":"B","text":"200"},{"key":"C","text":"300"},{"key":"D","text":"500"}],"answer":["A"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》13.0.10","chapter":"线路架线","level":"基础题"},{"type":"radio","title":"（ ）kV及以上电压等级线路铁塔不允许采用木抱杆组立。","options":[{"key":"A","text":"35"},{"key":"B","text":"110"},{"key":"C","text":"220"},{"key":"D","text":"330"}],"answer":["C"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》13.0.2","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"铁塔组立过程，吊件控制绳对地夹角不应大于（ ），当夹角过大时应进行验算，并应采取相应的措施。","options":[{"key":"A","text":"30°"},{"key":"B","text":"45°"},{"key":"C","text":"60°"},{"key":"D","text":"70°"}],"answer":["B"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》13.0.7","chapter":"线路组塔","level":"进阶题"},{"type":"radio","title":"内悬浮抱杆分解组立铁塔时，抱杆倾斜角不得超过（ ）。","options":[{"key":"A","text":"5°"},{"key":"B","text":"10°"},{"key":"C","text":"20°"},{"key":"D","text":"30°"}],"answer":["B"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》4.1.1","chapter":"线路组塔","level":"进阶题"},{"type":"radio","title":"内悬浮外拉线抱杆分解组立铁塔时，外拉线地锚离基础中心的距离不应小于塔高的（ ）倍。当场地不能满足要求时，应验算各部受力并应采取特殊的安全措施。","options":[{"key":"A","text":"0.5"},{"key":"B","text":"1.0"},{"key":"C","text":"1.2"},{"key":"D","text":"1.5"}],"answer":["C"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》4.2.2","chapter":"线路组塔","level":"进阶题"},{"type":"radio","title":"内悬浮外拉线抱杆分解组立铁塔时，牵引系统应放置在主要吊装面的侧面，当塔全高小于或等于（ ）m时，牵引装置及地锚与铁塔基础中心的距离不应小于塔全高的1.2倍。","options":[{"key":"A","text":"30"},{"key":"B","text":"40 出螺母的长度：对单螺母，不应小于（ ）个螺距。","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"4"},{"key":"D","text":"6"}],"answer":["B"],"explain":"依据：GB 50233—2014《110kV～750kV架空输电线路施工及验收规范》7.1.3","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"对于十字形截面组合角钢主材肢间连接螺栓，应（ ）。","options":[{"key":"A","text":"由下侧肢向上侧肢依次安装"},{"key":"B","text":"由上侧肢向下侧肢依次安装"},{"key":"C","text":"顺时针安装"},{"key":"D","text":"逆时针安装"}],"answer":["C"],"explain":"依据：GB 50233—2014《110kV～750kV架空输电线路施工及验收规范》7.1.4","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"杆塔部件组装有困难时应查明原因，不得强行组装。个别螺栓需扩孔时，扩孔部分不应超过（ ）mm。","options":[{"key":"A","text":"3"},{"key":"B","text":"5"},{"key":"C","text":"7"},{"key":"D","text":"9"}],"answer":["A"],"explain":"依据：GB 50233—2014《110kV～750kV架空输电线路施工及验收规范》7.1.5","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"杆塔连接螺栓应逐个紧固，受剪螺栓紧固扭矩值不应小于某个额定值，M24规格的螺栓紧固扭矩值不应小于（ ）N·m。","options":[{"key":"A","text":"80"},{"key":"B","text":"100"},{"key":"C","text":"200"},{"key":"D","text":"250"}],"answer":["D"],"explain":"依据：GB 50233—2014《110kV～750kV架空输电线路施工及验收规范》7.1.6","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"杆塔组立及架线后，下列不同电压的杆塔结构根开允许偏差正确的是（ ）。","options":[{"key":"A","text":"110kV的杆塔结构根开允许偏差为±30mm"},{"key":"B","text":"220kV～330kV的杆塔结构根开允许偏差为±6%"},{"key":"C","text":"500kV的杆塔结构根开允许偏差为±4%"},{"key":"D","text":"750kV的杆塔结构根开允许偏差为±2%"}],"answer":["A"],"explain":"依据：GB 50233—2014《110kV～750kV架空输电线路施工及验收规范》7.1.8","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"自立式转角、终端耐张塔组立后，应向（ ）预倾斜。","options":[{"key":"A","text":"受力正方向"},{"key":"B","text":"受力反方向"},{"key":"C","text":"线路大号侧"},{"key":"D","text":"线路小号侧"}],"answer":["B"],"explain":"依据：GB 50233—2014《110kV～750kV架空输电线路施工及验收规范》7.1.9","chapter":"线路组塔","level":"基础题"},{"type":"radio","title":"分解组立铁塔时，基础混凝土的抗压强度必须达到设计强度的（ ）。","options":[{"key":"A","text":"50%"},{"key":"B","text":"70%"},{"key":"C","text":"90%"},{"key":"D","text":"100%"}],"answer":["B"],"explain":"依据：GB 50233—2014《110kV～750kV架空输电线路施工及验收规范》7.2.1","chapte "组塔过程中的吊装用绳应使用（ ）。","options":[{"key":"A","text":"钢丝绳"},{"key":"B","text":"麻绳"},{"key":"C","text":"尼龙绳"},{"key":"D","text":"专用吊带"}],"answer":["A","D"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》13.0.6","chapter":"线路组塔","level":"进阶题"},{"type":"check","title":"组塔过程中的锚桩通常使用（ ）。","options":[{"key":"A","text":"地钻"},{"key":"B","text":"铁桩"},{"key":"C","text":"木桩"},{"key":"D","text":"钢板地锚"}],"answer":["A","B","D"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》13.0.9","chapter":"线路组塔","level":"进阶题"},{"type":"check","title":"铁塔组立施工应从（ ）等方面采取有效措施，全面落实法律法规中环境与水土保持等方面的要求和认真履行各级职责，倡导建设资源节约型和环境友好型的绿色和谐工程。","options":[{"key":"A","text":"设计"},{"key":"B","text":"设备"},{"key":"C","text":"建设管理"},{"key":"D","text":"施工"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》14.0.1","chapter":"线路组塔","level":"基础题"},{"type":"check","title":"铁塔组立常用的方法（ ）。","options":[{"key":"A","text":"内悬浮外拉线抱杆分解组塔"},{"key":"B","text":"倒落式抱杆整体组塔"},{"key":"C","text":"座地双摇臂抱杆分解组塔"},{"key":"D","text":"座地双平臂抱杆分解组塔"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》2.0.5","chapter":"线路组塔","level":"基础题"},{"type":"check","title":"符合座地双摇臂抱杆现场平面布置要求的有（ ）。","options":[{"key":"A","text":"进场运输道路应满足塔材运输或搬运要求"},{"key":"B","text":"作业场地应平整，大小应满足塔材地面组装要求"},{"key":"C","text":"提升地锚、动力地锚及其他辅助地锚设置应满足施工要求"},{"key":"D","text":"动力平台、材料和机具场地应平整，满足施工要求"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》8.2.1","chapter":"线路组塔","level":"进阶题"},{"type":"check","title":"组塔时座地双摇臂抱杆分为（ ）。","options":[{"key":"A","text":"承托系统"},{"key":"B","text":"起吊系统"},{"key":"C","text":"提升系统"},{"key":"D","text":"变幅系统"}],"answer":["B","C","D"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》8.2.1","chapter":"线路组塔","level":"基础题"},{"type":"check","title":"座地双摇臂抱杆提升时，说法正确的有（ ）。","options":[{"key":"A","text":"抱杆提升时，应根据其性能要求，合理设置腰环数量和间距"},{"key":"B","text":"抱杆提升完毕后，应及时设置抱杆拉线"},{"key":"C","text":"利用滑车组牵引法倒装提升方式时，可在塔身某一合适高度节点处挂设两套提 ,"text":"对单螺母，可与螺母相平"},{"key":"B","text":"对单螺母，不应小于2个螺距"},{"key":"C","text":"对双螺母，可与螺母相平"},{"key":"D","text":"对双螺母，不应小于1个螺距"}],"answer":["B","C"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"check","title":"螺栓对立体结构的穿入方向应符合（ ）规定。","options":[{"key":"A","text":"水平方向应由内向外"},{"key":"B","text":"水平方向应由外向内"},{"key":"C","text":"垂直方向应由下向上"},{"key":"D","text":"垂直方向应由上向下"}],"answer":["A","C"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"check","title":"螺栓对平面结构的穿入方向应符合（ ）规定。","options":[{"key":"A","text":"顺线路方向，应由小号侧穿入或按统一方向穿入"},{"key":"B","text":"顺线路方向，应由大号侧穿入或按统一方向穿入"},{"key":"C","text":"垂直地面方向，应由上向下"},{"key":"D","text":"垂直地面方向，应由下向上"}],"answer":["A","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"check","title":"下列关于杆塔组装扩孔的说法正确的是（ ）。","options":[{"key":"A","text":"扩孔部分不得超过3mm"},{"key":"B","text":"不得用气割扩孔"},{"key":"C","text":"不得烧孔"},{"key":"D","text":"扩孔应进行防锈处理"}],"answer":["A","B","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"check","title":"杆塔组立时，对于螺栓紧固，下列说法正确的是（ ）。","options":[{"key":"A","text":"杆塔连接螺栓在组立结束时应全部紧固一次"},{"key":"B","text":"铁塔组立结束时，完成螺栓紧固后可立刻进行架线"},{"key":"C","text":"架线结束后，螺栓应再次复紧"},{"key":"D","text":"架线结束后，螺栓可不复紧"}],"answer":["A","C"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"check","title":"自立式转角、终端耐张塔组立后，应向受力反方向预倾斜，预倾斜值应根据（ ）由设计确定，架线挠曲后仍不宜向受力侧倾斜。","options":[{"key":"A","text":"塔基础底面的地耐力"},{"key":"B","text":"塔结构的刚度"},{"key":"C","text":"受力大小"},{"key":"D","text":"铁塔自重"}],"answer":["A","B","C"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"check","title":"铁塔组立后，说法正确的是（ ）。","options":[{"key":"A","text":"塔脚板与基础面有空隙时，应用铁片垫实"},{"key":"B","text":"铁塔应在检查合格后方可浇筑保护帽"},{"key":"C","text":"混凝土保护帽应与塔脚结合严密"},{"key":"D","text":"塔脚板应与基础面接触良好"}],"answer":["A","B","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"check","title":"关于钢管电杆电杆架线后的倾斜情况，说法正确的是（ ）。","options":[{"key":"A","text":"转角杆架线后的挠曲度不作要求"},{"key":"B","text":"直线电杆架线后的倾斜不应超过杆高的10‰"},{"key":"C","text":"直线电杆架线后的倾斜不应超过杆高的5‰"},{"key":"D","text":"转角杆架线后挠曲度应符合设计规定"}],"answer":["C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"check","title":"采用锲形线夹连接的拉线，安装时应符合（ ）规定。","options":[{"key":"A","text":"线夹的舌板和拉线应紧密接触，受力后不应滑动"},{"key":"B","text":"拉线弯曲部分不应有明显松股"},{"key":"C","text":"拉线断头侧应采取防止散股的有效措施"},{"key":"D","text":"同组及同基拉线的各个线夹，尾线端方向应力求统一"}],"answer":["A","B","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"check","title":"架线后应对全部拉线进行复查和调整，拉线安装后应符合（ ）规定。","options":[{"key":"A","text":"拉线与拉线棒应呈一直线"},{"key":"B","text":"X型拉线的交叉点处不应留空隙"},{"key":"C","text":"组合拉线的各根拉线应受力均衡"},{"key":"D","text":"X型拉线的交叉点处应留空隙"}],"answer":["A","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"check","title":"跨越施工前，应按线路设计中的交叉跨越点断面图对（ ）进行测量，测量时应考虑环境温度变化（复测季节与施工季节的温差）对跨越施工的影响。","options":[{"key":"A","text":"跨越点的交叉角度"},{"key":"B","text":"导线在交叉点的对地高度"},{"key":"C","text":"导线边线间的水平距离"},{"key":"D","text":"地形状况"}],"answer":["A","B","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"check","title":"钢丝绳（套）有（ ）情况之一者应报废或截除。","options":[{"key":"A","text":"绳芯损坏或绳股挤出"},{"key":"B","text":"笼状畸形、严重扭结或弯折"},{"key":"C","text":"压扁严重"},{"key":"D","text":"受过火烧或电灼"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5106—2017《跨越电力线路架线施工规程》7.2.8","chapter":"线路架线","level":"基础题"},{"type":"check","title":"滑车有（ ）情况不得使用。","options":[{"key":"A","text":"吊钩或吊环变形"},{"key":"B","text":"轮缘破损或严重磨损"},{"key":"C","text":"滑轮转动不灵"},{"key":"D","text":"轴承变形"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5106—2017《跨越电力线路架线施工规程》7.2.13","chapter":"线路架线","level":"基础题"},{"type":"check","title":"双钩紧线器应经常润滑保养，有（ ）情况不得使用。","options":[{"key":"A","text":"换向爪失灵"},{"key":"B","text":"螺杆无保险螺丝"},{"key":"C","text":"表面污秽"},{"key":"D","text":"弯曲严重"}],"answer":["A","B","D"],"explain":"依据：DL/T 5106—2017《跨越电力线路架线施工规程》7.2.14","chapter":"线路架线","level":"进阶题"},{"type":"check","title":"跨越施工所使用的绝缘绳、网在使用前应进行外观检查，（ ）的绝缘绳、网不得使用。","options":[{"key":"A","text":"严重磨损"},{"key":"B","text":"断股"},{"key":"C","text":"断丝"},{"key":"D","text":"污秽"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5106—2017《跨越电力线路架线施工规程》4.0.7","chapter":"线路架线","level":"基础题"},{"type":"check","title":"金属格构式跨越架架体采用起重机整体组立时，应符合（ ）规定。","options":[{"key":"A","text":"应根据架体的质量和组立高度选择相应的起重机，并按起重机额定的工作负荷进行起吊作业，不得超载"},{"key":"B","text":"起吊作业时，起重机的吊臂应平行于被跨电力线路方向摆放"},{"key":"C","text":"架体宜在垂直于被跨电力线路方向上组装"},{"key":"D","text":"架体就位打设好拉线后方可松钩"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5106—2017《跨越电力线路架线施工规程》5.1.1","chapter":"线路架线","level":"基础题"},{"type":"check","title":"金属格构式跨越架立柱采用起重机整体拆除时应符合（ ）规定。","options":[{"key":"A","text":"起重机站位位置应便于拆卸，避免大幅度转臂、甩杆"},{"key":"B","text":"起重机受力后方可拆除被拆立柱的拉线"},{"key":"C","text":"被拆立柱应设置控制绳"},{"key":"D","text":"起重机应站立在平地上"}],"answer":["A","B","C"],"explain":"依据：DL/T 5106—2017《跨越电力线路架线施工规程》5.1.1","chapter":"线路架线","level":"进阶题"},{"type":"check","title":"拆除跨越架时，（ ）做法是正确的。","options":[{"key":"A","text":"由上向下逐根拆除"},{"key":"B","text":"拆下的材料应有人传递，不得向下抛扔"},{"key":"C","text":"上下同时拆架"},{"key":"D","text":"将跨越架整体推倒"}],"answer":["A","B"],"explain":"依据：DL/T 5106—2017《跨越电力线路架线施工规程》6.3.4","chapter":"线路架线","level":"进阶题"},{"type":"check","title":"各液压管施压后，操作者应检查压接尺寸并记录，经自检合格并经监理人员验证后，（ ）应在铝管的不压区打上钢印。","options":[{"key":"A","text":"压接操作人员"},{"key":"B","text":"施工项目质检员"},{"key":"C","text":"监理人员"},{"key":"D","text":"业主项目质量专责"}],"answer":["A","C"],"explain":"依据：DL/T 5285—2018《输变电工程架空导线（800mm2以下）及地线液压压接工艺规程》10.2.2","chapter":"线路架线","level":"进阶题"},{"type":"check","title":"压接管是用金属材料制成的适合采用导地线液压压接金具，包括（ ）。","options":[{"key":"A","text":"接续管钢管"},{"key":"B","text":"耐张线夹的耐张钢锚"},{"key":"C","text":"接续管铝管"},{"key":"D","text":"耐张线夹的耐张铝管"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5285—2018《输变电工程架空导线（800mm2以下）及地线液压压接工艺规程》3.4","chapter":"线路架线","level":"基础题"},{"type":"check","title":"标记是表示在导地线或压接管上标定压接位置的印记，主要包括（ ）。","options":[{"key":"A","text":"定位标记"},{"key":"B","text":"绑扎标记"},{"key":"C","text":"切割标记"},{"key":"D","text":"压接标记"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5285—2018《输变电工程架空导线（800mm2以下）及地线液压压接工艺规程》3.5","chapter":"线路架线","level":"基础题"},{"type":"check","title":"（ ）的导地线不应在同一个耐张段内同一相（极）导地线进行压接。","options":[{"key":"A","text":"不同材料"},{"key":"B","text":"不同结构"},{"key":"C","text":"不同规格"},{"key":"D","text":"不同绞向"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5285—2018《输变电工程架空导线（800mm2以下）及地线液压压接工艺规程》4.1.3","chapter":"线路架线","level":"基础题"},{"type":"check","title":"在导地线压接操作时，应编制压接作业指导书，作业指导书中至少应包括以下（ ）内容。","options":[{"key":"A","text":"导地线的规格型号及有关参数"},{"key":"B","text":"接续管及耐张线夹的结构尺寸"},{"key":"C","text":"压接应达到的额定工作压力"},{"key":"D","text":"导地线和压接管的定位印记尺寸"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5285—2018《输变电工程架空导线（800mm2以下）及地线液压压接工艺规程》4.7.2","chapter":"线路架线","level":"基础题"},{"type":"check","title":"在导线压接过程中，说法正确的是（ ）。","options":[{"key":"A","text":"钢管相邻两模重叠压接不应小于2mm"},{"key":"B","text":"钢管相邻两模重叠压接不应小于5mm"},{"key":"C","text":"铝管相邻两模重叠压接不应小于10mm"},{"key":"D","text":"铝管相邻两模重叠压接不应小于20mm"}],"answer":["B","C"],"explain":"依据：DL/T 5285—2018《输变电工程架空导线（800mm2以下）及地线液压压接工艺规程》4.7.4","chapter":"线路架线","level":"进阶题"},{"type":"check","title":"切割铝单丝时，应注意（ ）事项。","options":[{"key":"A","text":"切割铝单丝时宜采用专用剥线器"},{"key":"B","text":"在切割内层铝股时，割至铝股直径的3/4处，应停用剥线器，进行倒角处理后，将内层铝股逐股掰断，严禁伤及钢芯。"},{"key":"C","text":"切割铝单丝时宜采用铝材切割机"},{"key":"D","text":"在切割铝单丝时，割至铝股剩下最后一层后，应停用铝材切割机，逐股掰断"}],"answer":["A","B"],"explain":"依据：DL/T 5285—2018《输变电工程架空导线（800mm2以下）及地线液压压接工艺规程》5.1.8","chapter":"线路架线","level":"进阶题"},{"type":"check","title":"导线表面氧化膜的清除及涂刷电力脂应按（ ）程序操作。","options":[{"key":"A","text":"涂电力脂的范围为铝线进入铝管的压接部分"},{"key":"B","text":"将外层铝线清洗并干燥后，再将电力脂薄薄地均匀涂上一层，应将外层铝股覆盖"},{"key":"C","text":"用钢丝刷沿导线轴线方向对已涂电力脂部分进行擦刷，擦刷范围应能覆盖到压后与铝压接管接"},{"k
