<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>质量管理「明白人」· 线路刷题</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4f60'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='%23f2efe9' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#f2efe9;--card:#fffdf9;--ink:#191d24;--muted:#6f7681;--line:#e2ddd2;
  --brand:#1d4f60;--brand-soft:#eaf1f3;--ok:#2b7a55;--okbg:#eaf4ee;--bad:#a8453a;--badbg:#f8ecea;
  --amber:#a97325;--r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  padding-bottom:24px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,p{margin:0}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px 12px;background:var(--brand);color:#f7f4ee}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none;border-radius:9px;background:rgba(255,255,255,.12);display:grid;place-items:center}
h1{font-size:16.5px;font-weight:600;letter-spacing:.02em;line-height:1.35}
.sub{font-size:12px;color:rgba(247,244,238,.72);line-height:1.4}
.sub b{font-weight:600;color:#fff}
.topStats{font-size:12px;text-align:right;line-height:1.5;color:rgba(247,244,238,.8);flex:none}
.topStats b{font-size:16px;font-weight:600;color:#fff;display:block}

.filters{padding:10px 16px 0;display:flex;flex-direction:column;gap:7px}
.filterRow{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.filterRow::-webkit-scrollbar{display:none}
.lab{font-size:12px;color:var(--muted);flex:none;width:32px}
.fchip{flex:none;padding:5px 11px;min-height:32px;border-radius:999px;border:1px solid var(--line);
  background:#fbf9f4;font-size:13px;color:#414852;transition:.15s}
.fchip.on{background:var(--brand-soft);border-color:#a9c4cc;color:var(--brand);font-weight:600}

.modes{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;
  background:var(--paper);position:sticky;top:0;z-index:9;border-bottom:1px solid var(--line)}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;padding:8px 14px;border-radius:999px;font-size:14px;line-height:1.3;
  border:1px solid var(--line);background:var(--card);color:#414852;transition:.15s}
.modes button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.modes .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;
  background:#e9e4d8;color:#5a6270;font-size:11px;line-height:17px;text-align:center;vertical-align:1px}
.modes button.on .badge{background:rgba(255,255,255,.22);color:#fff}

main{padding:14px 16px 0;max-width:820px;margin:0 auto}
.barRow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar{flex:1;height:6px;background:#e6e1d6;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brand);border-radius:3px;transition:width .25s}
.barTxt{font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}

.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand);font-weight:500}
.tag.check{background:#fdf1e2;color:#9c6218}
.tag.judge{background:#eef1e6;color:#5c6b33}
.tag.text{background:#f3ecea;color:#8d5347}
.tag.lv{background:#eeeadd;color:#6b6247}
.qno{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.favBtn{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);padding:4px 6px;border-radius:8px;min-height:32px}
.favBtn.active{color:var(--amber)}
.qtitle{font-size:17px;line-height:1.65;font-weight:500;margin-bottom:14px;word-break:break-word}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  padding:11px 12px;min-height:46px;border:1px solid var(--line);border-radius:10px;
  background:#fbf9f4;transition:.12s;font-size:15px;line-height:1.5}
.opt:hover{border-color:#c9c2b2}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
  font-size:12px;font-weight:600;background:#eae5da;color:#5b636e}
.opt .txt{flex:1;min-width:0;padding-top:1px;word-break:break-word}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.opt.sel .key{background:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}

.ansArea{margin-bottom:12px}
textarea{
  width:100%;min-height:112px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  font-family:inherit;font-size:16px;line-height:1.65;background:#fbf9f4;color:var(--ink);
  resize:vertical;outline:none;
}
textarea:focus{border-color:var(--brand)}

.acts{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
.btn{flex:1;min-width:104px;min-height:44px;border-radius:10px;font-size:15px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:#f3efe6;color:#3d444e;transition:.15s}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#e7d3cf;background:#fdf6f4}
.btn:active{transform:translateY(1px)}

.fb{margin-top:14px;border-radius:10px;padding:12px 13px;font-size:14px;line-height:1.65;display:none}
.fb.show{display:block}
.fb.ok{background:var(--okbg);border-left:3px solid var(--ok)}
.fb.bad{background:var(--badbg);border-left:3px solid var(--bad)}
.fb.neutral{background:#f5f2ea;border-left:3px solid #b8ad93}
.fb .h{font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.fb.ok .h{color:var(--ok)}
.fb.bad .h{color:var(--bad)}
.fb.neutral .h{color:#7a6c4d}
.fb .ansLine{font-size:13px;color:#414852;margin-bottom:4px}
.fb .ansLine b{color:var(--ink);letter-spacing:.06em}
.fb .ex{color:#4a515c;word-break:break-word;margin-top:6px}
.fb .ex span{color:var(--muted);font-size:12px;margin-right:4px}
.fb .block{white-space:pre-wrap;word-break:break-word}

.empty{background:var(--card);border:1px dashed #cfc8b8;border-radius:var(--r);padding:38px 20px;text-align:center}
.empty h3{font-size:16px;margin-bottom:6px}
.empty p{font-size:13px;color:var(--muted)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px}
.panel h2{font-size:17px;margin-bottom:6px}
.panel .tip{font-size:13px;color:var(--muted);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:#fbf9f4;font-size:14px;min-height:42px}
.seg button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px;margin-top:14px}
.palette button{height:40px;border-radius:8px;border:1px solid var(--line);background:#fbf9f4;
  font-size:13px;color:#5b636e;font-variant-numeric:tabular-nums}
.palette button.done{background:var(--brand-soft);border-color:#bcd2d8;color:var(--brand);font-weight:600}
.palette button.done.bad{background:var(--badbg);border-color:#e7d3cf;color:var(--bad)}
.palette button.cur{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.scoreBox{display:flex;gap:14px;align-items:baseline;margin:6px 0 14px}
.scoreBox .big{font-size:38px;font-weight:600;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.scoreBox .pct{font-size:14px;color:var(--muted)}
.scoreRow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:13px;padding:5px 10px;border-radius:8px;background:#f3efe6;color:#4a515c}
.chip.g{background:var(--okbg);color:var(--ok)}
.chip.r{background:var(--badbg);color:var(--bad)}

.tools{max-width:820px;margin:18px auto 0;padding:0 16px;display:flex;gap:9px;flex-wrap:wrap}
.tools button{flex:1;min-width:120px;min-height:42px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:13px;color:#4a515c}
.tools button:active{background:#f0ece3}
.tools button.danger{color:var(--bad);border-color:#e7d3cf}
footer{max-width:820px;margin:16px auto 0;padding:0 16px;font-size:11px;color:#9a9384;line-height:1.7;text-align:center}

@media (min-width:768px){
  .topbar{padding:16px 24px}
  main{padding:18px 24px 0}
  .qtitle{font-size:18px}
  .opt{font-size:15.5px}
  .modes{padding:12px 24px}
  .filters{padding:12px 24px 0}
  .tools{padding:0 24px}
}
</style>
</head>

<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#f7f4ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <div>

  <div class="filterRow" id="levelRow">

    <button class="fchip" data-v="进阶题">进阶题</button>
  </div>
</div>

<nav class="modes" id="modes">
  <button data-mode="seq" class="on">顺序练习</button>

</nav>

<main id="stage">

  <section class="qcard">
    <div class="qmeta">
      <span class="tag">单选题</span>
      <span class="tag lv">基础题</span>
      <span class="qno">第 1 题</span>
    </div>
    <h2 class="qtitle">对一般结构构件，箍筋弯钩的弯折角度不应小于90°, 弯折后平直段长度不应小于箍筋直径的（ ）倍。</h2>
    <div class="opts">
      <button class="opt"><span class="key">A</span><span class="txt">3</span></button>
      <button class="opt"><span class="key">B</span><span class="txt">4</span></button>
      <button class="opt"><span class="key">C</span><span class="txt">5</span></button>
      <button class="opt"><span class="key">D</span><span class="txt">6</span></button>
    </div>
    <div class="acts">
      <button class="btn primary" disabled>提交答案</button>
      <button class="btn ghost">下一题</button>
    </div>
    <div class="fb"></div>
  </section>
</main>

<div class="tools">
  <button id="btnExportWrong">导出错题（CSV）</button>
  <button id="btnExportAll">导出练习记录（JSON）</button>
  <button id="btnReset" class="danger">清空全部记录</button>
</div>

h必须至少留置1组试件。","options":[{"key":"A","text":"6"},{"key":"B","text":"10"},{"key":"C","text":"12"},{"key":"D","text":"15"}],"answer":["C"],"explain":"依据：《建筑地基基础工程施工质量验收标准》 GB 50202-2018 第5.1.3","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"混凝土拌合物入模温度不应低于5℃，且不应高于（ ）℃。","options":[{"key":"A","text":"30"},{"key":"B","text":"35"},{"key":"C","text":"40"},{"key":"D","text":"45"}],"answer":["B"],"explain":"依据：《110kV～750kV架空输电线路施工及验收规范》 GB 50233-2014 第6.2.10","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"基坑(槽)应及时分层回填，严禁灌水。回填料宜选用非膨胀土、弱膨胀土或掺（ ）%石灰的膨胀土。","options":[{"key":"A","text":"3"},{"key":"B","text":"5"},{"key":"C","text":"6"},{"key":"D","text":"8"}],"answer":["C"],"explain":"依据：《建筑地基基础工程施工规范》GB 51004-2015 第4.17.8","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"钢筋混凝土预制桩接头焊好后应进行外观检查，检查合格后必须经（ ），方可继续沉桩。","options":[{"key":"A","text":"强制风冷"},{"key":"B","text":"浇水冷却"},{"key":"C","text":"不冷却"},{"key":"D","text":"自然冷却"}],"answer":["D"],"explain":"依据：《建筑地基基础工程施工规范》GB 51004-2015 第5.5.10","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"混凝土拌合物的坍落度经时损失不应影响混凝土的正常施工，泵送混凝土拌合物的坍落度经时损失不宜大于（ ）。","options":[{"key":"A","text":"20mm/h"},{"key":"B","text":"30mm/h"},{"key":"C","text":"35mm/h"},{"key":"D","text":"40mm/h"}],"answer":["B"],"explain":"依据：《混凝土质量控制标准》 \nGB 50164-2011 第3.1.5，","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"混凝土结构子分部工程的质量验收，应在相关分项工程验收合格的基础上，进行质量控制资料检查及观感质量验收，并应对涉及结构安全的、有代表性的部位进行（ ）。","options":[{"key":"A","text":"外观检验"},{"key":"B","text":"几何尺寸检验"},{"key":"C","text":"结构实体检验"},{"key":"D","text":"工艺检验"}],"answer":["C"],"explain":"依据：《混凝土结构工程施工质量验收规范》 GB 50204－2015 第3.0.3","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"模板及支架应根据施工过程中的各种工况进行设计，应具有足够的承载力和刚度，并应保证其整体稳固性。该条文属于（ ）。","options":[{"key":"A","text":"一般规定"},{"key":"B","text":"主控项目"},{"key":"C","text":"强制性条文"},{"key":"D","text":"一般项目"}],"answer":["C"],"explain":"依据：《混凝土结构工程施工质量验收规范》 GB 50204－2015 第4.1.2","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"现浇结构的外观质量不应有严重缺陷，对已经出现的严重缺陷，应由施工单位提出技术处理方案，并经（ ）认可后进行处理。","options":[{"key":"A","text":"设计单位"},{"key":"B","text":"监理（建设）单位"},{"key":"C","text":"检测单位"},{"key":"D","text":"质量监督部门"}],"answer":["B"],"explain":"依据：《混凝土结构工程施工质量验收规范》 GB 50204－2015 第8.2.1","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"铁塔基础坑深与设计坑深偏差大于（ ） 时，其超深部分应铺石灌浆处理。","options":[{"key":"A","text":"+100mm"},{"key":"B","text":"+50mm"},{"key":"C","text":"+150mm"},{"key":"D","text":"+200mm"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010第5.0.4","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"铁塔基础坑回填，应符合设计要求，一般应分层夯实，每回填（ ）厚度夯实一次。坑口的地面上应筑防沉层，防沉层的上部边宽不得小于坑口边宽，其高度视土质夯实程度确定，不宜低于 （ ）。经过沉降后应及时补填夯实。工程移交时坑口回填土不应低于地面。","options":[{"key":"A","text":"200mm，300mm"},{"key":"B","text":"300mm，200mm"},{"key":"C","text":"300mm,300mm"},{"key":"D","text":"200mm,200mm"}],"answer":["C"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010第5.0.8","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"石坑回填应以石子与土按（ ）掺合后回填夯实。","options":[{"key":"A","text":"1：2"},{"key":"B","text":"1:3"},{"key":"C","text":"3:1"},{"key":"D","text":"3:2"}],"answer":["C"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010第5.0.9","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"接地沟的回填宜选取未掺有石块及其他杂物的泥土并应夯实，回填后应筑有防沉层，其高度宜为（ ），工程移交时回填土不得低于地面。","options":[{"key":"A","text":"100mm-200mm"},{"key":"B","text":"100mm-300mm"},{"key":"C","text":"200mm-300mm"},{"key":"D","text":"300mm-500mm"}],"answer":["B"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010第5.0.12","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"铁塔基础(不含掏挖基础和岩石基础)坑深允许偏差为（ ）。坑底应平整。同基基础坑在允许偏差范围内按最深基坑操平。","options":[{"key":"A","text":"+100mm，-50mm"},{"key":"B","text":"+50mm，-100mm"},{"key":"C","text":"±100mm"},{"key":"D","text":"±50mm"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010第5.0.3","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"在《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010中，已浇筑的混凝土，其抗压强度不应小于（ ）N/mm²。","options":[{"key":"A","text":"1"},{"key":"B","text":"1.1"},{"key":"C","text":"1.2"},{"key":"D","text":"1.3"}],"answer":["C"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010 中第6.1.7","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"冬期钢筋焊接，宜在室内进行，当必须在室外焊接时，其最低气温不宜低于（ ），并应符合JGJ18的规定。焊后的接头严禁立即碰到冰雪。","options":[{"key":"A","text":"-10℃"},{"key":"B","text":"-15℃"},{"key":"C","text":"-20℃"},{"key":"D","text":"-30℃"}],"answer":["C"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010 中第6.5.3","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"水下灌注的混凝土必须具有良好的和易性，坍落度一般采用（ ）。","options":[{"key":"A","text":"20mm-60mm"},{"key":"B","text":"160mm-200mm"},{"key":"C","text":"180mm-220mm"},{"key":"D","text":"200mm-240mm"}],"answer":["C"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010 中第6.3.5","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"业主代表(或业主委托的监理单位、运行单位代表)应参加隐蔽工程、单元工程、分部工程和单位工程的检查，（ ）单位应对施工单位的工程施工质量自评结果进行审定。","options":[{"key":"A","text":"监理"},{"key":"B","text":"设计"},{"key":"C","text":"施工"},{"key":"D","text":"运维"}],"answer":["A"],"explain":"依据：《1000kV 架空输电线路工程施工质量检验及评定规定》DL/T 5300-2013第3.0.3","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"随着混凝土的灌注，应适当提升和拆卸导管，导管提升后其底端应保持埋入混凝土不小于（ ）,严禁把导管底端提出混凝土面。","options":[{"key":"A","text":"1m"},{"key":"B","text":"2m"},{"key":"C","text":"3m"},{"key":"D","text":"4m"}],"answer":["B"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010 中第6.3.7","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"对于多个施工单位共同施工的线路工程,应由（ ）组织有关单位对分部工程和单位工程质量进行检验或抽样检验。","options":[{"key":"A","text":"监理"},{"key":"B","text":"设计"},{"key":"C","text":"施工"},{"key":"D","text":"业主"}],"answer":["D"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010 中第6.5.11","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"浇制后应在12h内开始浇水养护，当天气炎热、干燥有风时,应在 （ ）内进行浇水养护,养护时应在基础模板外侧加遮盖物，浇水次数应能够保持混凝土表面始终湿润，养护用水应与拌制用水相同。","options":[{"key":"A","text":"3h"},{"key":"B","text":"5h"},{"key":"C","text":"6h"},{"key":"D","text":"8h"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010 中第6.2.12","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"钢筋应按批进行验收，每批由同一牌号、同一炉罐号、同一规格的钢筋组成。每批质量通常不大于（ ）。超过60t的部分，每增加40t(或不足40t的余数)，增加一个拉伸试验试样和一个弯曲试验试样。","options":[{"key":"A","text":"40t"},{"key":"B","text":"50t"},{"key":"C","text":"60t"},{"key":"D","text":"80t"}],"answer":["C"],"explain":"依据：《110kV及以上架空输电线路施工质量检验规程》DL／T 5168-2023 第4.1.1","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"混凝土浇制过程中应严格控制水灰比。每班日或每个基础腿应检查（ ）及以上坍落度，预拌混凝土坍落度的检查应在现场浇筑过程中进行，每罐车不得少于一次。","options":[{"key":"A","text":"一次"},{"key":"B","text":"两次"},{"key":"C","text":"三次"},{"key":"D","text":"四次"}],"answer":["B"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010 中第6.2.6","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"一般直线塔基础,同一施工队每5基或不满5基应取一组单基或连续浇筑混凝土量超过（ ）时亦应取一组。","options":[{"key":"A","text":"100m³"},{"key":"B","text":"150m³"},{"key":"C","text":"200m³"},{"key":"D","text":"250m³"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010 中第6.2.10","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"设计交桩后个别丢失的塔位中心桩，应按设计数据予以补钉，其测量相对偏差，同向不大于（ ），对向不大于1/150。","options":[{"key":"A","text":"1/200"},{"key":"B","text":"1/150"},{"key":"C","text":"1/300"},{"key":"D","text":"1/350"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010 中第4.0.5","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"配制冬期施工的混凝土，应优先选用硅酸盐水泥或普通硅酸盐水泥。水泥强度等级不应低于（ ），浇筑C15强度等级混凝土时，最小水泥用量不应少于300kg/m’，水灰比不应大于0.6。","options":[{"key":"A","text":"32.5"},{"key":"B","text":"42.5"},{"key":"C","text":"52.5"},{"key":"D","text":"62.5"}],"answer":["B"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010 中第6.5.4","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"接地极的埋设深度与间距应符合设计文件要求。当无具体要求时，接地极顶面埋设深度不宜小于（ ）;水平接地极的间距不宜小于5m，垂直接地极的间距不宜小于其长度的2倍。","options":[{"key":"A","text":"0.6m"},{"key":"B","text":"0.8m"},{"key":"C","text":"1.0m"},{"key":"D","text":"1.2m"}],"answer":["B"],"explain":"依据：《电气装置安装工程接地装置施工及验收规范》DL/T 5852-2022第5.0.1","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"现场浇制混凝土应采用机械搅拌、机械捣固。混凝土下料高度超过（ ） 时应用串筒或溜管使混凝土下落。","options":[{"key":"A","text":"1m"},{"key":"B","text":"2m"},{"key":"C","text":"3m"},{"key":"D","text":"4m"}],"answer":["C"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010 第6.2.5","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"采用水泥砂浆或混凝土护坡时，厚度不宜小于（ ），护坡表面平滑，完成后应进行淋水养护。","options":[{"key":"A","text":"20mm"},{"key":"B","text":"30mm"},{"key":"C","text":"40mm"},{"key":"D","text":"50mm"}],"answer":["B"],"explain":"依据：《架空输电线路大跨越工程施工及验收规范》DL 5319-2014第6.6.4","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"《架空输电线路大跨越工程施工及验收规范》DL 5319-2014中规定，配制冬期施工的混凝土，宜选用硅酸盐水泥或普通硅酸盐水泥。浇筑C15及以上强度等级混凝土时，混凝土最小水泥用量不宜低于 280kg/m’，水胶比不应大于（ ）。大体积混凝土的最小水泥用量，可根据实际情况决定。","options":[{"key":"A","text":"0.45"},{"key":"B","text":"0.55"},{"key":"C","text":"0.65"},{"key":"D","text":"0.75"}],"answer":["B"],"explain":"依据：《架空输电线路大跨越工程施工及验收规范》DL 5319-2014第6.5.4","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"在高土壤电阻率地区采用放射形接地装置时，当在杆塔基础的放射形接地极每根长度的1.5倍范围内有土壤电阻率较低的地带时，可部分采用外引接地或先回填厚度不小于（ ）的净土垫层，后敷设接地极，并应用净土分层夯实回填。","options":[{"key":"A","text":"100mm"},{"key":"B","text":"200mm"},{"key":"C","text":"300mm"},{"key":"D","text":"400mm"}],"answer":["A"],"explain":"依据：《电气装置安装工程接地装置施工及验收规范》DL/T 5852-2022第8.0.6","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"日平均温度低于（ ）时，不得浇水养护。","options":[{"key":"A","text":"5℃"},{"key":"B","text":"10℃"},{"key":"C","text":"15℃"},{"key":"D","text":"20℃"}],"answer":["A"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010 中第6.2.12","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"钻孔灌注桩基础，随着混凝土的灌注，应适当提升和拆卸导管，导管提升后其底端应保持埋入混凝土不小于（ ）m,严禁把导管底端提出混凝土面。","options":[{"key":"A","text":"4"},{"key":"B","text":"3"},{"key":"C","text":"2.5"},{"key":"D","text":"2"}],"answer":["D"],"explain":"依据：《±800kV及以下直流架空输电线路工程施工及验收规程》DL/T 5235-2010 中第6.3.7","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"钢筋连接可采用绑扎搭接、焊接或机械连接，HRB400级及以上钢筋竖向连接宜用（ ）。","options":[{"key":"A","text":"绑扎搭接"},{"key":"B","text":"焊接"},{"key":"C","text":"机械连接"},{"key":"D","text":"以上全对"}],"answer":["C"],"explain":"依据：《电力建设施工技术规范 第1部分：土建结构工程》DL/T 5190.1-2022第4.3.4","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"同一纵向受力钢筋不宜设置两个或两个以上接头。接头末端至钢筋弯起点的距离，不应小于钢筋直径的（ ）倍。","options":[{"key":"A","text":"10"},{"key":"B","text":"15"},{"key":"C","text":"20"},{"key":"D","text":"30"}],"answer":["A"],"explain":"依据：《电力建设施工技术规范 第1部分：土建结构工程》DL/T 5190.1-2022第4.3.5","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"混凝土应进行抗压强度试验。有抗冻、抗渗等耐久性要求的混凝士，还应进行（ ）、抗渗性等耐久性指标的试验。","options":[{"key":"A","text":"抗冻性"},{"key":"B","text":"保水性"},{"key":"C","text":"黏聚性"},{"key":"D","text":"流动性"}],"answer":["A"],"explain":"依据：《电力建设施工技术规范 第1部分：土建结构工程》DL/T 5190.1-2022第4.4.22","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"预制构件脱模起吊时的混凝土强度应计算确定，且不宜小于（ ） MPa。","options":[{"key":"A","text":"5"},{"key":"B","text":"10"},{"key":"C","text":"15"},{"key":"D","text":"20"}],"answer":["C"],"explain":"依据：《电力建设施工技术规范 第1部分：土建结构工程》DL/T 5190.1-2022第5.2.8","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"钢筋电弧焊质量标准和检验方法中，接头焊缝外观质量，焊缝表面应平整，不得有凹陷或焊瘤。焊接接头区域不得有肉眼可见的裂纹，焊缝余高应为 ）。","options":[{"key":"A","text":"1mm～2mm"},{"key":"B","text":"1mm～3mm"},{"key":"C","text":"2mm～4mm"},{"key":"D","text":"1mm～2mm"}],"answer":["C"],"explain":"依据：《 电力建设施工质量验收规程 第1部分：土建工程》DL/T 5210.1-2021附录 C 钢筋焊接及机械连接接头质量标准和检验方法表C.0.3","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"钢筋电弧焊质量标准和检验方法中，钢筋和钢板应有质量证明书；焊接材料应有（ ）；钢筋应作力学性能和重量偏差检验，结果必须符合有关标准规定。","options":[{"key":"A","text":"产品检测报告"},{"key":"B","text":"工艺报告"},{"key":"C","text":"产品合格证"},{"key":"D","text":"强度检测报告"}],"answer":["C"],"explain":"依据：《 电力建设施工质量验收规程 第1部分：土建工程》DL/T 5210.1-2021附录 C 钢筋焊接及机械连接接头质量标准和检验方法表C.0.3","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"泥浆护壁成孔灌注桩，桩身完整性采用低应变法时，抽检数量不应少于总桩数的 （ ），且不应少于 10 根，每根柱子承台下的桩抽检数量不应少于 1 根。","options":[{"key":"A","text":"5%"},{"key":"B","text":"10%"},{"key":"C","text":"20%"},{"key":"D","text":"30%"}],"answer":["C"],"explain":"依据：《 电力建设施工质量验收规程 第1部分：土建工程》DL/T 5210.1-2021第5.7.10","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"有防水要求的变形缝处混凝土结构的厚度不宜小于（ ）mm。","options":[{"key":"A","text":"100"},{"key":"B","text":"200"},{"key":"C","text":"300"},{"key":"D","text":"500"}],"answer":["C"],"explain":"依据：《电力建设工程变形缝施工技术规范》DL/T 5738-2016 第4.2.2","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"伸缩缝从基础顶面或地面开始，将相邻区段上部结构的构件完全分开(基础可不分开)，设计双排横向或纵向平面框架，缝的净宽宜为（ ）。","options":[{"key":"A","text":"10～20mm"},{"key":"B","text":"20～30mm"},{"key":"C","text":"10～30mm"},{"key":"D","text":"30～60mm"}],"answer":["D"],"explain":"依据：《电力建设工程变形缝施工技术规范》DL/T 5738-2016 第6.2.1","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"砌体挡土墙沉降缝间距宜为（ ）。","options":[{"key":"A","text":"5～10m"},{"key":"B","text":"10～15m"},{"key":"C","text":"10～20m"},{"key":"D","text":"5～15m"}],"answer":["C"],"explain":"依据：《电力建设工程变形缝施工技术规范》DL/T 5738-2016 第5.3.3","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"砌体护坡沉降缝间距宜为（ ）。","options":[{"key":"A","text":"10～15m"},{"key":"B","text":"10～20m"},{"key":"C","text":"10～25m"},{"key":"D","text":"20～25m"}],"answer":["D"],"explain":"依据：《电力建设工程变形缝施工技术规范》DL/T 5738-2016 第5.3.4","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"大体积混凝土是指混凝土结构物实体最小尺寸大于（ ）的混凝士，或因混凝土胶凝材料水化热引起的温度变化和收缩而可能产生有害裂缝的混凝士。","options":[{"key":"A","text":"0.5m"},{"key":"B","text":"1m"},{"key":"C","text":"1.5m"},{"key":"D","text":"3m"}],"answer":["B"],"explain":"依据：《水工混凝土施工规范》DL/T 5144-2015第2.1.2","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"袋装水泥仓库应有排水、通风措施，保持干燥;袋装水泥堆放时，应设防潮层，距地面、边墙至少30cm，堆放高度不得超过（ ）袋，并留出运输通道。","options":[{"key":"A","text":"5"},{"key":"B","text":"10"},{"key":"C","text":"15"},{"key":"D","text":"20"}],"answer":["C"],"explain":"依据：《水工混凝土施工规范》DL/T 5144-2015第3.2.3","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"大体积混凝土的胶凝材料用量不宜低于140kg/m³,水泥熟料含量不宜低于（ ）kg/m³。","options":[{"key":"A","text":"50"},{"key":"B","text":"70"},{"key":"C","text":"100"},{"key":"D","text":"140"}],"answer":["B"],"explain":"依据：《水工混凝土施工规范》DL/T 5144-2015第4.0.5","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"振捣器插入混凝土的间距应根据试验确定，并不超过振捣器有效半径的（ ）倍。","options":[{"key":"A","text":"1"},{"key":"B","text":"1.5"},{"key":"C","text":"2"},{"key":"D","text":"3"}],"answer":["B"],"explain":"依据：《水工混凝土施工规范》DL/T 5144-2015第7.2.7","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"混凝土拌和物出机口温度与运输、浇筑过程中的温度回升以及允许浇筑温度应符合设计要求。设计无要求时，应根据允许最高温度计算允许浇筑温度。未明确温控要求的部位，其混凝土浇筑温度不宜大于 （ ）℃。","options":[{"key":"A","text":"20"},{"key":"B","text":"25"},{"key":"C","text":"28"},{"key":"D","text":"30"}],"answer":["C"],"explain":"依据：《水工混凝土施工规范》DL/T 5144-2015第8.2.1","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"使用经纬仪加塔尺视距法测量时,其视距长度不宜大于（ ）,受地形条件限制时可适当放长。","options":[{"key":"A","text":"200m"},{"key":"B","text":"300m"},{"key":"C","text":"400m"},{"key":"D","text":"500m"}],"answer":["C"],"explain":"依据：《电力工程施工测量标准》DL/T 5578-2020 第10.1.4","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"输电线路施工测量使用的经纬仪最小角度读数不应大于（ ）。","options":[{"key":"A","text":"30″"},{"key":"B","text":"1′"},{"key":"C","text":"1′30″"},{"key":"D","text":"2′"}],"answer":["B"],"explain":"依据：《电力工程施工测量标准》DL/T 5578-2020 第10.1.3","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"现浇铁塔基础质量检验评定标准及检查方法中属于主控项目的是（ ）。","options":[{"key":"A","text":"立柱断面尺寸"},{"key":"B","text":"钢筋保护层厚度"},{"key":"C","text":"混凝土表面质量"},{"key":"D","text":"基础埋深"}],"answer":["D"],"explain":"依据：《架空输电线路大跨越工程施工质量检验及评定规程》DL/T 5732-2016 表4.3.1","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"岩石、掏挖基础质量检验评定标准及检查方法中属于主控项目的是（ ）。","options":[{"key":"A","text":"土质、岩石性质"},{"key":"B","text":"回填土"},{"key":"C","text":"基础顶面间高差（mm）"},{"key":"D","text":"钢筋保护层厚度（mm）"}],"answer":["A"],"explain":"依据：《架空输电线路大跨越工程施工质量检验及评定规程》DL/T 5732-2016 表4.3.2","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"普通基础坑分坑和开挖质量检验标准及检查方法中，基础坑中心根开及对角线尺寸允许偏差为（ ）。","options":[{"key":"A","text":"±0.2%"},{"key":"B","text":"±0.2‰"},{"key":"C","text":"±0.5%"},{"key":"D","text":"±0.5‰"}],"answer":["A"],"explain":"依据：《架空输电线路大跨越工程施工质量检验及评定规程》DL/T 5732-2016 表4.2.3","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"现浇铁塔基础质量检验评定标准及检查方法中，属于一般项目的是（ ）。","options":[{"key":"A","text":"地脚螺栓、插入角钢（钢管）与钢筋规格、数量"},{"key":"B","text":"混凝土强度"},{"key":"C","text":"底板断面尺寸（%）"},{"key":"D","text":"钢筋保护层厚度（mm）"}],"answer":["D"],"explain":"依据：《架空输电线路大跨越工程施工质量检验及评定规程》DL/T 5732-2016 表4.3.1","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"水平接地装置质量检验评定标准及检查方法中，属于主控项目的是（ ）。","options":[{"key":"A","text":"接地体敷设"},{"key":"B","text":"接地体防腐"},{"key":"C","text":"接地体连接"},{"key":"D","text":"接地引下线安装"}],"answer":["C"],"explain":"依据：《架空输电线路大跨越工程施工质量检验及评定规程》DL/T 5732-2016 表4.6.1","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"铁塔基础坑深与设计坑深偏差大于（ ）时，其超深部分应采用铺石灌浆处理。","options":[{"key":"A","text":"+50mm"},{"key":"B","text":"+100mm"},{"key":"C","text":"+150mm"},{"key":"D","text":"+200mm"}],"answer":["B"],"explain":"依据：《架空输电线路大跨越工程施工及验收规范》DL5319-2014第5.0.6","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"铁塔基础坑回填，应符合设计要求，一般应分层夯实，每回填（ ）厚度夯实一次。","options":[{"key":"A","text":"200mm"},{"key":"B","text":"300mm"},{"key":"C","text":"400mm"},{"key":"D","text":"500mm"}],"answer":["B"],"explain":"依据：《架空输电线路大跨越工程施工及验收规范》DL5319-2014第5.0.8","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"工程桩应按《建筑基桩检测技术规范》JGJ106 进行检测。每根工程桩均应进行桩身完整性检测。采用高应变法进行单桩竖向承载力检测时，其抽检数量不宜少于总桩数的（ ），且不得少于5根。","options":[{"key":"A","text":"3%"},{"key":"B","text":"4%"},{"key":"C","text":"5%"},{"key":"D","text":"10%"}],"answer":["C"],"explain":"依据：《架空输电线路大跨越工程施工及验收规范》DL5319-2014第6.1.16","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"混凝土下料高度超过（ ）时应用串筒或溜管使混凝土下落。","options":[{"key":"A","text":"1m"},{"key":"B","text":"2m"},{"key":"C","text":"3m"},{"key":"D","text":"4m"}],"answer":["C"],"explain":"依据：《架空输电线路大跨越工程施工及验收规范》DL5319-2014第6.2.4","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"非大体积混凝 "explain":"依据：《输变电工程建设标准强制性条文实施管理规程第6部分：输电线路工程设计》表5（续）第23条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"钻机立轴（转盘）、天车（中心或前缘切点）、孔位中心必须在同一（ ）线上。","options":[{"key":"A","text":"中心"},{"key":"B","text":"中垂"},{"key":"C","text":"对角"},{"key":"D","text":"水平"}],"answer":["A"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第6部分：输电线路工程设计》Q/GDW 10248.6-2016表5（续）第35条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"建筑物的地基变形计算值，不应（ ）地基变形允许值。","options":[{"key":"A","text":"大于"},{"key":"B","text":"小于"},{"key":"C","text":"等于"},{"key":"D","text":"大于等于"}],"answer":["A"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第6部分：输电线路工程设计》Q/GDW 10248.6-2016表10（续）第9条","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"接地干线应在不同的（ ）及以上与接地网相连接。自然接地体应在不同的两点及以上与接地干线或接地网相连接。","options":[{"key":"A","text":"四点"},{"key":"B","text":"三点"},{"key":"C","text":"两点"},{"key":"D","text":"一点"}],"answer":["C"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第6部分：输电线路工程设计》10248.6-2016表13（续）第6条","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"接地体引出线的截面不应小于50mm2并应进行热稳定验算，引出线表面应进行有效的（ ）处理。","options":[{"key":"A","text":"防滑"},{"key":"B","text":"防潮"},{"key":"C","text":"防腐"},{"key":"D","text":"静电"}],"answer":["C"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第6部分：输电线路工程设计》10248.6-2016表13（续）第17条","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"接地体的埋设深度不应小于（ ）m，接地体不应与地下燃气管、送水管接触。","options":[{"key":"A","text":"0.5"},{"key":"B","text":"0.6"},{"key":"C","text":"0.7"},{"key":"D","text":"0.8"}],"answer":["B"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第6部分：输电线路工程设计》10248.6-2016表13（续）第29条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"灌注桩基础混凝土强度检验应以试块为依据，试块的制作应（ ）取一组，承台及联梁试块的制作应每基一组。","options":[{"key":"A","text":"每两基"},{"key":"B","text":"每桩"},{"key":"C","text":"每基"},{"key":"D","text":"每两桩"}],"answer":["B"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第7部分：输电线路工程施工》10248.6-2016表6 第3条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"对浇灌钻孔式岩石基础，应采取措施（ ）混凝土收缩量。","options":[{"key":"A","text":"减小"},{"key":"B","text":"加强"},{"key":"C","text":"保持不变"},{"key":"D","text":"酌情减小"}],"answer":["A"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第7部分：输电线路工程施工》10248.6-2016表6第7条","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"基坑、管沟边沿及边坡等危险地段施工时，应设置安全护栏和明显警示标志。夜间施工时，现场（ ）应满足施工需要。","options":[{"key":"A","text":"自然条件"},{"key":"B","text":"地质条件"},{"key":"C","text":"照明条件"},{"key":"D","text":"地理条件"}],"answer":["C"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第7部分：输电线路工程施工》10248.6-2016表6第16条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"土方回填应填筑压实，且压实系数应满足（ ）要求。当采用分层回填时，应在下层的压实系数经试验合格后，才能进行上层施工。","options":[{"key":"A","text":"实际"},{"key":"B","text":"业主"},{"key":"C","text":"设计"},{"key":"D","text":"运维"}],"answer":["C"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第7部分：输电线路工程施工》10248.6-2016表6第17条）","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"对长期处于潮湿环境的重要混凝土结构所用的砂、石应进行（ ）检验。","options":[{"key":"A","text":"酸活性"},{"key":"B","text":"碱活性"},{"key":"C","text":"硫活性"},{"key":"D","text":"钠活性"}],"answer":["B"],"explain":"依据：《输变电工程建设标准强制性条文实施管理规程第7部分：输电线路工程施工》10248.6-2016表6第38条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"钢筋混凝土材质的微型桩桩身混凝土强度及材料性能遵循下列要求，现浇钢筋混凝土桩身结构宜采用细石混凝土，混凝土设计强度等级不应低于（ ）。","options":[{"key":"A","text":"C45"},{"key":"B","text":"C40"},{"key":"C","text":"C35"},{"key":"D","text":"C30"}],"answer":["D"],"explain":"依据：《架空输电线路微型桩基础设计规范》Q/GDW 10863—2024第6.1.1","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"当环境对基础腐蚀等级为（ ）及以上时，微型桩基础应进行防腐设计。","options":[{"key":"A","text":"弱"},{"key":"B","text":"中"},{"key":"C","text":"强"},{"key":"D","text":"微弱"}],"answer":["A"],"explain":"依据：《架空输电线路微型桩基础设计规范》Q/GDW 10863—2024第4.2.3条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"岩石锚杆基础适用的水文地质与地形条件符合以下要求，基础位置地形坡度不宜大于 （ ）。","options":[{"key":"A","text":"60°"},{"key":"B","text":"50°"},{"key":"C","text":"40°"},{"key":"D","text":"30°"}],"answer":["D"],"explain":"依据：《架空输电线路岩石基础技术规范》Q/GDW 11333—2021第5.2.2条","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"对于钻孔、清孔过程中出现的局部塌孔或漏水（气）情况严重时，应停止钻进并报（ ）单位及时处理；锚孔钻成后，应测量孔深、孔径、倾斜度、孔间距等，并详细做好记录，并组织验槽。","options":[{"key":"A","text":"监理"},{"key":"B","text":"设计"},{"key":"C","text":"施工"},{"key":"D","text":"运维"}],"answer":["B"],"explain":"依据：《架空输电线路岩石基础技术规范》Q/GDW 11333—2021第8.2.2条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"山区线路基础应优先选择（ ），并采用杆塔全方位长短腿与不等高基础相结合的设计方案。","options":[{"key":"A","text":"原状土基础"},{"key":"B","text":"冻土基础"},{"key":"C","text":"盐渍基础"},{"key":"D","text":"黄土基础"}],"answer":["A"],"explain":"依据：《架空输电线路特殊地基基础设计规范》Q/GDW 11266—2024第11.1条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"微型桩基础中心水平偏差不大于（ ） mm。","options":[{"key":"A","text":"20"},{"key":"B","text":"25"},{"key":"C","text":"50"},{"key":"D","text":"35"}],"answer":["C"],"explain":"依据：《架空输电线路微型桩基础设计规范》Q/GDW 10863—2024第10.2.1条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"夯实水泥土桩复合地基适用于处理地下水位以上的粉土、黏性土、素填土和杂填土等地基，处理地基的深度不宜大于（ ）m。","options":[{"key":"A","text":"3"},{"key":"B","text":"5"},{"key":"C","text":"10"},{"key":"D","text":"15"}],"answer":["C"],"explain":"依据：《建筑地基处理技术规范》JGJ 79 - 2012第7.6.1","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"管桩采用的混凝土强度等级不应低于（ ），脱模时混凝土抗压强度不应低于混凝土设计强度等级 75%。承台混凝土强度等级不宜低于 C25。","options":[{"key":"A","text":"C30"},{"key":"B","text":"C40"},{"key":"C","text":"C50"},{"key":"D","text":"C60"}],"answer":["D"],"explain":"依据：《架空输电线路混凝土预制管桩基础技术规定》Q/GDW 11729—2017第5.4.1条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"关于掏挖基础的护筒描述，为使孔口成型，并防止孔口土层和颗粒坍塌、坠落的设施。护筒一般为用（ ）卷制的筒体，也可为混凝土浇筑的筒体。","options":[{"key":"A","text":"铁板"},{"key":"B","text":"铝板"},{"key":"C","text":"钢板"},{"key":"D","text":"铜板"}],"answer":["C"],"explain":"依据：《输电线路掏挖基础机械化施工工艺导则》Q/GDW 11332—2023第3.2条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"掏挖基础的设计应便于机械化施工，根据土质及地形环境情况，尽量不扩底。如需扩底，基础扩底 的设计应与旋挖钻机的扩底钻头相符，不宜过大。单轴饱和抗压强度大于（ ）MPa 的岩层不宜设计扩底。","options":[{"key":"A","text":"45"},{"key":"B","text":"35"},{"key":"C","text":"25"},{"key":"D","text":"15"}],"answer":["D"],"explain":"依据：《输电线路掏挖基础机械化施工工艺导则》Q/GDW 11332—2023第4.2条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"旋挖钻机就位应保持平稳，就位后钻头中心和桩中心应对正，误差控制在 （ ）mm 以内。","options":[{"key":"A","text":"40"},{"key":"B","text":"30"},{"key":"C","text":"20"},{"key":"D","text":"10"}],"answer":["C"],"explain":"依据：《输电线路掏挖基础机械化施工工艺导则》Q/GDW 11332—2023第6.9.2条","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"旋挖钻机就位后，应检查其回转半径内是否有障碍物影响回转，并在回转半径四周设置（ ）。","options":[{"key":"A","text":"安全警示标识"},{"key":"B","text":"防盗措施"},{"key":"C","text":"安全通道"},{"key":"D","text":"专人监护"}],"answer":["A"],"explain":"依据：《输电线路掏挖基础机械化施工工艺导则》Q/GDW11332—2023第6.9.3条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"混凝土运输采用搅拌车运输，冬期施工时，应采取措施减少混凝土在运输过程中的（ )损失。","options":[{"key":"A","text":"水分"},{"key":"B","text":"温度"},{"key":"C","text":"水泥"},{"key":"D","text":"砂石"}],"answer":["B"],"explain":"依据：《输电线路掏挖基础机械化施工工艺导则》Q/GDW11332—2023第13.1.3条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"灌注桩基础施工的要求，除能自行造浆的黏性土层外，均应制备泥浆。泥浆制备应选用高塑性黏土或膨润土。泥浆应根据施工机械、工艺及穿越土层情况进行（ ）设计。","options":[{"key":"A","text":"配合比"},{"key":"B","text":"水灰比"},{"key":"C","text":"泥沙比"},{"key":"D","text":"氮氧比"}],"answer":["A"],"explain":"依据：《架空输电线路灌注桩基础技术规定》Q/GDW 11392-2015第8.2.1条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"如在钻进过程中发生斜孔、塌孔和护筒周围冒浆、失稳等现象时，应（ ），待采取相应措施后再进行钻进。","options":[{"key":"A","text":"缓慢钻孔"},{"key":"B","text":"停止钻孔"},{"key":"C","text":"反复钻孔"},{"key":"D","text":"加速钻孔"}],"answer":["B"],"explain":"依据：《架空输电线路灌注桩基础技术规定》Q/GDW 11392-2015第8.2.6条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"旋挖钻机成孔应采用跳挖方式，钻斗倒出的土距桩孔口的最小距离应大于( )m，并应及时清除。应根据钻进速度同步补充泥浆，保持所需的泥面高度不变。","options":[{"key":"A","text":"2"},{"key":"B","text":"4"},{"key":"C","text":"6"},{"key":"D","text":"8"}],"answer":["C"],"explain":"依据：《架空输电线路灌注桩基础技术规定》Q/GDW 11392-2015第8.2.8条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"关于冲击成孔的要求中，大直径桩孔冲击成孔时，可分级成孔，（ ）成孔直径应为设计桩径的 0.6～0.8 倍。","options":[{"key":"A","text":"第一级"},{"key":"B","text":"第二级"},{"key":"C","text":"第三级"},{"key":"D","text":"第四级"}],"answer":["A"],"explain":"依据：《架空输电线路灌注桩基础技术规定》Q/GDW 11392-2015第8.2.8条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"钢筋笼吊装完毕后，应安置导管或气泵管二次清孔，并应进行孔位、孔径、垂直度、孔深、（ ）等检验，合格后应立即灌注混凝土。","options":[{"key":"A","text":"钢筋直径"},{"key":"B","text":"塌落度"},{"key":"C","text":"沉渣厚度"},{"key":"D","text":"保护层厚度"}],"answer":["C"],"explain":"依据：《架空输电线路灌注桩基础技术规定》Q/GDW 11392-2015第8.2.14条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"人工挖孔桩施工开孔前，桩位应准确定位放样，在桩位外设置定位基准桩，安装护壁模板必须用桩（ ）校正模板位置，并应由专人负责。","options":[{"key":"A","text":"对角线"},{"key":"B","text":"中垂线"},{"key":"C","text":"边缘点"},{"key":"D","text":"中心点"}],"answer":["D"],"explain":"依据：《架空输电线路灌注桩基础技术规定》Q/GDW 11392-2015第8.2.26条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"螺旋锚锚杆弯曲度应不大于杆全长的（ ）。","options":[{"key":"A","text":"0.1%"},{"key":"B","text":"0.2%"},{"key":"C","text":"0.3%"},{"key":"D","text":"0.4%"}],"answer":["B"],"explain":"依据：《架空输电线路螺旋锚基础施工及质量验收规范》Q/GDW 10585—2022第6.1.3条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"螺旋锚基础浇筑时，基础承台尺寸、坑深应符合设计要求，其深度误差不应大于（ ）mm。","options":[{"key":"A","text":"-30"},{"key":"B","text":"-50"},{"key":"C","text":"303"},{"key":"D","text":"50"}],"answer":["B"],"explain":"依据：《架空输电线路螺旋锚基础施工及质量验收规范》Q/GDW 10585—2022第8.1条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"混凝土配比材料用量每班日或每基基础应至少检查（ ），以保证配合比符合施工技术设计规定。","options":[{"key":"A","text":"一次"},{"key":"B","text":"两次"},{"key":"C","text":"三次"},{"key":"D","text":"四次"}],"answer":["B"],"explain":"依据：《架空输电线路灌注桩基础技术规定》Q/GDW 11392-2015第8.4.6条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"分部工程质量由施工单位自评，（ ）核定。","options":[{"key":"A","text":"建设管理单位"},{"key":"B","text":"监理单位"},{"key":"C","text":"设计单位"},{"key":"D","text":"环水保验收单位"}],"answer":["B"],"explain":"依据：《架空输电线路水土保持设施质量检验及评定规程》Q/GDW 11971—2019第6.2.2条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"单位工程质量评定由（ ）组织。","options":[{"key":"A","text":"建设管理单位"},{"key":"B","text":"监理单位"},{"key":"C","text":"设计单位"},{"key":"D","text":"环水保验收单位"}],"answer":["A"],"explain":"依据：《架空输电线路水土保持设施质量检验及评定规程》Q/GDW 11971—2019第6.2.3条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"低应变法是采用低能量瞬态或稳态的方式在桩顶激振，实测桩顶部的速度时程曲线，或在实测桩顶部的速度时程曲线的同时，实测桩顶部的力时程曲线。通过波动理论的时域分析或频域分析，对桩身（ ）进行判定的检测方法。","options":[{"key":"A","text":"不完整性"},{"key":"B","text":"完整性"},{"key":"C","text":"整体性"},{"key":"D","text":"强度"}],"answer":["B"],"explain":"依据：《输变电工程地基基础检测规范》Q/GDW 11653-2017第3.14条","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"扩充基础、柱下条形基础、筏形基础和桩基础承台宜进行混凝土强度检测，单位工程抽检数量不应小于构件总数的（ ）。","options":[{"key":"A","text":"5%"},{"key":"B","text":"10%"},{"key":"C","text":"15%"},{"key":"D","text":"20%"}],"answer":["B"],"explain":"依据：《输变电工程地基基础检测规范》Q/GDW 11653-2017第5.4.2条","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"每种规格钢筋的接头试件不应少于（ ）根。","options":[{"key":"A","text":"1根"},{"key":"B","text":"2根"},{"key":"C","text":"3根"},{"key":"D","text":"5根"}],"answer":["C"],"explain":"依据：《钢筋焊接及验收规程》JGJ 18-2012 第7.0.2","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"施工现场直螺纹钢筋接头安装时，外露螺纹不宜超过（ ）。","options":[{"key":"A","text":"1P（螺距）"},{"key":"B","text":"2P（螺距）"},{"key":"C","text":"3P（螺距）"},{"key":"D","text":"4P（螺距）"}],"answer":["B"],"explain":"依据：《钢筋焊接及验收规程》JGJ 18-2012 第6.2.1","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"向下泵送混凝土时，配管的倾斜度不宜大于（ ）。","options":[{"key":"A","text":"5°"},{"key":"B","text":"10°"},{"key":"C","text":"12°"},{"key":"D","text":"15°"}],"answer":["C"],"explain":"依据：《混凝土泵送施工技术规程》JGJ/T 10-2011第8.4.2","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"回弹仪的检定周期为（ ）。","options":[{"key":"A","text":"3 个月"},{"key":"B","text":"半年"},{"key":"C","text":"1 年"},{"key":"D","text":"2 年"}],"answer":["B"],"explain":"依据：《回弹法检测混凝土抗压强度技术规程》JGJ/T 23-2011第3.2.1","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"采用回弹法检测混凝土强度时，每一测区应读取（ ）个回弹值。","options":[{"key":"A","text":"10"},{"key":"B","text":"12"},{"key":"C","text":"16"},{"key":"D","text":"20"}],"answer":["C"],"explain":"依据：《回弹法检测混凝土抗压强度技术规程》JGJ/T 23-2011第4.2.2","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"根据《建筑砂浆基本性能试验方法标准》JGJ/T70-2009，砂浆稠度试验中，试锥下沉深度的两次测定值之差大于（ ）时，应重新取样测定。","options":[{"key":"A","text":"5mm"},{"key":"B","text":"10mm"},{"key":"C","text":"15mm"},{"key":"D","text":"20mm"}],"answer":["B"],"explain":"依据：《建筑砂浆基本性能试验方法标准》JGJ/T70-2009第4.0.4","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"砂浆立方体抗压强度试验时，试件拆模后应立即放入温度为（ ）℃，相对湿度为（ ）以上的标准养护室中养护。","options":[{"key":"A","text":"20±2，相对湿度≥90%"},{"key":"B","text":"20±5，相对湿度≥60%"},{"key":"C","text":"23±2，相对湿度≥50%"},{"key":"D","text":"25±2，相对湿度≥80%"}],"answer":["A"],"explain":"依据：《建筑砂浆基本性能试验方法标准》JGJ/T70-2009第9.0.3","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"冬期施工期限划分原则是当室外日平均气温（ ）即进入冬期施工。","options":[{"key":"A","text":"连续3d室外日平均气温低于5℃"},{"key":"B","text":"连续5d室外日平均气温低于5℃"},{"key":"C","text":"连续7d室外日平均气温低于5℃"},{"key":"D","text":"连续10d室外日平均气温低于5℃"}],"answer":["B"],"explain":"依据：《建筑工程冬期施工规程》JGJ/T 104-2011 第1.0.3","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"采用蓄热法、暖棚法、加热法等施工的普通混凝土，采用硅酸盐水泥或普通硅酸盐水泥配制时，其受冻临界强度不应小于设计混凝土强度等级值的（ ）。","options":[{"key":"A","text":"20%"},{"key":"B","text":"30%"},{"key":"C","text":"40%"},{"key":"D","text":"50%"}],"answer":["B"],"explain":"依据：《建筑工程冬期施工规程》JGJ/T 104-2011 第6.1.1","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"当环境温度低于（ ）时，不宜进行钢筋负温焊接。","options":[{"key":"A","text":"-10℃"},{"key":"B","text":"-15℃"},{"key":"C","text":"-20℃"},{"key":"D","text":"-25℃"}],"answer":["C"],"explain":"依据：《建筑工程冬期施工规程》JGJ/T 104-2011 第5.1.2","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"拌合水加热的最高温度不应超过（ ）。","options":[{"key":"A","text":"60℃"},{"key":"B","text":"80℃"},{"key":"C","text":"100℃"},{"key":"D","text":"120℃"}],"answer":["B"],"explain":"依据：《建筑工程冬期施工规程》JGJ/T 104-2011 第6.2.1","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"当环境温度低于（ ）时，不应进行各种焊接。","options":[{"key":"A","text":"-5℃"},{"key":"B","text":"-10℃"},{"key":"C","text":"-20℃"},{"key":"D","text":"-25℃"}],"answer":["C"],"explain":"依据：《钢筋焊接及验收规程》JGJ18-2012第 4.1.11","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"在钢筋焊接接头拉伸试验中，3个试件均断于钢筋母材，呈延性断裂，其抗拉强度大于或等于钢筋母材抗拉强度标准值，该检验批接头拉伸试验应评定为（ ）。","options":[{"key":"A","text":"合格"},{"key":"B","text":"复验"},{"key":"C","text":"不合格"},{"key":"D","text":"视情况而定"}],"answer":["A"],"explain":"依据：《钢筋焊接及验收规程》JGJ18-2012第 5.1.7","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"（ ）应用于柱、墙等构筑物现浇混凝土结构中竖向受力钢筋的连接。","options":[{"key":"A","text":"钢筋电阻点焊"},{"key":"B","text":"钢筋闪光对焊"},{"key":"C","text":"钢筋电渣压力焊"},{"key":"D","text":"钢筋电弧焊"}],"answer":["C"],"explain":"依据：《钢筋焊接及验收规程》JGJ 18 - 2012第 4.6.1","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"从事钢筋焊接施工的焊工必须持有（ ），并应按照合格证规定的范围上岗操作。","options":[{"key":"A","text":"特种作业操作证"},{"key":"B","text":"钢筋焊工考试合格证"},{"key":"C","text":"特种设备操作证"},{"key":"D","text":"安全生产考核合格证"}],"answer":["B"],"explain":"依据：《钢筋焊接及验收规程》JGJ 18 - 2012第 6.0.1","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"水泥土搅拌桩用于处理泥炭土、有机质土、pH值小于4 的酸性土、塑性指数大于（ ）的黏土，或在腐蚀性环境中以及无工程经验的地区使用时，必须通过现场和室内试验确定其适用性。","options":[{"key":"A","text":"25"},{"key":"B","text":"20"},{"key":"C","text":"30"},{"key":"D","text":"40"}],"answer":["A"],"explain":"依据：《建筑地基处理技术规范》JGJ 79 - 2012第7.3.2","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"灰土挤密桩、土挤密桩复合地基处理适用于处理地下水位以上的粉土、黏性土、素填土、杂填土和湿陷性黄土等地基，可处理地基的厚度宜为（ ）m。","options":[{"key":"A","text":"3~15"},{"key":"B","text":"2~10"},{"key":"C","text":"5~15"},{"key":"D","text":"3~10"}],"answer":["A"],"explain":"依据：《建筑地基处理技术规范》JGJ 79 - 2012第7.5.1","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"建筑桩基设计时，对于设计等级为甲级的非嵌岩桩建筑桩基，应进行（ ）。","options":[{"key":"A","text":"仅竖向承载力计算"},{"key":"B","text":"沉降计算"},{"key":"C","text":"水平位移计算"},{"key":"D","text":"仅桩身承载力计算"}],"answer":["B"],"explain":"依据：《建筑桩基技术规范》JGJ 94-2008 3.1.4","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"下列哪种桩型属于部分挤土桩（ ）。","options":[{"key":"A","text":"沉管灌注桩"},{"key":"B","text":"泥浆护壁法钻孔灌注桩"},{"key":"C","text":"长螺旋压灌灌注桩"},{"key":"D","text":"打入式预制桩"}],"answer":["C"],"explain":"依据：《建筑桩基技术规范》JGJ 94-2008第 3.3.1","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"建筑桩基技术中，桩身混凝土强度等级不得小于（ ）。","options":[{"key":"A","text":"C20"},{"key":"B","text":"C25"},{"key":"C","text":"C30"},{"key":"D","text":"C35"}],"answer":["B"],"explain":"依据：《建筑桩基技术规范》JGJ 94-2008第4.1.2","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"关于桩身完整性检测，以下哪种说法是正确的（ ）。","options":[{"key":"A","text":"桩身完整性检测仅适用于混凝土灌注桩"},{"key":"B","text":"桩身完整性检测可以判定桩身缺陷的位置、范围和程度"},{"key":"C","text":"桩身完整性检测必须通过静载试验完成"},{"key":"D","text":"桩身完整性检测结果与桩的承载力无关"}],"answer":["B"],"explain":"依据：《建筑基桩检测技术规范》JGJ 106-2014 第2.1.2","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"以下哪种情况应采用单桩竖向抗压静载试验进行验收检测（ ）。","options":[{"key":"A","text":"设计等级为乙级的桩基"},{"key":"B","text":"施工过程中变更了工艺参数"},{"key":"C","text":"采用高应变法检测的预制桩"},{"key":"D","text":"地基条件简单且成桩质量可靠"}],"answer":["B"],"explain":"依据：《建筑基桩检测技术规范》JGJ 106-2014 第3.3.4","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"桩身完整性是反映桩身截面尺寸相对变化、桩身材料（ ）的综合定性指标。","options":[{"key":"A","text":"密实性"},{"key":"B","text":"密实性和连续性"},{"key":"C","text":"连续性"},{"key":"D","text":"完整性"}],"answer":["B"],"explain":"依据：《建筑基桩检测技术规范》JGJ 106-2014第2.1.2","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"当采用低应变法或声波透射法检测时，受检桩混凝土强度不应低于设计强度的（ ）%,且不应低于15MPa。","options":[{"key":"A","text":"50"},{"key":"B","text":"60"},{"key":"C","text":"70"},{"key":"D","text":"80"}],"answer":["C"],"explain":"依据：《建筑基桩检测技术规范》JGJ 106-2014第3.2.5","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"当采用钻芯法检测时，受检桩的混凝土龄期应达到（ ）d,或受检桩同条件养护试件强度应达到设计强度要求。","options":[{"key":"A","text":"7"},{"key":"B","text":"14"},{"key":"C","text":"28"},{"key":"D","text":"30"}],"answer":["C"],"explain":"依据：《建筑基桩检测技术规范》JGJ 106-2014第3.2.5","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"建筑地基检测中，土（岩）地基载荷试验最大加载量，对于设计提供依据的试验，岩石地基应加载至（ ）。","options":[{"key":"A","text":"设计承载力特征值的 2 倍"},{"key":"B","text":"设计承载力特征值的 3 倍"},{"key":"C","text":"极限状态"},{"key":"D","text":"设计要求的最大试验荷载"}],"answer":["B"],"explain":"依据：《建筑地基检测技术规范》JGJ 340 - 2015第 4.1.3","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"标准贯入试验适用于下列哪种地基的检测（ ）。","options":[{"key":"A","text":"仅适用于天然砂土、粉土地基"},{"key":"B","text":"适用于砂土、粉土、黏性土天然地基及其处理后的地基"},{"key":"C","text":"仅适用于人工处理后的黏性土地基"},{"key":"D","text":"适用于各类岩石地基"}],"answer":["B"],"explain":"依据：《建筑地基检测技术规范》JGJ 340 - 2015第 7.1.1","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"预拌砂浆施工的环境温度控制要求是（ ）。","options":[{"key":"A","text":"允许在-5℃～40℃范围内施工，无需特殊措施"},{"key":"B","text":"宜为5℃～35℃，超出范围需采取质量保证措施"},{"key":"C","text":"冬季施工时最低温度不得低于10℃"},{"key":"D","text":"高温施工时无需浇水养护"}],"answer":["B"],"explain":"依据：《预拌砂浆应用技术规程》JGJ/T 223-2010第3.0.4","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"根据《预拌砂浆应用技术规程》地面砂浆施工与质量验收规范，以下关于检验批划分和检查数量的描述中错误的是（ ）。","options":[{"key":"A","text":"高层建筑的标准层可按每3层作为一个检验批，不足3层时按一个检验批计算"},{"key":"B","text":"有防水要求的建筑地面，每检验批抽查数量不应少于4间，不足4间时应全数检查"},{"key":"C","text":"走廊（过道）的检查以10延长米为1间，工业厂房（单跨）以两个轴线为1间计算"},{"key":"D","text":"砂浆层空鼓面积不超过400mm²且每自然间不多于3处时，可不计"}],"answer":["D"],"explain":"依据：《预拌砂浆应用技术规程》JGJ/T 223-2010第7.4.1","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"钻芯时用于冷却钻头和排除混凝土碎屑的冷却水的流量宜为（ ）。","options":[{"key":"A","text":"3L/min～5L/min"},{"key":"B","text":"1L/min～5L/min"},{"key":"C","text":"2L/min～5L/min"},{"key":"D","text":"3L/min～8L/min"}],"answer":["A"],"explain":"依据：《钻芯法检测混凝土强度技术规程》JGJ/T 384-2016第4.0.6","chapter":"线路基础","level":"进阶题"},{"type":"radio","title":"钻芯法确定构件混凝土抗压强度代表值时，芯样试件的数量宜为3个，应取芯样试件抗压强度值的（ ）作为构件混凝土抗压强度代表值。","options":[{"key":"A","text":"最大值"},{"key":"B","text":"最小值"},{"key":"C","text":"算术平均值"},{"key":"D","text":"中间值"}],"answer":["C"],"explain":"依据：《钻芯法检测混凝土强度技术规程》JGJ/T 384-2016第6.3.5","chapter":"线路基础","level":"基础题"},{"type":"radio","title":"对桩身垂直度进行检查。下列哪项不符合规定（ ）。","options":[{"key":"A","text":"应检查第一节桩定位时的垂直度；当垂直度偏差不大于0.5%时、方可进行施工"},{"key":"B","text":"在施工过程中，应及时抽检桩身垂直度"},{"key":"C","text":"送桩前，应对桩身垂直度进行检查"},{"key":"D","text":"管桩基础承台施工前，应对工程桩桩身垂直度进行检查，垂直度偏差应为±5%"}],"answer":["D"],"explain":"依据：《预应力混凝土管桩技术标准》JGJ
