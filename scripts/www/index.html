正确的是（ ）。","options":[{"key":"A","text":"机具的材料选用、外形设计和使用方法均应有利于对导线、地线及OPGW的保护"},{"key":"B","text":"应正确悬挂放线滑车以改善导线、地线及OPGW在滑车中的通过性"},{"key":"C","text":"应选择使导线、地线及OPGW处于架空状态的放线张力"},{"key":"D","text":"放线张力宜较大"}],"answer":["A","B","C"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》3.0.6","chapter":"线路架线","level":"基础题"},{"type":"check","title":"张力放线机具的配置和使用，应符合规定，正确的是（ ）。","options":[{"key":"A","text":"张力放线机具应配套使用，成套放线机具的各组成部分应互相匹配"},{"key":"B","text":"配套放线机具应与放线方式相适应"},{"key":"C","text":"应按所选放线方式，选择性能符合要求的放线机械，并应根据现有机具，经计算分析确定放线方式及配套机具"},{"key":"D","text":"同一工程的不同施工段，不可采用不同放线方式"}],"answer":["A","B","C"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》4.1.2","chapter":"线路架线","level":"基础题"},{"type":"check","title":"经验算放线滑车与横担下平面相碰时，宜采取的措施，应符合规定，正确的是（ ）。","options":[{"key":"A","text":"适当加长挂具长度"},{"key":"B","text":"利用压线滑车压线"},{"key":"C","text":"适当增大放线张力"},{"key":"D","text":"增设临时挂架或其他方法悬挂滑车"}],"answer":["A","B","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》4.3.9","chapter":"线路架线","level":"基础题"},{"type":"check","title":"牵引场、张力场的选择，应符合（ ）规定。","options":[{"key":"A","text":"牵引机、张力机能直接运达，或道路桥梁稍加修整加固后即可运达"},{"key":"B","text":"场地地型及面积能满足设备、导线布置及施工操作要求"},{"key":"C","text":"相邻直线塔允许过轮临锚，锚线对地角度符合设计要求，且满足锚线及压接导线作业要求"},{"key":"D","text":"耐张塔、上扬杆塔附近"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》5.1.2","chapter":"线路架线","level":"基础题"},{"type":"check","title":"牵引场、张力场的选择，不宜选作牵引场、张力场的情况是（ ）。（","options":[{"key":"A","text":"需以直线换位塔或直线转角塔作过轮临锚塔"},{"key":"B","text":"档内有重要交叉跨越或交叉跨越次数较多"},{"key":"C","text":"档内允许导线、地线接头"},{"key":"D","text":"相邻杆塔不允许临锚"}],"answer":["A","B","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》5.1.2","chapter":"线路架线","level":"基础题"},{"type":"check","title":"受地型限制，牵引场布置困难时，可通过单个或多个滑车转向布置。牵引场转向布置符合规定的是（ ）。","options":[{"key":"A","text":"每一个转向滑车承受的载荷不应超过滑车的允许承载力"},{"key":"B","text":"各转向滑车转向角度应相等，单个转向滑车包络角不宜超过60°"},{"key":"C","text":"靠近邻塔的第一个转向滑车应接近线路中心线，靠近牵引机的第一个转向滑车应使牵引机受力方向正确"},{"key":"D","text":"应使用大转槽专用高速滑车作为转向滑车，每个转向滑车应可靠锚固"}],"answer":["A","C","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》5.1.4","chapter":"线路架线","level":"基础题"},{"type":"check","title":"张力放线应作布线设计，布线应符合下列规定，正确的是（ ）。","options":[{"key":"A","text":"可有效控制接续管位置"},{"key":"B","text":"接续管数量应减至最少"},{"key":"C","text":"紧线后余线应最少"},{"key":"D","text":"放线中产生的不能继续使用的短线头应最少"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》5.3.2","chapter":"线路架线","level":"基础题"},{"type":"check","title":"张力放线牵放过程中，导线与地面及被跨越物的距离，规定正确的是（ ）。","options":[{"key":"A","text":"一般区段，导线距离地面不应小于3m"},{"key":"B","text":"通过行人及少量车辆的道路，设岗监护而不搭设跨越架施工时，导线距离路面不应小于5m"},{"key":"C","text":"风沙较大区段，导线距离地面不应小于8m"},{"key":"D","text":"平衡锤距离跨越架架顶网杆不应小于2m"}],"answer":["A","B"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》5.3.6","chapter":"线路架线","level":"进阶题"},{"type":"check","title":"张力放线开始牵放前的重点检查，应包括的内容是（ ）。","options":[{"key":"A","text":"跨越架的位置和牢固程度是否符合要求"},{"key":"B","text":"场地布置和施工机械锚固情况是否符合要求"},{"key":"C","text":"临时接地是否符合要求"},{"key":"D","text":"岗位工作人员是否全部到岗，通信联络是否畅通"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》5.4.4","chapter":"线路架线","level":"基础题"},{"type":"check","title":"牵引机、张力机操作，规定正确的是（ ）。","options":[{"key":"A","text":"牵引机、张力机等应由持证专业人员专人操作"},{"key":"B","text":"牵引机开始牵引前应启动张力机并打开刹车，停止牵引时应先停张力机，后停牵引机"},{"key":"C","text":"尾线、尾绳应保持有足够的尾部张力"},{"key":"D","text":"张力应缓慢升高，避免牵引绳、导线产生大幅度波动"}],"answer":["A","C","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》5.4.7","chapter":"线路架线","level":"基础题"},{"type":"check","title":"紧线前应完成下列工作，正确的是（ ）。","options":[{"key":"A","text":"检查各子导线在放线滑车中的位置，消除跳槽现象"},{"key":"B","text":"检查各子导线不应相互缠绕，当有相互缠绕情况时，应先收紧导线再将各子导线分离后再收紧导线"},{"key":"C","text":"检查接续管位置应合适，当有不合适时，应处理后再紧线"},{"key":"D","text":"现场核对弧垂观测档，应设立观测标志"}],"answer":["A","C","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》6.1.2","chapter":"线路架线","level":"基础题"},{"type":"check","title":"子导线收紧应符合下列规定，正确的是（ ）。","options":[{"key":"A","text":"宜先收紧线档中间搭在其他子导线之上的子导线"},{"key":"B","text":"应对称收紧子导线"},{"key":"C","text":"宜先收紧弧垂较大的子导线"},{"key":"D","text":"同相（极）子导线应同时收紧，且收紧速度不宜过快"}],"answer":["A","B","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》6.1.3","chapter":"线路架线","level":"基础题"},{"type":"check","title":"直线松锚升空操作，应符合规定，正确的是（ ）。","options":[{"key":"A","text":"松锚前应先压接相邻两紧线段的接续管"},{"key":"B","text":"地面的放线临锚附近应安装卡线器，并应接入牵引滑车或其他牵引工具作为松锚工具；还应收紧松锚工具至放线临锚钢丝绳不再受力时，方可拆除待紧线段及已紧线段的放线临锚"},{"key":"C","text":"放松松锚工具后，应用压线装置控制导地线高度，待松锚工具完全不受力后方可将其拆除"},{"key":"D","text":"同一相（极）的各子导线应对称松锚，并应使放线滑车保持平衡"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》6.1.9","chapter":"线路架线","level":"基础题"},{"type":"check","title":"弧垂调整应符合（ ）规定。","options":[{"key":"A","text":"应以各观测档和紧线场温度的最大值作为观测温度"},{"key":"B","text":"收紧导线、地线后，应先调整距紧线场最近端观测档的弧垂，再放松导线，后调整距紧线场次近端观测档的弧垂；依此类推，直至全部观测档的弧垂调整合格"},{"key":"C","text":"同一观测档同相（极）子导线应同为收紧调整或同为放松调整"},{"key":"D","text":"应使用经纬仪统一操平同相（极）子导线，并应利用测站多检查一些非观测档子导线的弧垂情况"}],"answer":["C","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》6.2.6","chapter":"线路架线","level":"进阶题"},{"type":"check","title":"以耐张塔紧线操作导线挂线作业程序，应符合（ ）规定。","options":[{"key":"A","text":"将耐张串吊装到横担挂孔上"},{"key":"B","text":"在耐张塔两侧同时对称进行空中锚线，在耐张串的远线端和临锚卡线器间布置滑车组"},{"key":"C","text":"收紧滑车组，使锚线工具受力，锚线工具间导线逐渐松弛，进行紧线操作"},{"key":"D","text":"确认导线上所画印记，断线时计入耐张线夹压接所需扣除的长度"}],"answer":["A","C","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》6.4.1","chapter":"线路架线","level":"基础题"},{"type":"check","title":"非紧线操作的耐张串导线挂线作业，在耐张塔两侧应同时对称（平衡）进行空中锚线，应平衡收紧两侧导线，使两侧锚线卡线器间的导线松弛，操作方法正确的是（ ）。","options":[{"key":"A","text":"在耐张线夹外适当位置安装锚线卡线器"},{"key":"B","text":"以横担挂线板上的施工孔为锚线孔，在卡线器与锚线孔间安装卡线器、锚线钢丝绳套、手扳葫芦等锚线工具"},{"key":"C","text":"两侧同时收紧手扳葫芦，使锚线工具受力，导线逐渐松弛。收紧时应保持操作塔前后对称平衡受力"},{"key":"D","text":"断线前，在卡线器后侧0.5～1.0m处，用绳索将导线捆绑在锚线绳上，导线松线时不得出现硬弯，断线后，用绳索将导线松下"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》6.4.2","chapter":"线路架线","level":"基础题"},{"type":"check","title":"测定间隔棒安装位置的方法有（ ）。（","options":[{"key":"A","text":"手持激光测距仪定位"},{"key":"B","text":"计程器定位"},{"key":"C","text":"测绳高空测量定位"},{"key":"D","text":"地面测量定位"}],"answer":["A","B","C","D"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》7.2.2","chapter":"线路架线","level":"基础题"},{"type":"check","title":"放线滑车的使用应符合（ ）规定。","options":[{"key":"A","text":"轮槽尺寸及所用材料应与导线或架空地线相适应"},{"key":"B","text":"导线放线滑车应符合现行行业标准DL/T 371《架空输电线路放线滑车》的规定。展放镀锌钢绞线架空地线时，其滑车轮槽底部的轮径与所放钢绞线直径之比不宜小于10"},{"key":"C","text":"对严重上扬、下压或垂直档距很大处的放线滑车应进行验算，必要时应采用特制的结构"},{"key":"D","text":"放线滑车使用前应进行检查并确保转动灵活"}],"answer":["A","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"进阶题"},{"type":"check","title":"张力放线应防止导线和良导体地线损伤，损伤处理应符合规定要求进行处理，如（ ）可不修补，可用0号以下的细砂纸磨光表面棱刺。","options":[{"key":"A","text":"外层导线线股有轻微擦伤"},{"key":"B","text":"擦伤深度不超过单股直径的1/2或截面积损伤不超过导电部分截面积的1%"},{"key":"C","text":"擦伤深度不超过单股直径的1/2或截面积损伤不超过导电部分截面积的2%"},{"key":"D","text":"擦伤深度不超过单股直径的1/4或截面积损伤不超过导电部分截面积的2%"}],"answer":["A","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"进阶题"},{"type":"check","title":"张力放线应防止导线和良导体地线损伤，损伤处理应符合规定要求进行处理，如有（ ）情况之一应定为严重损伤，应将损伤部分全部锯掉，并应用接续管或带金刚砂的预绞丝经导线重新连接。","options":[{"key":"A","text":"强度损失超过设计计算拉断力的8.5%"},{"key":"B","text":"截面积损伤超过导电部分截面积的12.5%"},{"key":"C","text":"钢芯有断股的"},{"key":"D","text":"损伤的范围超过一个预绞丝允许补修的范围"}],"answer":["A","B","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"check","title":"非张力放线导线在同一处损伤同时符合（ ）情况时可不做修补，只将损伤处的棱角与毛刺用0号砂纸磨光。","options":[{"key":"A","text":"铝、铝合金单股断股"},{"key":"B","text":"铝、铝合金单股损伤深度小于股直径1/2"},{"key":"C","text":"钢芯铝绞线及钢芯铝合金绞线损伤截面积为导电部分截面积5%及以下，且强度损失小于4%"},{"key":"D","text":"单金属绞线损伤截面积为4%及以下"}],"answer":["B","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"check","title":"非张力放线导线在同一处损伤（ ）可以用补修管或带金刚砂的预绞丝补修条补修。","options":[{"key":"A","text":"导线在同一处的损伤程度已超过可不做修补的范围"},{"key":"B","text":"钢芯铝绞线与钢芯铝合金绞线因损伤导致强度损失不超过总拉断力5%且截面积损伤不超过导电部分截面积的7%时"},{"key":"C","text":"钢芯铝绞线与钢芯铝合金绞线因损伤导致强度损失超过总拉断力5%，但不足17%且截面积损伤不超过导电部分截面积的25%时"},{"key":"D","text":"铝绞线与铝合金绞线在同一处的损伤强度已超过总拉断力的5%，但不足17%"}],"answer":["C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"check","title":"非张力放线采用补修管补修时应符合（ ）规定。","options":[{"key":"A","text":"应将损伤处的线股先恢复到原绞制状态"},{"key":"B","text":"线股处理应平整"},{"key":"C","text":"补修管的中心应位于损伤最严重处，其两端应分别超出损伤边缘不小于20mm"},{"key":"D","text":"补修管可以采用钳压或液压"}],"answer":["A","B","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"check","title":"当采用张力放线时，导线在同一处损伤需要补修时，采用补修预绞丝处理时应符合（ ）规定。","options":[{"key":"A","text":"将受伤处线股处理平整"},{"key":"B","text":"补修预绞丝长度不得小于2个节距"},{"key":"C","text":"补修预绞丝长度不得小于3个节距"},{"key":"D","text":"补修预绞丝应与导线接触紧密，其中心应位于损伤最严重处，井应将损伤部位全部覆盖"}],"answer":["A","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"进阶题"},{"type":"check","title":"非张力放线导线在同一处的损伤出现（ ）情况之一时，应将损伤部分全部割去，重新以接续管连接。","options":[{"key":"A","text":"导线的损失强度或损伤的截面积超过补修管补修的规定"},{"key":"B","text":"连续损伤的截面积和损失强度均没超过补修管补修的规定，但其损伤长度已超过补修管能补修的范围"},{"key":"C","text":"复合材料的导线钢芯有断股"},{"key":"D","text":"金钩、破股已使钢芯或内层铝股形成变形"}],"answer":["A","B","C"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"进阶题"},{"type":"check","title":"弧垂观测档的选择应符合（ ）规定。","options":[{"key":"A","text":"紧线段在5档及以下时靠近中间选择一档"},{"key":"B","text":"紧线段在6～12档时靠近两端各选择一档"},{"key":"C","text":"紧线段在12档以上时靠近两端及中间可选3～4档"},{"key":"D","text":"观测档宜选档距较小和悬挂点高差较小及接近代表档距的线档"}],"answer":["A","B","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"check","title":"挂线时对于孤立档、较小耐张段及大跨越的过牵引长度应符合设计要求，设计无要求时，应符合下列规定，下列说法正确的是（ ）。","options":[{"key":"A","text":"耐张段长度大于300m时，过牵引长度不宜超过200mm"},{"key":"B","text":"耐张段长度为200～300m时，过牵引长度不宜超过耐张段长度的0.3‰"},{"key":"C","text":"除变电站进出口档外，耐张段长度为200m以内时，过牵引长度应根据导线的安全系数不小于2规定进行控制"},{"key":"D","text":"大跨越档的过牵引值应由设计验算确定"}],"answer":["A","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"check","title":"关于悬垂线夹的安装，说法正确的是（ ）。","options":[{"key":"A","text":"绝缘子串应垂直地平面"},{"key":"B","text":"顺线路方向与垂直位置的偏移角不应超过5°"},{"key":"C","text":"最大偏移值不应超过150mm"},{"key":"D","text":"连续上、下山坡处杆塔上的悬垂线夹的安装位置应符合设计规定"}],"answer":["A","B","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"check","title":"绝缘子串、导线及架空地线上的各种金具上的螺栓、穿钉及弹簧销子，除有固定的穿向外，其余穿向应统一，并应符合（ ）规定。","options":[{"key":"A","text":"单悬垂串上的弹簧销子应由小号侧向大号侧穿入。使用W形弹簧销子时，绝缘子大口应一律朝线路小号侧。使用R形弹簧销子时，大口应一律朝线路大号侧"},{"key":"B","text":"螺栓及穿钉凡能顺线路方向穿入者，应一律由小号侧向大号侧穿入，特殊情况两边线可由内向外，中线可由左向右穿入"},{"key":"C","text":"耐张串上的弹簧销子、螺栓及穿钉均应一律由下向上穿；当使用W形弹簧销子时，绝缘子大口应一律向上；当使用R形弹簧销子时，绝缘子大口应一律向下，特殊情况两边线可由内向外，中线可由左向右穿入"},{"key":"D","text":"分裂导线上的穿钉、螺栓应一律由线束外侧向内穿"}],"answer":["A","B","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"check","title":"光缆盘运到现场后，应进行（ ）检查和验收。","options":[{"key":"A","text":"光缆的品种、型号、规格"},{"key":"B","text":"光缆盘号与长度"},{"key":"C","text":"光缆端头密封的防潮封口有无松脱现象"},{"key":"D","text":"光纤衰减值"}],"answer":["A","B","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"check","title":"光纤的熔接应符合要求，正确的是（ ）。","options":[{"key":"A","text":"熔接应由专业人员操作"},{"key":"B","text":"剥离光纤的外层套管、骨架时不得损伤光纤"},{"key":"C","text":"应防止光纤接线盒内有潮气或水分进入，安装接线盒时螺栓应紧固，橡皮封条应安装到位"},{"key":"D","text":"光纤熔接后应进行接头光纤衰耗值测试，不合格者应重接"}],"answer":["A","B","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"check","title":"关于光纤复合架空地线OPGW附件安装说法正确的是（ ）。","options":[{"key":"A","text":"光纤复合架空地线宜在紧线完后72h内完成附件安装"},{"key":"B","text":"附件安装后，当不能立即接头时，光纤端头应做密封处理"},{"key":"C","text":"提线时与光纤复合架空地线接触的工具应包橡胶或缠铝包带，不得以硬质工具接触光纤复合架空地线表面"},{"key":"D","text":"光纤复合架空地线的曲率半径不得小于设计和制造厂的规定"}],"answer":["B","C","D"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"杆塔的拉线应在监控下对称调整并收紧，应防止过紧或受力不均而使杆塔产生倾斜或局部弯曲。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"钢管转角杆架线后挠曲度应符合设计规定，超过设计规定时应会同设计单位处理。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"铁塔应检查合格后方可浇筑混凝土保护帽，其尺寸应符合设计规定，并应与塔脚结合严密，不得有裂缝。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"钢管塔法兰盘连接螺栓如不做重复对角均匀紧固，会发生螺栓紧固达到了要求，而法兰盘却仍有缝隙的情况，容易出现节点弯曲等现象影响铁塔整体质量。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"对于安装后不易进行复紧的长构件，应在地面完成螺栓紧固，且应验收完毕后方可吊装。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"塔材运抵施工现场时，若镀锌附着力差、锌皮严重脱离，施工时可采用喷涂银粉简单处理。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“可采用”应为“不得采用”。","chapter":"线路组塔","level":"进阶题"},{"type":"judge","title":"螺栓与螺母的螺纹有滑牙或螺母的棱角磨损以致扳手打滑的，螺母应更换。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“螺母应更换”应为“螺栓应更换”。","chapter":"线路组塔","level":"进阶题"},{"type":"judge","title":"杆塔部件组装有困难需扩孔时，可以用气割扩孔或烧孔。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“可以用气割扩孔或烧孔”应为“不得用气割扩孔或烧孔”。","chapter":"线路组塔","level":"进阶题"},{"type":"judge","title":"螺栓的穿入方向应符合对立体结构，斜向者宜由斜上向斜下穿。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“斜上向斜下”应为“斜下向斜上”。","chapter":"线路组塔","level":"进阶题"},{"type":"judge","title":"混凝土电杆纵向裂缝不得大于0.05mm。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“混凝土电杆纵向裂缝”应为“普通混凝土电杆横向裂缝”。","chapter":"线路组塔","level":"进阶题"},{"type":"judge","title":"普通混凝土电杆不得有横向裂缝。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“横向裂缝”应为“纵向裂缝”。","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"钢管杆的螺栓紧固率应满足组塔后97%。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“组塔后97%”应为“组塔后95%、架线后97%”。","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"钢管杆的螺栓紧固率应满足架线后95%。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“架线后95%”应为“组塔后95%、架线后97%”。","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"钢管杆的杆身弯曲度不得大于0.2‰。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"进阶题"},{"type":"judge","title":"杆塔的部件规格和数量应符合运行单位要求。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“运行单位”应为“设计”。","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"角钢塔相邻主材节点间弯曲程度不得大于1/750。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"自立转角塔、终端塔的结构倾斜应符合业主单位要求。（ ）（","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“业主单位”应为“设计”。","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"杆塔组立后，塔脚板与基础面空隙可用木片垫实。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"规定应使用铁片垫实","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"整体组立铁塔时，若采取防止基础承受水平推力措施，混凝土强度达到70%即可。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：QGDW 10115—2022 110kV-1000kV 架空输电线路施工及验收规范 9.2.3","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"脚钉安装时应保证脚蹬侧外露螺栓长度不超过2个丝扣。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"规定脚蹬侧不得露丝","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"悬垂杆塔结构倾斜的允许偏差包含套接式钢管杆。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"表10注明确说明不含套接式钢管杆","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"大跨越工程的锚塔应在紧线前浇筑混凝土保护帽。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"规定锚塔应在紧线后浇筑保护帽","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"钢管电杆运输中允许出现轻微凹坑变形","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"规范明确禁止明显变形","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"同组拉线线夹尾线方向可以随意布置","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"要求尾线方向统一","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"架线后需要复查调整全部拉线","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：QGDW 10115—2022 110kV-1000kV 架空输电线路施工及验收规范 9.5.4","chapter":"线路组塔","level":"基础题"},{"type":"judge","title":"拉线棒与拉线允许存在5°夹角","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"要求必须呈直线","chapter":"线路组塔","level":"进阶题"},{"type":"judge","title":"架线后应测量导线对被跨越物的净空距离，计入导线蠕变伸长换算到最大弧垂时应符合设计规定。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"当导线或架空地线采用液压连接时，操作人员应经过培训并考试合格。连接完成前，可直接在压接管上打上操作人员的钢印。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“连接完成前，可直接在压接管上”应为“连接完成并自检合格后，应在压接管上”。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"架空地线采用良导体时，损伤处理规定与导线不同。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“不同”应为“相同”。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"架空地线采用镀锌钢绞线时，绞线股数为7股，断股2股应以补修管补修。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“断股2股”应为“断股1股”。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"当采用非张力放线时，导线损伤补修处理，采用缠绕处理时，缠绕材料应为铁单丝，缠绕应紧密，回头应绞紧，处理平整，中心应位于损伤最严重处，并应将受伤部分全部覆盖，长度不得小于100mm。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“铁单丝”应为“铝单丝”。","chapter":"线路架线","level":"进阶题"},{"type":"judge","title":"由于条件限制不适合采用张力放线的线路工程及部分改建、扩建工程可采用人力或机械牵引放线。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"张力放线过程中应有防止产生导线松股、断股、鼓包、扭曲等现象的措施。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"张力放线中，经过重要的跨越物时，宜适当缩短张力放线区段长度。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"张力放线时，当导线损伤定为严重损伤，应将损伤部分使用补修管修补。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“应将损伤部分使用补修管修补”应为“应将损伤部分全部锯掉，并用接续管或带金刚砂的预绞丝将导线重新连接”。","chapter":"线路架线","level":"进阶题"},{"type":"judge","title":"展放镀锌钢绞线架空地线时，滑车轮槽底部的轮径与所放钢绞线直径之比不宜小于15。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL T 5867-2023 110kV及以上架空输电线路施工及验收规范","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"导线或架空地线在跨越档内接头处应符合运行要求。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“运行要求”应为“设计规定”。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"高空临锚时，相邻子导线之间临锚索具应错开布置，且与索具靠近的导线应套胶管。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》8.0.5","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"导地线在张力机出口处、临锚处、压接操作点处、升空点处等落地操作场应有足够的软质物隔离，导地线不得与地面接触。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》8.0.3","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"跳线安装后，应测量跳线对杆塔的最大距离，距离应符合规范要求，任何气象条件下，跳线均不得与金具相摩擦、碰撞。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“最大距离”应为“最小距离”。","chapter":"线路架线","level":"进阶题"},{"type":"judge","title":"应使用未经牵引的原状导线制作软跳线，并应使原弯曲方向与安装后的弯曲方向相一致。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》7.3.1","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"同相（极）各子导线锚线张力宜稍有差异，并应使子导线空间位置错开。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》5.4.15","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"导线在张力机上的盘绕方向宜与导线外层线股捻回方向相同；钢芯铝绞线外层采用右捻时，盘绕时宜为右进左出。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“右进左出”应为“左进右出”。","chapter":"线路架线","level":"进阶题"},{"type":"judge","title":"架线区段中有上扬的杆塔时，宜选上扬杆塔作架线段起止塔。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》5.1.1","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"转角塔放线滑车受力后不得与横担下平面相碰。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5343—2018《110kV～750kV架空输电线路张力架线施工工艺导则》4.3.8","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"利用座地四摇臂抱杆组立铁塔，在吊装过程中不得进行回转作业，不同方位吊装应重新布置摇臂。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》9.1.5","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"座地双摇臂抱杆腰环间距应满足杆身稳定性要求，且腰环应设置在塔身主材上。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“塔身主材上”应为“塔身节点处”。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"内悬浮双摇臂抱杆分解组塔时，宜采用双侧平衡的吊装方式，当采用不平衡吊装方式时，不平衡力矩不得超过其允许设计值。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》7.1.4","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"倒落式抱杆整体组塔时，当铁塔立至85°时，应停止牵引，利用牵引索具自重所产生的垂直分力，使铁塔立至垂直位置。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“85°时”应为“80°时”。","chapter":"线路架线","level":"进阶题"},{"type":"judge","title":"倒落式抱杆整体组塔牵引系统由总牵引钢丝绳和滑车组及导向滑车组成。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》6.2.6","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"倒落式抱杆整体组塔适用于平地或丘陵地区的110～750kV输电线路拉线塔或110～330kV自立式铁塔。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》6.1.1","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"铁塔地线横担吊装完成后，可对其采取补强措施，并可作为吊装的支撑，吊装下层横担。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》4.4.9","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"吊装时，当一侧曲臂吊装完毕后，应随即在顺线路方向设置临时落地拉线，临时落地拉线绑扎点宜设置在上曲臂顶点节点处。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“顺线路方向”应为“横线路方向”","chapter":"线路架线","level":"进阶题"},{"type":"judge","title":"内悬浮抱杆拆除时，应采取措施防止抱杆旋转、摆动。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》4.4.10","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"吊装时，当吊件离地300～500mm时，应暂停起吊，并应由现场指挥检查各部位受力情况。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“300～500mm”应为“100～200mm”。","chapter":"线路架线","level":"进阶题"},{"type":"judge","title":"流动式起重机适用于地形、运输条件较好的塔位，可采用分解组立和整体组立的方式。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5342—2018《110kV～750kV架空输电线路铁塔组立施工工艺导则》11.1.2","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"座地平臂抱杆提升后，应用经纬仪在顺线路或横线路方向监测抱杆的竖直状态。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“顺线路或横线路方向”应为“顺线路及横线路两个方向”。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"铝管压接后应在管口处涂防锈漆。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“防锈漆”应为“红色标志漆”。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"切割铝单丝时宜采用专用剥线器，在切割内层铝股时，在割至铝股直径3/4处时，应小心使用剥线器，以免伤及钢芯。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"“应小心使用剥线器”应为“应停用剥线器”。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"导地线压接部分不应有明显松股，且端部应绑扎紧固。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5285—2018《输变电工程架空导线800mm2以下及地线液压压接工艺规程》5.1.2","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"压接施工操作人员应经过培训并持有压接操作许可证，作业过程中应有专业人员见证并及时记录原始数据。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5285—2018《输变电工程架空导线800mm2以下及地线液压压接工艺规程》4.7.1","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"压接模具上、下模应为出厂时配套模具，禁止不同组上、下模交叉使用，如压接模具检查不合格，应停止使用。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5285—2018《输变电工程架空导线800mm2以下及地线液压压接工艺规程》4.4.3","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"导地线的压接部分应清洁，并均匀涂刷电力脂后再压接。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5285—2018《输变电工程架空导线800mm2以下及地线液压压接工艺规程》4.1.4","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"铝压接管的坡口长度应满足图纸要求，且不应小于压接管外径的1.5倍。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"铝压接管的坡口长度应满足图纸要求，且不应小于压接管外径的1.2倍。","chapter":"线路架线","level":"进阶题"},{"type":"judge","title":"正压的压接顺序，接续管是指从接续管的中间标记向两侧逐模施压的压接顺序；耐张线夹是从钢锚拉环侧跨过不压区向管口方向逐模施压的压接顺序。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：DL/T 5285—2018《输变电工程架空导线（800mm2以下）及地线液压压接工艺规程》3.3","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"凹槽处压接完成后，应采用钢锚比对等方法校核钢锚的凹槽部位是否全部被铝管压住，必要时报监理单位。（ ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"凹槽处压接完成后，应采用钢锚比对等方法校核钢锚的凹槽部位是否全部被铝管压住，必要时，应拍照存档。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"架空导线和地线的展放过程中，允许钢丝和外层铝股存在接头。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"导线及地线的钢丝和外层铝股不应有接头","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"张力场布置时，特殊情况下允许通过转向滑车转向布置。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：QGDW 10115—2022 110kV-1000kV 架空输电线路施工及验收规范 10.2.6","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"架线施工锚线时，同相（极）子导线间的张力应完全一致。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"锚固时同相子导线张力应稍有差异，使空间位置上下错开","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"张力放线经过复杂地形时，应延长放线区段长度以保证效率。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"复杂地形区段应适当缩短张力放线区段长度","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"架线施工中对被跨越物保持安全距离即可，无需考虑与地面的净空距离。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"除跨越物安全距离外，与地面净空距离不得小于5m","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"紧线段在5档及以下时，弧垂观测档应靠近中间选择一档。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：QGDW 10115—2022 110kV-1000kV 架空输电线路施工及验收规范 10.4.2(a)","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"耐张段长度为150m时，过牵引长度需按导线安全系数≥2控制（变电站进出口档除外）。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：QGDW 10115—2022 110kV-1000kV 架空输电线路施工及验收规范 10.4.4(c)","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"弧垂观测档的数量可根据现场条件减少。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"观测档数量可增加，但不得减少。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"复合绝缘子伞套表面允许存在轻微开裂。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"复合绝缘子伞套禁止开裂、脱落或破损。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"V型悬垂绝缘子串安装时需控制组串后的夹角和长度误差。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：QGDW 10115—2022 110kV-1000kV 架空输电线路施工及验收规范 10.5.3","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"OPGW盘可以平放运输。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"OPGW盘必须直立存放、装卸及运输，不得平放。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"光纤熔接可在雨天进行，只要做好防护措施。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"雨天、大风、沙尘或空气湿度过大时不应熔接。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"牵张过程中导引绳和OPGW必须挂接地滑车。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explain":"依据：QGDW 10115—2022 110kV-1000kV 架空输电线路施工及验收规范 10.6.11","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"OPGW附件安装前需接地，提线工具可直接接触线表面。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"提线工具应包橡胶或缠绕铝包带，不得直接以硬质工具接触表面。","chapter":"线路架线","level":"基础题"},{"type":"judge","title":"光纤复合架空地线的曲率半径可小于制造厂商规定值。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"explain":"施工全过程中，曲率半径不得小于设计和厂商规定。","chapter":"线路架线","level":"基础题"}];

/* ================= 存储 ================= */
const KEY_REC = 'zlmb.records.v1';
const KEY_FAV = 'zlmb.fav.v1';
const KEY_POS = 'zlmb.pos.v1';
const KEY_EXAM = 'zlmb.exam.v1';
const KEY_FLT = 'zlmb.filter.v1';

function readJSON(k, fallback){
  try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function writeJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let records = readJSON(KEY_REC, {});
let favs    = readJSON(KEY_FAV, []);
let posMap  = readJSON(KEY_POS, {seq:0});
let savedExam = readJSON(KEY_EXAM, null);
let filters = readJSON(KEY_FLT, {chapter:'全部', level:'全部'});

const Q = QUESTIONS.map((q, i) => ({
  id: i + 1,
  type: q.type,
  title: q.title,
  options: q.options || [],
  answer: q.answer || [],
  answerText: q.answerText || '',
  explain: q.explain || '',
  chapter: q.chapter || '',
  level: q.level || ''
}));

const state = { mode:'seq', list:[], idx:0, sel:[], revealed:false, exam:null };

const TYPE_NAME = { radio:'单选题', check:'多选题', judge:'判断题', text:'简答题' };
const TYPE_CLASS = { radio:'', check:'check', judge:'judge', text:'text' };
const CHAPTERS = ['全部','线路基础','线路架线','线路组塔'];
const LEVELS = ['全部','基础题','进阶题'];

const $ = s => document.querySelector(s);
const stage = $('#stage');

/* ================= 工具 ================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sameSet(a, b){
  if(!a || !b) return false;
  if(a.length !== b.length) return false;
  const s = new Set(b);
  return a.every(x => s.has(x));
}
function fmtPct(n, d){ return d ? Math.round(n / d * 100) : 0; }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

/* ================= 统计 ================= */
function stats(){
  const done = Object.keys(records).length;
  let ok = 0;
  for(const k in records){ if(records[k].ok) ok++; }
  return { done, ok, pct: fmtPct(ok, done) };
}
function wrongIds(){
  return Object.keys(records).filter(k => records[k].ok === false).map(Number);
}
function refreshChrome(){
  const st = stats();
  $('#topStats').innerHTML = '<b>' + st.pct + '%</b>正确率';
  $('#badgeWrong').textContent = wrongIds().length;
  $('#badgeFav').textContent = favs.length;
  document.querySelectorAll('#modes button').forEach(b => {
    b.classList.toggle('on', b.dataset.mode === state.mode);
  });
  document.querySelectorAll('#chapterRow .fchip').forEach(b => b.classList.toggle('on', b.dataset.v === filters.chapter));
  document.querySelectorAll('#levelRow .fchip').forEach(b => b.classList.toggle('on', b.dataset.v === filters.level));
}

/* ================= 筛选 ================= */
function filteredQ(){
  return Q.filter(q =>
    (filters.chapter === '全部' || q.chapter === filters.chapter) &&
    (filters.level === '全部' || q.level === filters.level)
  );
}

/* ================= 列表构建 ================= */
function startMode(mode, limit){
  state.mode = mode;
  state.exam = null;
  let base = filteredQ();

  if(mode === 'seq'){
    state.list = base.map(q => q.id);
  }else if(mode === 'random'){
    state.list = shuffle(base.map(q => q.id));
  }else if(mode === 'wrong'){
    const ids = wrongIds();
    state.list = base.filter(q => ids.includes(q.id)).map(q => q.id);
  }else if(mode === 'fav'){
    state.list = base.filter(q => favs.includes(q.id)).map(q => q.id);
  }
  state.idx = mode === 'seq' ? Math.min(Math.max(posMap.seq || 0, 0), Math.max(state.list.length - 1, 0)) : 0;
  syncFromRecord();
  refreshChrome();
  render();
}

function syncFromRecord(){
  const q = state.list.length ? Q[state.list[state.idx] - 1] : null;
  const rec = q ? records[q.id] : null;
  state.sel = rec && rec.sel ? rec.sel.slice() : [];
  state.revealed = !!rec;
}

function currentQuestion(){
  const id = state.list[state.idx];
  return id ? Q[id - 1] : null;
}

/* ================= 渲染：练习 ================= */
function render(){
  refreshChrome();
  if(state.mode === 'exam'){ renderExam(); return; }
  if(!state.list.length){ renderEmpty(); return; }
  const q = currentQuestion();
  if(!q){ renderEmpty(); return; }

  const rec = records[q.id];
  const revealed = state.revealed;
  const fav = favs.includes(q.id);
  const progress = state.idx + 1;
  const submitLabel = revealed && rec ? (rec.ok ? '已答对' : '已答错') : (q.type === 'text' ? '查看参考答案' : '提交答案');

  const head = `
    <div class="barRow">
      <div class="bar"><i style="width:${fmtPct(progress, state.list.length)}%"></i></div>
      <div class="barTxt">${progress} / ${state.list.length}</div>
    </div>
    <section class="qcard">
      <div class="qmeta">
        <span class="tag ${TYPE_CLASS[q.type]}">${TYPE_NAME[q.type]}</span>
        ${q.level ? `<span class="tag lv">${esc(q.level)}</span>` : ''}
        <span class="qno">第 ${q.id} 题 · ${esc(q.chapter)}</span>
        <button class="favBtn ${fav ? 'active' : ''}" id="favBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="${fav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg>
          <span>${fav ? '已收藏' : '收藏'}</span>
        </button>
      </div>
      <h2 class="qtitle">${nl2br(q.title)}</h2>`;

  let body = '';
  if(q.type === 'text'){
    body = `
      <div class="ansArea">
        <textarea id="txtAns" placeholder="可以先在这里默写答案，再对照参考答案自评（内容只在本页，不会保存）"></textarea>
      </div>
      <div class="acts">
        <button class="btn ghost" id="btnPrev">上一题</button>
        <button class="btn primary" id="btnSubmit" ${revealed && rec ? 'disabled' : ''}>${submitLabel}</button>
        <button class="btn ghost" id="btnNext">下一题</button>
      </div>
      <div class="fb ${revealed && rec ? ('show ' + (rec.ok ? 'ok' : 'bad')) : ''}" id="fb">
        ${revealed && rec ? textFB(q, rec) : ''}
      </div>
    </section>`;
  }else{
    body = `
      <div class="opts" id="opts">
        ${q.options.map(o => `
          <button class="opt ${state.sel.includes(o.key) ? 'sel' : ''}" data-key="${o.key}">
            <span class="key">${o.key}</span><span class="txt">${nl2br(o.text)}</span>
          </button>`).join('')}
      </div>
      <div class="acts">
        <button class="btn ghost" id="btnPrev">上一题</button>
        <button class="btn primary" id="btnSubmit" ${(state.sel.length && !revealed) ? '' : 'disabled'}>${submitLabel}</button>
        <button class="btn ghost" id="btnNext">下一题</button>
      </div>
      <div class="fb ${revealed && rec ? ('show ' + (rec.ok ? 'ok' : 'bad')) : ''}" id="fb">
        ${revealed && rec ? fbHTML(q, rec) : ''}
      </div>
    </section>`;
  }

  stage.innerHTML = head + body;

  bindQuiz(q);
  if(revealed && rec){
    if(q.type === 'text') bindTextReveal(q, rec, true);
    else markOptions(q, rec);
  }else if(q.type === 'text'){
    bindTextReveal(q, null, false);
  }else{
    bindSelection(q);
  }
}

function fbHTML(q, rec){
  return `
    <div class="h">${rec.ok ? '回答正确' : '回答错误'}</div>
    <div class="ansLine">正确答案：<b>${q.answer.join('')}</b>（${q.answer.map(k => optionText(q, k)).join('；')}）</div>
    ${q.explain ? `<div class="ex"><span>解析</span>${nl2br(q.explain)}</div>` : ''}
  `;
}
function textFB(q, rec){
  return `
    <div class="h">${rec.ok ? '已记作答对' : '已记作答错'}</div>
    <div class="ansLine"><b>参考答案</b></div>
    <div class="block">${esc(q.answerText)}</div>
    ${q.explain ? `<div class="ex"><span>解析</span>${nl2br(q.explain)}</div>` : ''}
  `;
}
function optionText(q, key){
  const o = q.options.find(x => x.key === key);
  return o ? o.text : '';
}
function markOptions(q, rec){
  document.querySelectorAll('#opts .opt').forEach(n => {
    const k = n.dataset.key;
    n.classList.remove('sel');
    n.disabled = true;
    if(q.answer.includes(k)) n.classList.add('right');
    else if(rec.sel.includes(k)) n.classList.add('wrong');
  });
}

/* ================= 交互 ================= */
function bindSelection(q){
  const multi = q.type === 'check';
  document.querySelectorAll('#opts .opt').forEach(n => {
    n.addEventListener('click', () => {
      const k = n.dataset.key;
      if(multi){
        state.sel = state.sel.includes(k) ? state.sel.filter(x => x !== k) : state.sel.concat(k);
      }else{
        state.sel = [k];
      }
      document.querySelectorAll('#opts .opt').forEach(x => x.classList.toggle('sel', state.sel.includes(x.dataset.key)));
      const sb = $('#btnSubmit');
      if(sb) sb.disabled = state.sel.length === 0;
    });
  });
}

function saveRecord(q, ok, sel){
  records[q.id] = { sel: sel || [], ok, ts: Date.now() };
  writeJSON(KEY_REC, records);
  if(state.mode === 'seq'){ posMap.seq = state.idx; writeJSON(KEY_POS, posMap); }
  state.revealed = true;
  refreshChrome();
  render();
  const fb = $('#fb');
  if(fb) fb.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function bindTextReveal(q, rec, already){
  const btn = $('#btnSubmit');
  if(!btn) return;
  btn.addEventListener('click', () => {
    if(state.revealed) return;
    // 先展示参考答案，再由用户自评
    const fb = $('#fb');
    fb.className = 'fb show neutral';
    fb.innerHTML = `
      <div class="h">参考答案</div>
      <div class="block">${esc(q.answerText)}</div>
      ${q.explain ? `<div class="ex"><span>解析</span>${nl2br(q.explain)}</div>` : ''}
      <div class="acts">
        <button class="btn ghost" id="selfRight">这题我答对了</button>
        <button class="btn ghost" id="selfWrong">这题算错题</button>
      </div>`;
    btn.disabled = true;
    btn.textContent = '已查看答案';
    fb.scrollIntoView({ behavior:'smooth', block:'nearest' });
    $('#selfRight').addEventListener('click', () => saveRecord(q, true, []));
    $('#selfWrong').addEventListener('click', () => saveRecord(q, false, []));
  });
}

function bindQuiz(q){
  const goTo = (i) => {
    state.idx = i;
    if(state.mode === 'seq'){ posMap.seq = i; writeJSON(KEY_POS, posMap); }
    syncFromRecord();
    render();
  };

  const favBtn = $('#favBtn');
  if(favBtn) favBtn.addEventListener('click', () => {
    if(favs.includes(q.id)) favs = favs.filter(x => x !== q.id);
    else favs = favs.concat(q.id);
    writeJSON(KEY_FAV, favs);
    refreshChrome();
    render();
    toast(favs.includes(q.id) ? '已加入收藏' : '已取消收藏');
  });

  const prev = $('#btnPrev');
  const next = $('#btnNext');
  const submit = $('#btnSubmit');
  if(prev) prev.addEventListener('click', () => { if(state.idx > 0) goTo(state.idx - 1); else toast('已经是第一题了'); });
  if(next) next.addEventListener('click', () => {
    if(state.idx < state.list.length - 1) goTo(state.idx + 1);
    else toast('已经是最后一题了');
  });
  if(submit && q.type !== 'text'){
    submit.addEventListener('click', () => {
      if(!state.sel.length || state.revealed) return;
      saveRecord(q, sameSet(state.sel, q.answer), state.sel.slice());
    });
  }
}

/* ================= 模拟考试 ================= */
function startExam(count){
  const base = filteredQ().filter(q => q.type !== 'text');
  const ids = shuffle(base.map(q => q.id)).slice(0, count);
  if(!ids.length){ toast('当前筛选下没有可考的选择题'); return; }
  state.exam = { ids, answers:{}, submitted:false, started:Date.now() };
  state.mode = 'exam';
  state.idx = 0;
  savedExam = JSON.parse(JSON.stringify(state.exam));
  writeJSON(KEY_EXAM, savedExam);
  refreshChrome();
  render();
}

function renderExam(){
  if(!state.exam){ renderExamIntro(); return; }
  const ex = state.exam;

  if(ex.submitted){
    const total = ex.ids.length;
    let ok = 0;
    ex.ids.forEach(id => { if(ex.answers[id] && sameSet(ex.answers[id], Q[id - 1].answer)) ok++; });
    const pct = fmtPct(ok, total);
    stage.innerHTML = `
      <div class="panel">
        <h2>考试结果</h2>
        <p class="tip">共 ${total} 题，答对 ${ok} 题，答错 ${total - ok} 题</p>
        <div class="scoreBox"><span class="big">${pct}</span><span class="pct">分</span></div>
        <div class="scoreRow">
          <span class="chip g">正确 ${ok}</span>
          <span class="chip r">错误 ${total - ok}</span>
          <span class="chip">未作答 ${ex.ids.filter(id => !ex.answers[id]).length}</span>
        </div>
        <div class="acts">
          <button class="btn primary" id="btnReview">逐题查看解析</button>
          <button class="btn ghost" id="btnExamAgain">再考一次</button>
        </div>
      </div>`;
    $('#btnReview').addEventListener('click', () => { state.idx = 0; renderReviewList(); });
    $('#btnExamAgain').addEventListener('click', () => { state.exam = null; savedExam = null; writeJSON(KEY_EXAM, null); renderExamIntro(); });
    return;
  }

  const id = ex.ids[state.idx];
  const q = Q[id - 1];
  const cur = ex.answers[id] || [];
  stage.innerHTML = `
    <div class="barRow">
      <div class="bar"><i style="width:${fmtPct(state.idx + 1, ex.ids.length)}%"></i></div>
      <div class="barTxt">${state.idx + 1} / ${ex.ids.length} · 已答 ${Object.keys(ex.answers).length}</div>
    </div>
    <section class="qcard">
      <div class="qmeta">
        <span class="tag ${TYPE_CLASS[q.type]}">${TYPE_NAME[q.type]}</span>
        <span class="qno">第 ${state.idx + 1} 题 · ${esc(q.chapter)}</span>
      </div>
      <h2 class="qtitle">${nl2br(q.title)}</h2>
      <div class="opts" id="opts">
        ${q.options.map(o => `
          <button class="opt ${cur.includes(o.key) ? 'sel' : ''}" data-key="${o.key}">
            <span class="key">${o.key}</span><span class="txt">${nl2br(o.text)}</span>
          </button>`).join('')}
      </div>
      <div class="acts">
        <button class="btn ghost" id="btnPrev">上一题</button>
        <button class="btn primary" id="btnHandIn">交卷</button>
        <button class="btn ghost" id="btnNext">下一题</button>
      </div>
    </section>
    <div class="palette" id="palette">
      ${ex.ids.map((x, i) => `<button data-i="${i}" class="${ex.answers[x] ? 'done' : ''} ${i === state.idx ? 'cur' : ''}">${i + 1}</button>`).join('')}
    </div>`;

  bindExamActions(q);
}

function bindExamActions(q){
  const ex = state.exam;
  const multi = q.type === 'check';
  document.querySelectorAll('#opts .opt').forEach(n => {
    n.addEventListener('click', () => {
      const k = n.dataset.key;
      const id = ex.ids[state.idx];
      const cur = ex.answers[id] || [];
      if(multi){
        ex.answers[id] = cur.includes(k) ? cur.filter(x => x !== k) : cur.concat(k);
        if(!ex.answers[id].length) delete ex.answers[id];
      }else{
        ex.answers[id] = [k];
      }
      writeJSON(KEY_EXAM, ex);
      render();
    });
  });
  $('#btnPrev').addEventListener('click', () => { if(state.idx > 0){ state.idx--; render(); } });
  $('#btnNext').addEventListener('click', () => { if(state.idx < ex.ids.length - 1){ state.idx++; render(); } else toast('已是最后一题'); });
  $('#btnHandIn').addEventListener('click', () => {
    const left = ex.ids.filter(id => !ex.answers[id]).length;
    if(left && !confirm('还有 ' + left + ' 题未作答，确定交卷吗？')) return;
    ex.submitted = true;
    ex.ids.forEach(id => {
      if(!ex.answers[id]) return;
      records[id] = { sel: ex.answers[id].slice(), ok: sameSet(ex.answers[id], Q[id - 1].answer), ts: Date.now() };
    });
    writeJSON(KEY_REC, records);
    writeJSON(KEY_EXAM, ex);
    refreshChrome();
    render();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  $('#palette').querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => { state.idx = Number(b.dataset.i); render(); });
  });
}

function renderExamIntro(){
  if(savedExam && !savedExam.submitted){
    const ex = savedExam;
    stage.innerHTML = `
      <div class="panel">
        <h2>继续未完成的考试</h2>
        <p class="tip">上次考试共 ${ex.ids.length} 题，已答 ${Object.keys(ex.answers).length} 题</p>
        <div class="acts">
          <button class="btn primary" id="btnResume">继续作答</button>
          <button class="btn ghost" id="btnDrop">放弃并重新开始</button>
        </div>
      </div>`;
    $('#btnResume').addEventListener('click', () => { state.exam = savedExam; state.mode = 'exam'; render(); });
    $('#btnDrop').addEventListener('click', () => { savedExam = null; writeJSON(KEY_EXAM, null); renderExamIntro(); });
    return;
  }
  const pool = filteredQ().filter(q => q.type !== 'text');
  const sizes = [10, 20, 50, pool.length];
  stage.innerHTML = `
    <div class="panel">
      <h2>模拟考试</h2>
      <p class="tip">随机抽题，作答过程中不显示对错；交卷后统一判分，可逐题查看解析。当前筛选下可考 ${pool.length} 题（简答题不参与）。</p>
      <div class="field">
        <label>题量</label>
        <div class="seg" id="sizeSeg">
          ${sizes.map((s, i) => `<button data-n="${s}" class="${i === 1 ? 'on' : ''}">${s === pool.length ? '全部 ' + s + ' 题' : s + ' 题'}</button>`).join('')}
        </div>
      </div>
      <div class="acts">
        <button class="btn primary" id="btnStartExam">开始考试</button>
      </div>
    </div>`;
  let chosen = sizes[1];
  $('#sizeSeg').querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      chosen = Number(b.dataset.n);
      $('#sizeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    });
  });
  $('#btnStartExam').addEventListener('click', () => startExam(chosen));
}

function renderReviewList(){
  const ex = state.exam;
  const id = ex.ids[state.idx];
  const q = Q[id - 1];
  const rec = { sel: ex.answers[id] || [], ok: sameSet(ex.answers[id] || [], q.answer) };
  stage.innerHTML = `
    <div class="barRow">
      <div class="bar"><i style="width:${fmtPct(state.idx + 1, ex.ids.length)}%"></i></div>
      <div class="barTxt">${state.idx + 1} / ${ex.ids.length} · 回看解析</div>
    </div>
    <section class="qcard">
      <div class="qmeta">
        <span class="tag ${TYPE_CLASS[q.type]}">${TYPE_NAME[q.type]}</span>
        <span class="qno">第 ${state.idx + 1} 题 · ${esc(q.chapter)}</span>
      </div>
      <h2 class="qtitle">${nl2br(q.title)}</h2>
      <div class="opts">
        ${q.options.map(o => `<div class="opt ${q.answer.includes(o.key) ? 'right' : (rec.sel.includes(o.key) ? 'wrong' : '')}" disabled><span class="key">${o.key}</span><span class="txt">${nl2br(o.text)}</span></div>`).join('')}
      </div>
      <div class="fb show ${rec.ok ? 'ok' : 'bad'}">${fbHTML(q, rec)}</div>
      <div class="acts">
        <button class="btn ghost" id="btnRPrev">上一题</button>
        <button class="btn ghost" id="btnRBack">返回成绩</button>
        <button class="btn primary" id="btnRNext">下一题</button>
      </div>
    </section>
    <div class="palette" id="palette">
      ${ex.ids.map((x, i) => {
        const okk = ex.answers[x] && sameSet(ex.answers[x], Q[x - 1].answer);
        return `<button data-i="${i}" class="${i === state.idx ? 'cur' : (ex.answers[x] ? (okk ? 'done' : 'done bad') : '')}">${i + 1}</button>`;
      }).join('')}
    </div>`;

  $('#btnRPrev').addEventListener('click', () => { if(state.idx > 0){ state.idx--; renderReviewList(); } });
  $('#btnRNext').addEventListener('click', () => { if(state.idx < ex.ids.length - 1){ state.idx++; renderReviewList(); } else toast('已到最后一题'); });
  $('#btnRBack').addEventListener('click', () => { ex.submitted = true; render(); });
  $('#palette').querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => { state.idx = Number(b.dataset.i); renderReviewList(); });
  });
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ================= 空态 ================= */
function renderEmpty(){
  const mode = state.mode;
  const txt = mode === 'wrong'
    ? ['错题本是空的', '做错的题会自动收进这里，再来针对薄弱点刷一遍。']
    : mode === 'fav'
      ? ['还没有收藏题目', '题目右上角的星标可以把想反复看的题存下来。']
      : ['当前筛选下没有题目', '换一个章节或难度试试。'];
  stage.innerHTML = `
    <div class="empty">
      <h3>${txt[0]}</h3>
      <p>${txt[1]}</p>
      <div class="acts" style="max-width:320px;margin:16px auto 0">
        <button class="btn primary" id="btnGoSeq">去顺序练习</button>
      </div>
    </div>`;
  $('#btnGoSeq').addEventListener('click', () => startMode('seq'));
}

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg){
  let el = $('#toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(25,29,36,.92);color:#fff;font-size:13px;padding:9px 15px;border-radius:20px;z-index:99;opacity:0;transition:.2s;pointer-events:none;max-width:80vw;text-align:center';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1600);
}

/* ================= 导出 ================= */
function download(filename, text, mime){
  const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function exportWrong(){
  const ids = wrongIds();
  if(!ids.length){ toast('错题本是空的'); return; }
  const head = ['序号','题型','章节','难度','题干','选项','正确答案','解析'];
  const rows = ids.map(id => {
    const q = Q[id - 1];
    return [id, TYPE_NAME[q.type], q.chapter, q.level, q.title,
      q.options.map(o => o.key + '.' + o.text).join(' | '),
      q.type === 'text' ? q.answerText : q.answer.join(''), q.explain];
  });
  const csv = '\ufeff' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n');
  download('质量管理明白人-错题.csv', csv, 'text/csv;charset=utf-8');
  toast('已导出 ' + ids.length + ' 道错题');
}
function exportAll(){
  const rec = Object.keys(records).map(k => {
    const q = Q[Number(k) - 1];
    return { id:Number(k), type:q.type, chapter:q.chapter, level:q.level, title:q.title,
      selected:records[k].sel, correct:records[k].ok,
      answer: q.type === 'text' ? q.answerText : q.answer };
  });
  download('质量管理明白人-练习记录.json',
    JSON.stringify({ exportedAt:new Date().toISOString(), stats:stats(), records:rec }, null, 2),
    'application/json');
  toast('已导出练习记录');
}

$('#btnExportWrong').addEventListener('click', exportWrong);
$('#btnExportAll').addEventListener('click', exportAll);
$('#btnReset').addEventListener('click', () => {
  if(!confirm('将清空作答记录、错题、收藏和考试进度（筛选条件保留），确定吗？')) return;
  records = {}; favs = []; posMap = { seq:0 }; savedExam = null;
  writeJSON(KEY_REC, {}); writeJSON(KEY_FAV, []); writeJSON(KEY_POS, posMap); writeJSON(KEY_EXAM, null);
  state.exam = null;
  startMode('seq');
  toast('记录已清空');
});

$('#totalCount').textContent = Q.length;
startMode('seq');
</script>
